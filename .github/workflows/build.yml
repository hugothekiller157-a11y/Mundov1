name: MUNDO V1.2 - Correção Tela Cinza

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/android-sdk/cmdline-tools"
          cd "$RUNNER_TEMP"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O cmdline-tools.zip

          unzip -q cmdline-tools.zip
          mv cmdline-tools "$HOME/android-sdk/cmdline-tools/latest"

          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$HOME/android-sdk/platform-tools" >> "$GITHUB_PATH"

          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          adb start-server || true

      - name: Instalar Godot 4.3
        shell: bash
        run: |
          set -euxo pipefail

          cd "$RUNNER_TEMP"

          wget -q \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip \
            -O godot.zip

          unzip -q godot.zip

          chmod +x Godot_v4.3-stable_linux.x86_64

          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot

          godot --version

      - name: Instalar templates Android do Godot
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"

          cd "$RUNNER_TEMP"

          wget -q \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz \
            -O templates.tpz

          unzip -q templates.tpz

          mv templates/android_debug.apk \
            "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"

          mv templates/android_release.apk \
            "$HOME/.local/share/godot/export_templates/4.3.stable/android_release.apk"

          test -f "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"
          test -f "$HOME/.local/share/godot/export_templates/4.3.stable/android_release.apk"

      - name: Criar projeto MUNDO V1.2
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf project.godot Main.tscn scripts export_presets.cfg icon.svg build

          mkdir -p scripts
          mkdir -p build

          cat > project.godot <<'EOF'
          ; MUNDO V1.2

          config_version=5

          [application]

          config/name="MUNDO V1"
          run/main_scene="res://Main.tscn"
          config/features=PackedStringArray("4.3", "GL Compatibility")
          config/icon="res://icon.svg"

          [display]

          window/size/viewport_width=1280
          window/size/viewport_height=720
          window/size/window_width_override=1280
          window/size/window_height_override=720
          window/stretch/mode="canvas_items"

          [rendering]

          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          textures/vram_compression/import_etc2_astc=true

          [physics]

          3d/default_gravity=18.0

          [input]

          move_forward={
          "deadzone": 0.5,
          "events": [Object(InputEventKey,"physical_keycode":87)]
          }

          move_back={
          "deadzone": 0.5,
          "events": [Object(InputEventKey,"physical_keycode":83)]
          }

          move_left={
          "deadzone": 0.5,
          "events": [Object(InputEventKey,"physical_keycode":65)]
          }

          move_right={
          "deadzone": 0.5,
          "events": [Object(InputEventKey,"physical_keycode":68)]
          }

          jump={
          "deadzone": 0.5,
          "events": [Object(InputEventKey,"physical_keycode":32)]
          }
          EOF

          cat > Main.tscn <<'EOF'
          [gd_scene load_steps=2 format=3]

          [ext_resource path="res://scripts/main.gd" type="Script" id="1"]

          [node name="MundoV1" type="Node3D"]
          script = ExtResource("1")
          EOF

          cat > scripts/main.gd <<'EOF'
          extends Node3D

          var player: CharacterBody3D
          var camera: Camera3D

          var joystick_value := Vector2.ZERO
          var joystick_touch := -1
          var joystick_active := false

          var yaw := 0.0

          const SPEED := 5.0
          const JUMP := 7.0

          func _ready():
              create_environment()
              create_ground()
              create_water()
              create_player()
              create_camera()
              create_world_objects()
              create_ui()

          func make_material(color: Color, roughness: float = 0.8):
              var material := StandardMaterial3D.new()
              material.albedo_color = color
              material.roughness = roughness
              return material

          func create_environment():
              var world_environment := WorldEnvironment.new()

              var environment := Environment.new()
              environment.background_mode = Environment.BG_COLOR
              environment.background_color = Color("#78aee0")

              environment.ambient_light_source = Environment.AMBIENT_SOURCE_COLOR
              environment.ambient_light_color = Color("#dceeff")
              environment.ambient_light_energy = 0.8

              environment.tonemap_mode = Environment.TONE_MAPPER_FILMIC

              world_environment.environment = environment
              add_child(world_environment)

              var sun := DirectionalLight3D.new()
              sun.rotation_degrees = Vector3(-55.0, -35.0, 0.0)
              sun.light_color = Color("#fff2d0")
              sun.light_energy = 1.4
              sun.shadow_enabled = true
              add_child(sun)

          func create_ground():
              var ground := MeshInstance3D.new()

              var mesh := PlaneMesh.new()
              mesh.size = Vector2(100.0, 100.0)
              mesh.subdivide_width = 20
              mesh.subdivide_depth = 20

              ground.mesh = mesh
              ground.material_override = make_material(Color("#4e9147"), 1.0)

              add_child(ground)

              var body := StaticBody3D.new()

              var collision := CollisionShape3D.new()
              var shape := BoxShape3D.new()

              shape.size = Vector3(100.0, 1.0, 100.0)
              collision.shape = shape

              body.position.y = -0.5
              body.add_child(collision)

              add_child(body)

          func create_water():
              var water := MeshInstance3D.new()

              var mesh := PlaneMesh.new()
              mesh.size = Vector2(30.0, 20.0)

              water.mesh = mesh
              water.position = Vector3(10.0, 0.08, 10.0)

              var water_material := StandardMaterial3D.new()

              water_material.albedo_color = Color("#3289ad")
              water_material.roughness = 0.15
              water_material.metallic = 0.05
              water_material.transparency = BaseMaterial3D.TRANSPARENCY_ALPHA

              water_material.albedo_color.a = 0.82

              water.material_override = water_material

              add_child(water)

          func create_player():
              player = CharacterBody3D.new()
              player.name = "Player"
              player.position = Vector3(0.0, 1.2, 6.0)

              add_child(player)

              var body_mesh := MeshInstance3D.new()

              var capsule := CapsuleMesh.new()
              capsule.radius = 0.42
              capsule.height = 1.8
              capsule.radial_segments = 20
              capsule.rings = 8

              body_mesh.mesh = capsule
              body_mesh.position.y = 0.9
              body_mesh.material_override = make_material(Color("#e0a83f"), 0.75)

              player.add_child(body_mesh)

              var head := MeshInstance3D.new()

              var head_mesh := SphereMesh.new()
              head_mesh.radius = 0.38
              head_mesh.height = 0.76
              head_mesh.radial_segments = 20
              head_mesh.rings = 12

              head.mesh = head_mesh
              head.position = Vector3(0.0, 2.05, 0.0)
              head.material_override = make_material(Color("#efc49d"), 0.7)

              player.add_child(head)

              var collision := CollisionShape3D.new()

              var collision_shape := CapsuleShape3D.new()
              collision_shape.radius = 0.42
              collision_shape.height = 1.8

              collision.shape = collision_shape
              collision.position.y = 0.9

              player.add_child(collision)

          func create_camera():
              camera = Camera3D.new()
              camera.name = "MainCamera"

              add_child(camera)

              camera.current = true
              camera.position = Vector3(0.0, 4.5, 12.0)
              camera.look_at(Vector3(0.0, 1.0, 6.0), Vector3.UP)

          func create_tree(position: Vector3, scale_value: float):
              var tree := Node3D.new()
              tree.position = position
              tree.scale = Vector3.ONE * scale_value

              add_child(tree)

              var trunk := MeshInstance3D.new()

              var trunk_mesh := CylinderMesh.new()
              trunk_mesh.top_radius = 0.25
              trunk_mesh.bottom_radius = 0.35
              trunk_mesh.height = 3.2
              trunk_mesh.radial_segments = 12

              trunk.mesh = trunk_mesh
              trunk.position.y = 1.6
              trunk.material_override = make_material(Color("#68462d"))

              tree.add_child(trunk)

              var leaves := MeshInstance3D.new()

              var leaves_mesh := SphereMesh.new()
              leaves_mesh.radius = 1.5
              leaves_mesh.height = 2.4
              leaves_mesh.radial_segments = 18
              leaves_mesh.rings = 10

              leaves.mesh = leaves_mesh
              leaves.position.y = 3.6
              leaves.scale = Vector3(1.2, 0.9, 1.2)
              leaves.material_override = make_material(Color("#347b3b"))

              tree.add_child(leaves)

              var leaves2 := MeshInstance3D.new()
              leaves2.mesh = leaves_mesh
              leaves2.position = Vector3(-0.8, 3.2, 0.2)
              leaves2.scale = Vector3(0.8, 0.75, 0.8)
              leaves2.material_override = make_material(Color("#408b42"))

              tree.add_child(leaves2)

          func create_rock(position: Vector3, scale_value: Vector3):
              var rock := MeshInstance3D.new()

              var mesh := SphereMesh.new()
              mesh.radius = 1.0
              mesh.height = 1.5
              mesh.radial_segments = 12
              mesh.rings = 8

              rock.mesh = mesh
              rock.position = position
              rock.scale = scale_value
              rock.material_override = make_material(Color("#77756c"), 1.0)

              add_child(rock)

          func create_world_objects():
              var tree_positions = [
                  Vector3(-18, 0, -15),
                  Vector3(-12, 0, -25),
                  Vector3(18, 0, -18),
                  Vector3(25, 0, -10),
                  Vector3(-25, 0, 14),
                  Vector3(-16, 0, 28),
                  Vector3(23, 0, 27),
                  Vector3(32, 0, 12),
                  Vector3(5, 0, -28)
              ]

              var index := 0

              for position in tree_positions:
                  create_tree(position, 0.85 + float(index % 3) * 0.12)
                  index += 1

              create_rock(Vector3(-8, 0.45, -8), Vector3(1.5, 0.8, 1.0))
              create_rock(Vector3(14, 0.45, -5), Vector3(1.0, 0.6, 1.3))
              create_rock(Vector3(-25, 0.5, 5), Vector3(1.8, 0.9, 1.2))
              create_rock(Vector3(28, 0.45, 5), Vector3(1.2, 0.7, 1.0))
              create_rock(Vector3(0, 0.35, 20), Vector3(1.4, 0.5, 1.0))

          func create_ui():
              var canvas := CanvasLayer.new()
              canvas.name = "Interface"
              add_child(canvas)

              var background := ColorRect.new()

              background.position = Vector2.ZERO
              background.size = Vector2(1280, 720)
              background.color = Color(0.02, 0.05, 0.08, 0.18)
              background.mouse_filter = Control.MOUSE_FILTER_IGNORE

              canvas.add_child(background)

              var title := Label.new()

              title.text = "MUNDO V1"
              title.position = Vector2(35, 28)
              title.add_theme_font_size_override("font_size", 36)
              title.add_theme_color_override("font_color", Color.WHITE)

              canvas.add_child(title)

              var subtitle := Label.new()

              subtitle.text = "V1.2  •  NOVO MUNDO"
              subtitle.position = Vector2(38, 72)
              subtitle.add_theme_font_size_override("font_size", 17)
              subtitle.add_theme_color_override("font_color", Color("#d7f0ff"))

              canvas.add_child(subtitle)

              var center := Label.new()

              center.text = "EXPLORE O MUNDO"
              center.position = Vector2(430, 315)
              center.size = Vector2(420, 60)
              center.horizontal_alignment = HORIZONTAL_ALIGNMENT_CENTER
              center.add_theme_font_size_override("font_size", 30)
              center.add_theme_color_override("font_color", Color.WHITE)

              canvas.add_child(center)

              var info := Label.new()

              info.text = "Movimente-se • Descubra • Construa"
              info.position = Vector2(430, 365)
              info.size = Vector2(420, 40)
              info.horizontal_alignment = HORIZONTAL_ALIGNMENT_CENTER
              info.add_theme_font_size_override("font_size", 17)
              info.add_theme_color_override("font_color", Color("#e2f5ff"))

              canvas.add_child(info)

              var joystick_base := ColorRect.new()

              joystick_base.position = Vector2(45, 500)
              joystick_base.size = Vector2(150, 150)
              joystick_base.color = Color(0.02, 0.05, 0.08, 0.38)
              joystick_base.mouse_filter = Control.MOUSE_FILTER_STOP

              canvas.add_child(joystick_base)

              joystick_base.gui_input.connect(_joystick_input.bind(joystick_base))

              var knob := ColorRect.new()

              knob.name = "Knob"
              knob.position = Vector2(52, 52)
              knob.size = Vector2(46, 46)
              knob.color = Color(1, 1, 1, 0.65)
              knob.mouse_filter = Control.MOUSE_FILTER_IGNORE

              joystick_base.add_child(knob)

              var jump := Button.new()

              jump.text = "PULAR"
              jump.position = Vector2(1050, 565)
              jump.size = Vector2(150, 75)
              jump.add_theme_font_size_override("font_size", 20)

              jump.pressed.connect(_jump)

              canvas.add_child(jump)

              var action := Button.new()

              action.text = "AÇÃO"
              action.position = Vector2(880, 600)
              action.size = Vector2(130, 65)
              action.add_theme_font_size_override("font_size", 18)

              canvas.add_child(action)

          func _joystick_input(event: InputEvent, joystick: Control):
              var knob := joystick.get_node("Knob") as Control

              if event is InputEventScreenTouch:
                  if event.pressed:
                      joystick_active = true
                      joystick_touch = event.index
                      update_joystick(event.position, joystick, knob)

                  elif event.index == joystick_touch:
                      joystick_active = false
                      joystick_touch = -1
                      joystick_value = Vector2.ZERO
                      knob.position = Vector2(52, 52)

              elif event is InputEventScreenDrag:
                  if event.index == joystick_touch:
                      update_joystick(event.position, joystick, knob)

          func update_joystick(position: Vector2, joystick: Control, knob: Control):
              var center := Vector2(75, 75)
              var local_position := position - joystick.global_position
              var offset := local_position - center

              if offset.length() > 55.0:
                  offset = offset.normalized() * 55.0

              joystick_value = offset / 55.0
              knob.position = center + offset - Vector2(23, 23)

          func _jump():
              if player != null and player.is_on_floor():
                  player.velocity.y = JUMP

          func _physics_process(delta):
              if player == null:
                  return

              var input_vector := Vector2(
                  Input.get_axis("move_left", "move_right"),
                  Input.get_axis("move_forward", "move_back")
              )

              if joystick_value.length() > 0.05:
                  input_vector = joystick_value

              var direction := Vector3(
                  input_vector.x,
                  0.0,
                  input_vector.y
              )

              if direction.length() > 1.0:
                  direction = direction.normalized()

              player.velocity.x = direction.x * SPEED
              player.velocity.z = direction.z * SPEED

              if not player.is_on_floor():
                  player.velocity.y -= 18.0 * delta
              elif Input.is_action_just_pressed("jump"):
                  player.velocity.y = JUMP

              player.move_and_slide()

              update_camera(delta)

          func update_camera(delta):
              if camera == null or player == null:
                  return

              var target := player.global_position + Vector3(0.0, 1.2, 0.0)

              var desired := target + Vector3(
                  sin(deg_to_rad(yaw)) * 9.0,
                  4.5,
                  cos(deg_to_rad(yaw)) * 9.0
              )

              camera.global_position = camera.global_position.lerp(
                  desired,
                  5.0 * delta
              )

              camera.look_at(target, Vector3.UP)

          func _unhandled_input(event):
              if event is InputEventMouseMotion:
                  if Input.is_mouse_button_pressed(MOUSE_BUTTON_LEFT):
                      yaw -= event.relative.x * 0.25
          EOF

          cat > export_presets.cfg <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""

          gradle_build/use_gradle_build=false

          package/unique_name="com.mundov1.game"
          package/name="MUNDO V1"
          package/signed=true
          package/app_category=0
          package/retain_data_on_uninstall=false

          version/code=12
          version/name="1.2"

          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false

          permissions/internet=true
          permissions/access_network_state=true

          screen/immersive_mode=true
          screen/orientation=1

          graphics/driver/driver_name="opengl3"
          graphics/driver/driver_name.mobile="opengl3"

          [preset.0.options.splash]

          image=""
          bg_color=Color(0.08, 0.12, 0.18, 1)
          scale=1
          show_image=true
          fullsize=false
          use_filter=true
          EOF

          cat > icon.svg <<'EOF'
          <svg width="128" height="128" xmlns="http://www.w3.org/2000/svg">
            <rect width="128" height="128" rx="28" fill="#214f35"/>
            <circle cx="64" cy="58" r="34" fill="#62a84f"/>
            <path d="M30 84 Q64 55 98 84" fill="none" stroke="#d8f0c8" stroke-width="8"/>
            <circle cx="50" cy="54" r="5" fill="#ffffff"/>
            <circle cx="78" cy="54" r="5" fill="#ffffff"/>
          </svg>
          EOF

      - name: Configurar Godot Android
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource format=3]

          [resource]

          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF

          test -f "$HOME/.config/godot/editor_settings-4.tres"

      - name: Criar keystore debug
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/.android"

          keytool \
            -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -noprompt || true

          test -f "$HOME/.android/debug.keystore"

      - name: Validar projeto
        shell: bash
        run: |
          set -euxo pipefail

          test -f project.godot
          test -f Main.tscn
          test -f scripts/main.gd
          test -f export_presets.cfg
          test -f icon.svg

          grep -q "gl_compatibility" project.godot
          grep -q 'name="Android"' export_presets.cfg
          grep -q 'arm64-v8a=true' export_presets.cfg
          grep -q 'player.is_on_floor' scripts/main.gd

          echo "MUNDO V1.2 validado."

      - name: Testar carregamento do projeto
        shell: bash
        run: |
          set -euxo pipefail

          godot \
            --headless \
            --path "$GITHUB_WORKSPACE" \
            --editor \
            --quit

          echo "Projeto Godot carregado sem erro."

      - name: Exportar APK ARM64
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p build

          godot \
            --headless \
            --path "$GITHUB_WORKSPACE" \
            --export-debug "Android" \
            build/MundoV1.apk

          test -f build/MundoV1.apk

          ls -lh build/MundoV1.apk

      - name: Verificar APK
        shell: bash
        run: |
          set -euxo pipefail

          "$ANDROID_HOME/build-tools/34.0.0/apksigner" \
            verify \
            --verbose \
            build/MundoV1.apk

          echo "APK MUNDO V1.2 validado com sucesso."

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MundoV1-APK-V1.2
          path: build/MundoV1.apk
          if-no-files-found: error
