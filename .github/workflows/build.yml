name: MUNDO V1 - V2.1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/34.0.0:$PATH"

          mkdir -p "$ANDROID_HOME/cmdline-tools"

          cd "$RUNNER_TEMP"

          curl -L -o commandlinetools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip

          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"

          unzip -q commandlinetools.zip \
            -d "$ANDROID_HOME/cmdline-tools/latest"

          mv "$ANDROID_HOME/cmdline-tools/latest/cmdline-tools/"* \
             "$ANDROID_HOME/cmdline-tools/latest/"

          rm -rf "$ANDROID_HOME/cmdline-tools/latest/cmdline-tools"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"

      - name: Instalar Godot 4.3
        shell: bash
        run: |
          set -euxo pipefail

          cd "$RUNNER_TEMP"

          curl -L -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip

          unzip -q godot.zip

          chmod +x Godot_v4.3-stable_linux.x86_64

          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot

          godot --version

      - name: Instalar templates Android do Godot
        shell: bash
        run: |
          set -euxo pipefail

          cd "$RUNNER_TEMP"

          curl -L -o templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz

          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"

          unzip -q templates.tpz \
            -d "$RUNNER_TEMP/templates"

          find "$RUNNER_TEMP/templates" \
            -type f \
            -name "android_debug.apk" \
            -exec cp {} "$HOME/.local/share/godot/export_templates/4.3.stable/" \;

          find "$RUNNER_TEMP/templates" \
            -type f \
            -name "android_release.apk" \
            -exec cp {} "$HOME/.local/share/godot/export_templates/4.3.stable/" \;

          find "$RUNNER_TEMP/templates" \
            -type f \
            -name "android_source.zip" \
            -exec cp {} "$HOME/.local/share/godot/export_templates/4.3.stable/" \;

          ls -la "$HOME/.local/share/godot/export_templates/4.3.stable"

      - name: Criar projeto MUNDO V1 V2.1
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf project.godot Main.tscn scripts assets build
          mkdir -p scripts assets build

          cat > project.godot <<'EOF'
          ; MUNDO V1 - V2.1

          config_version=5

          [application]

          config/name="MUNDO V1"
          run/main_scene="res://Main.tscn"
          config/features=PackedStringArray("4.3", "GL Compatibility")
          config/icon="res://icon.svg"

          [display]

          window/size/viewport_width=1280
          window/size/viewport_height=720
          window/size/window_width_override=1280
          window/size/window_height_override=720
          window/stretch/mode="canvas_items"

          [rendering]

          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          textures/default_filters/use_nearest_mipmap_filter=false
          textures/vram_compression/import_etc2_astc=true

          [input]

          move_left={
          "deadzone": 0.5,
          "events": [Object(InputEventKey,"physical_keycode":65)]
          }

          move_right={
          "deadzone": 0.5,
          "events": [Object(InputEventKey,"physical_keycode":68)]
          }

          move_forward={
          "deadzone": 0.5,
          "events": [Object(InputEventKey,"physical_keycode":87)]
          }

          move_backward={
          "deadzone": 0.5,
          "events": [Object(InputEventKey,"physical_keycode":83)]
          }

          jump={
          "deadzone": 0.5,
          "events": [Object(InputEventKey,"physical_keycode":32)]
          }

          sprint={
          "deadzone": 0.5,
          "events": [Object(InputEventKey,"physical_keycode":4194325)]
          }

          [display/window]

          size/viewport_width=1280
          size/viewport_height=720
          size/window_width_override=1280
          size/window_height_override=720
          stretch/mode="canvas_items"
          EOF

          cat > icon.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
            <defs>
              <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#6fc9ff"/>
                <stop offset="1" stop-color="#285e9b"/>
              </linearGradient>
              <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#79ad57"/>
                <stop offset="1" stop-color="#315f3c"/>
              </linearGradient>
            </defs>

            <rect x="10" y="10" width="236" height="236" rx="55" fill="url(#sky)"/>
            <circle cx="181" cy="66" r="28" fill="#fff0a6"/>

            <path d="M18 172 Q72 112 122 156 Q160 115 242 164 L242 225 L18 225 Z"
                  fill="#5b914c"/>

            <path d="M18 192 Q92 150 142 185 Q190 151 242 190 L242 236 L18 236 Z"
                  fill="url(#ground)"/>

            <path d="M48 190 L78 120 L108 190 Z" fill="#3f7045"/>
            <path d="M166 191 L193 111 L226 191 Z" fill="#396a43"/>

            <circle cx="78" cy="121" r="14" fill="#4b874d"/>
            <circle cx="193" cy="112" r="15" fill="#4b874d"/>

            <text x="128" y="217"
                  text-anchor="middle"
                  font-family="sans-serif"
                  font-size="27"
                  font-weight="bold"
                  fill="white">MUNDO</text>
          </svg>
          EOF

          cat > Main.tscn <<'EOF'
          [gd_scene load_steps=2 format=3]

          [ext_resource path="res://scripts/main.gd" type="Script" id="1"]

          [node name="MundoV1" type="Node3D"]
          script = ExtResource("1")
          EOF

          cat > scripts/main.gd <<'EOF'
          extends Node3D

          var player: CharacterBody3D
          var camera: Camera3D

          var move_input: Vector2 = Vector2.ZERO

          var health: float = 100.0
          var wood: int = 0
          var stone: int = 0

          var stamina: float = 100.0
          var camera_distance: float = 8.8
          var camera_height: float = 4.7

          var joystick_center: Vector2 = Vector2(115, 585)
          var joystick_active: bool = false
          var joystick_id: int = -1

          var sprint_active: bool = false

          var health_label: Label
          var inventory_label: Label
          var status_label: Label
          var stamina_label: Label

          var player_visual: Node3D
          var player_body: MeshInstance3D
          var player_head: MeshInstance3D

          var water_time: float = 0.0
          var walk_time: float = 0.0

          var resources: Array[Node3D] = []
          var built_objects: Array[Node3D] = []


          func _ready() -> void:
              create_environment()
              create_world()
              create_player()
              create_interface()


          func make_material(
              color: Color,
              roughness: float = 0.85,
              metallic: float = 0.0
          ) -> StandardMaterial3D:
              var material := StandardMaterial3D.new()
              material.albedo_color = color
              material.roughness = roughness
              material.metallic = metallic
              return material


          func create_environment() -> void:
              var world := WorldEnvironment.new()

              var environment := Environment.new()
              environment.background_mode = Environment.BG_COLOR
              environment.background_color = Color("#82c4ea")

              environment.ambient_light_source = Environment.AMBIENT_SOURCE_COLOR
              environment.ambient_light_color = Color("#e8f5ff")
              environment.ambient_light_energy = 0.90

              environment.tonemap_mode = Environment.TONE_MAPPER_FILMIC
              environment.tonemap_exposure = 1.08

              environment.fog_enabled = true
              environment.fog_light_color = Color("#b9dff2")
              environment.fog_light_energy = 0.42
              environment.fog_density = 0.007
              environment.fog_height = 4.0
              environment.fog_height_density = 0.035

              world.environment = environment
              add_child(world)

              var sun := DirectionalLight3D.new()
              sun.rotation_degrees = Vector3(-48.0, -32.0, 0.0)
              sun.light_color = Color("#fff4dc")
              sun.light_energy = 1.25
              sun.shadow_enabled = true
              sun.directional_shadow_max_distance = 90.0
              sun.directional_shadow_split_1 = 0.12
              sun.directional_shadow_split_2 = 0.30
              sun.directional_shadow_split_3 = 0.58
              sun.shadow_bias = 0.035
              add_child(sun)

              var fill := DirectionalLight3D.new()
              fill.rotation_degrees = Vector3(-25.0, 145.0, 0.0)
              fill.light_color = Color("#b9dcff")
              fill.light_energy = 0.20
              fill.shadow_enabled = false
              add_child(fill)


          func create_world() -> void:
              create_ground()
              create_water()
              create_terrain_features()

              var trees := [
                  Vector3(-18, 0, -8),
                  Vector3(-11, 0, -17),
                  Vector3(18, 0, -20),
                  Vector3(25, 0, -8),
                  Vector3(31, 0, 5),
                  Vector3(-25, 0, 12),
                  Vector3(-17, 0, 25),
                  Vector3(15, 0, 24),
                  Vector3(4, 0, -25),
                  Vector3(35, 0, -18),
                  Vector3(-35, 0, 2)
              ]

              for position in trees:
                  create_tree(position)

              for i in range(5):
                  create_pine(
                      Vector3(
                          -34.0 + float(i * 5),
                          0,
                          -7.0 + float(i * 8)
                      )
                  )

              for i in range(42):
                  var x := -47.0 + float((i * 17) % 94)
                  var z := -42.0 + float((i * 29) % 84)

                  if abs(x - 10.0) < 24.0 and abs(z + 8.0) < 15.0:
                      continue

                  create_bush(Vector3(x, 0, z))

              for i in range(65):
                  var x := -49.0 + float((i * 31) % 98)
                  var z := -44.0 + float((i * 23) % 88)
                  create_grass(Vector3(x, 0, z))

              for i in range(25):
                  var x := -44.0 + float((i * 37) % 88)
                  var z := -39.0 + float((i * 19) % 78)
                  create_flower(Vector3(x, 0, z))

              for i in range(9):
                  var x := -38.0 + float((i * 21) % 76)
                  var z := -32.0 + float((i * 27) % 64)
                  create_rock(Vector3(x, 0, z))

              create_resource(Vector3(-5, 0.35, -3), "MADEIRA")
              create_resource(Vector3(9, 0.35, 3), "MADEIRA")
              create_resource(Vector3(-12, 0.35, 9), "PEDRA")
              create_resource(Vector3(16, 0.35, 12), "PEDRA")
              create_resource(Vector3(-21, 0.35, -4), "MADEIRA")
              create_resource(Vector3(22, 0.35, 17), "PEDRA")


          func create_ground() -> void:
              var ground := MeshInstance3D.new()

              var mesh := PlaneMesh.new()
              mesh.size = Vector2(110, 110)
              mesh.subdivide_width = 28
              mesh.subdivide_depth = 28

              ground.mesh = mesh
              ground.position.y = -0.05
              ground.material_override = make_material(Color("#5f9448"), 1.0)

              add_child(ground)

              var body := StaticBody3D.new()

              var collision := CollisionShape3D.new()
              var shape := BoxShape3D.new()
              shape.size = Vector3(110, 1, 110)

              collision.shape = shape
              collision.position.y = -0.5

              body.add_child(collision)
              add_child(body)


          func create_terrain_features() -> void:
              var hills := [
                  Vector3(-25.0, 2.5, -22.0),
                  Vector3(29.0, 3.0, -24.0),
                  Vector3(34.0, 2.0, 18.0),
                  Vector3(-31.0, 2.2, 25.0),
                  Vector3(42.0, 1.7, -2.0)
              ]

              for position in hills:
                  var hill := MeshInstance3D.new()
                  var mesh := SphereMesh.new()

                  mesh.radius = 6.0
                  mesh.height = 8.0
                  mesh.radial_segments = 20
                  mesh.rings = 10

                  hill.mesh = mesh
                  hill.position = position + Vector3(0, 1.0, 0)
                  hill.scale = Vector3(1.8, 0.65, 1.5)
                  hill.material_override = make_material(
                      Color("#668f4d"),
                      1.0
                  )

                  add_child(hill)

              for i in range(8):
                  var shore := MeshInstance3D.new()
                  var shore_mesh := BoxMesh.new()

                  shore_mesh.size = Vector3(
                      4.0 + float(i % 3),
                      0.025,
                      0.7
                  )

                  shore.mesh = shore_mesh
                  shore.position = Vector3(
                      -5.0 + float(i * 4),
                      0.025,
                      6.0 + sin(float(i)) * 12.0
                  )

                  shore.material_override = make_material(
                      Color("#b8a36a"),
                      1.0
                  )

                  add_child(shore)


          func create_water() -> void:
              var water := MeshInstance3D.new()

              var mesh := PlaneMesh.new()
              mesh.size = Vector2(45, 27)
              mesh.subdivide_width = 16
              mesh.subdivide_depth = 12

              water.mesh = mesh
              water.position = Vector3(10, 0.065, -8)
              water.add_to_group("water")

              var material := make_material(
                  Color(0.055, 0.39, 0.58, 0.76),
                  0.07,
                  0.05
              )

              material.transparency = BaseMaterial3D.TRANSPARENCY_ALPHA
              material.shading_mode = BaseMaterial3D.SHADING_MODE_PER_PIXEL
              material.cull_mode = BaseMaterial3D.CULL_DISABLED

              water.material_override = material
              add_child(water)

              for i in range(9):
                  var shine := MeshInstance3D.new()
                  var shine_mesh := BoxMesh.new()

                  shine_mesh.size = Vector3(
                      2.0 + float(i % 3),
                      0.018,
                      0.045
                  )

                  shine.mesh = shine_mesh
                  shine.position = Vector3(
                      -5.0 + float(i * 4.8),
                      0.09,
                      -13.0 + float(i % 4) * 5.0
                  )

                  shine.material_override = make_material(
                      Color(0.70, 0.92, 1.0, 0.38),
                      0.04
                  )

                  add_child(shine)


          func create_tree(position: Vector3) -> void:
              var tree := Node3D.new()
              tree.position = position
              add_child(tree)

              var trunk := MeshInstance3D.new()
              var trunk_mesh := CylinderMesh.new()

              trunk_mesh.top_radius = 0.23
              trunk_mesh.bottom_radius = 0.37
              trunk_mesh.height = 2.8
              trunk_mesh.radial_segments = 10

              trunk.mesh = trunk_mesh
              trunk.position.y = 1.4
              trunk.material_override = make_material(
                  Color("#6b4931"),
                  0.92
              )

              tree.add_child(trunk)

              for i in range(5):
                  var crown := MeshInstance3D.new()
                  var crown_mesh := SphereMesh.new()

                  crown_mesh.radius = 1.45
                  crown_mesh.height = 2.3
                  crown_mesh.radial_segments = 12
                  crown_mesh.rings = 7

                  crown.mesh = crown_mesh

                  crown.position = Vector3(
                      -0.65 + float(i % 3) * 0.65,
                      2.55 + float(i / 3) * 0.72,
                      -0.30 + float((i * 2) % 3) * 0.38
                  )

                  crown.scale = Vector3(
                      1.0,
                      0.82,
                      0.92
                  )

                  crown.material_override = make_material(
                      Color("#3f7e48"),
                      0.95
                  )

                  tree.add_child(crown)


          func create_pine(position: Vector3) -> void:
              var tree := Node3D.new()
              tree.position = position
              add_child(tree)

              var trunk := MeshInstance3D.new()
              var trunk_mesh := CylinderMesh.new()

              trunk_mesh.top_radius = 0.16
              trunk_mesh.bottom_radius = 0.25
              trunk_mesh.height = 2.2

              trunk.mesh = trunk_mesh
              trunk.position.y = 1.1
              trunk.material_override = make_material(
                  Color("#61422f"),
                  0.95
              )

              tree.add_child(trunk)

              for i in range(3):
                  var cone := MeshInstance3D.new()
                  var cone_mesh := CylinderMesh.new()

                  cone_mesh.top_radius = 0.0
                  cone_mesh.bottom_radius = 1.45 - float(i) * 0.28
                  cone_mesh.height = 2.3
                  cone_mesh.radial_segments = 12

                  cone.mesh = cone_mesh
                  cone.position.y = 2.0 + float(i) * 0.75
                  cone.material_override = make_material(
                      Color("#2f6842"),
                      0.96
                  )

                  tree.add_child(cone)


          func create_bush(position: Vector3) -> void:
              var bush := MeshInstance3D.new()
              var mesh := SphereMesh.new()

              mesh.radius = 0.48
              mesh.height = 0.75
              mesh.radial_segments = 8
              mesh.rings = 5

              bush.mesh = mesh
              bush.position = position + Vector3(0, 0.35, 0)
              bush.scale = Vector3(1.25, 0.7, 1.0)
              bush.material_override = make_material(
                  Color("#477f3e"),
                  0.96
              )

              add_child(bush)


          func create_grass(position: Vector3) -> void:
              var grass := MeshInstance3D.new()
              var mesh := BoxMesh.new()

              mesh.size = Vector3(0.08, 0.45, 0.08)

              grass.mesh = mesh
              grass.position = position + Vector3(0, 0.22, 0)

              grass.rotation_degrees.y = (
                  (position.x + position.z) * 17.0
              )

              grass.material_override = make_material(
                  Color("#76a84e"),
                  0.95
              )

              add_child(grass)


          func create_flower(position: Vector3) -> void:
              var flower := MeshInstance3D.new()
              var mesh := SphereMesh.new()

              mesh.radius = 0.11
              mesh.height = 0.22
              mesh.radial_segments = 8
              mesh.rings = 4

              flower.mesh = mesh
              flower.position = position + Vector3(0, 0.2, 0)

              var flower_colors := [
                  Color("#f1c75b"),
                  Color("#e77b86"),
                  Color("#c99bea")
              ]

              var index := int(
                  abs(position.x + position.z)
              ) % flower_colors.size()

              flower.material_override = make_material(
                  flower_colors[index],
                  0.75
              )

              add_child(flower)


          func create_rock(position: Vector3) -> void:
              var rock := MeshInstance3D.new()
              var mesh := SphereMesh.new()

              mesh.radius = 0.55
              mesh.height = 0.8
              mesh.radial_segments = 8
              mesh.rings = 5

              rock.mesh = mesh
              rock.position = position + Vector3(0, 0.35, 0)
              rock.scale = Vector3(1.3, 0.7, 0.95)
              rock.material_override = make_material(
                  Color("#777b77"),
                  1.0
              )

              add_child(rock)


          func create_resource(
              position: Vector3,
              resource_type: String
          ) -> void:
              var resource := Area3D.new()
              resource.name = resource_type

              var mesh_instance := MeshInstance3D.new()

              if resource_type == "MADEIRA":
                  var mesh := CylinderMesh.new()
                  mesh.top_radius = 0.35
                  mesh.bottom_radius = 0.42
                  mesh.height = 1.0
                  mesh.radial_segments = 8

                  mesh_instance.mesh = mesh
                  mesh_instance.material_override = make_material(
                      Color("#8a5b32"),
                      0.9
                  )

              else:
                  var mesh := SphereMesh.new()
                  mesh.radius = 0.52
                  mesh.height = 0.8
                  mesh.radial_segments = 8
                  mesh.rings = 5

                  mesh_instance.mesh = mesh
                  mesh_instance.material_override = make_material(
                      Color("#777b80"),
                      1.0
                  )

              mesh_instance.position.y = 0.55
              resource.add_child(mesh_instance)

              var collision := CollisionShape3D.new()
              var shape := SphereShape3D.new()

              shape.radius = 0.65
              collision.shape = shape
              collision.position.y = 0.55

              resource.add_child(collision)
              resource.position = position

              resource.body_entered.connect(
                  func(body: Node) -> void:
                      if body == player:
                          collect_resource(
                              resource,
                              resource_type
                          )
              )

              add_child(resource)
              resources.append(resource)


          func collect_resource(
              resource: Node3D,
              resource_type: String
          ) -> void:
              if not is_instance_valid(resource):
                  return

              if resource_type == "MADEIRA":
                  wood += 1
              else:
                  stone += 1

              create_collect_effect(resource.global_position)

              status_label.text = (
                  "RECURSO COLETADO!"
              )

              resources.erase(resource)
              resource.queue_free()

              update_interface()


          func create_collect_effect(position: Vector3) -> void:
              var effect := MeshInstance3D.new()
              var mesh := SphereMesh.new()

              mesh.radius = 0.16
              mesh.height = 0.32
              mesh.radial_segments = 8

              effect.mesh = mesh
              effect.position = position + Vector3(0, 0.7, 0)
              effect.material_override = make_material(
                  Color("#ffe88a"),
                  0.2
              )

              add_child(effect)

              var tween := create_tween()
              tween.tween_property(
                  effect,
                  "position:y",
                  effect.position.y + 1.2,
                  0.35
              )
              tween.parallel().tween_property(
                  effect,
                  "scale",
                  Vector3(2.0, 2.0, 2.0),
                  0.35
              )
              tween.tween_callback(effect.queue_free)


          func create_player() -> void:
              player = CharacterBody3D.new()
              player.name = "Player"
              player.position = Vector3(0, 1.3, 8)

              var collision := CollisionShape3D.new()
              var shape := CapsuleShape3D.new()

              shape.radius = 0.43
              shape.height = 1.8
              collision.shape = shape
              collision.position.y = 0.9

              player.add_child(collision)

              player_visual = Node3D.new()
              player_visual.name = "Visual"
              player.add_child(player_visual)

              player_body = MeshInstance3D.new()
              var body_mesh := CapsuleMesh.new()

              body_mesh.radius = 0.43
              body_mesh.height = 1.8
              body_mesh.radial_segments = 12
              body_mesh.rings = 6

              player_body.mesh = body_mesh
              player_body.position.y = 0.9
              player_body.material_override = make_material(
                  Color("#3d72a8"),
                  0.75
              )

              player_visual.add_child(player_body)

              player_head = MeshInstance3D.new()
              var head_mesh := SphereMesh.new()

              head_mesh.radius = 0.42
              head_mesh.height = 0.84
              head_mesh.radial_segments = 14
              head_mesh.rings = 9

              player_head.mesh = head_mesh
              player_head.position.y = 2.0
              player_head.material_override = make_material(
                  Color("#d99d70"),
                  0.82
              )

              player_visual.add_child(player_head)

