name: Mundo V1 - APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$HOME/android-sdk"

          mkdir -p "$ANDROID_HOME/cmdline-tools"

          cd /tmp

          wget -q \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -O cmdline-tools.zip

          rm -rf /tmp/cmdline-tools

          mkdir -p /tmp/cmdline-tools

          unzip -q \
            cmdline-tools.zip \
            -d /tmp/cmdline-tools

          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"

          cp -r \
            /tmp/cmdline-tools/cmdline-tools/. \
            "$ANDROID_HOME/cmdline-tools/latest/"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"

      - name: Instalar SDK 34
        shell: bash
        run: |
          set -euxo pipefail

          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$HOME/android-sdk"

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          yes | sdkmanager --licenses >/dev/null || true

          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/build-tools/34.0.0"

          echo "Android SDK OK"

      - name: Baixar Godot
        shell: bash
        run: |
          set -euxo pipefail

          cd /tmp

          wget -q \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip" \
            -O godot.zip

          unzip -q godot.zip

          chmod +x Godot_v4.3-stable_linux.x86_64

          cp \
            Godot_v4.3-stable_linux.x86_64 \
            "$GITHUB_WORKSPACE/Godot"

      - name: Templates Godot Android
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p \
            "$HOME/.local/share/godot/export_templates/4.3.stable"

          cd /tmp

          wget -q \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" \
            -O templates.tpz

          rm -rf godot_templates

          mkdir -p godot_templates

          unzip -q \
            templates.tpz \
            -d godot_templates

          cp -r \
            godot_templates/templates/. \
            "$HOME/.local/share/godot/export_templates/4.3.stable/"

          ls -la \
            "$HOME/.local/share/godot/export_templates/4.3.stable"

      - name: Configurar Godot
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]

          android/adb = "$HOME/android-sdk/platform-tools/adb"
          android/sdk_path = "$HOME/android-sdk"
          EOF

      - name: Criar projeto
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p scripts
          mkdir -p build

          cat > project.godot <<'EOF'
          [application]

          config/name="Mundo V1"
          config/description="Mundo V1"
          run/main_scene="res://Main.tscn"

          [display]

          window/size/viewport_width=1280
          window/size/viewport_height=720
          window/size/window_width_override=1280
          window/size/window_height_override=720

          [rendering]

          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"

          environment/defaults/default_clear_color=Color(0.38, 0.62, 0.88, 1)

          [input]

          move_forward={
          "deadzone": 0.5,
          "events": [Object(InputEventKey,"physical_keycode":87)]
          }

          move_back={
          "deadzone": 0.5,
          "events": [Object(InputEventKey,"physical_keycode":83)]
          }

          move_left={
          "deadzone": 0.5,
          "events": [Object(InputEventKey,"physical_keycode":65)]
          }

          move_right={
          "deadzone": 0.5,
          "events": [Object(InputEventKey,"physical_keycode":68)]
          }

          jump={
          "deadzone": 0.5,
          "events": [Object(InputEventKey,"physical_keycode":32)]
          }
          EOF

          cat > Main.tscn <<'EOF'
          [gd_scene load_steps=2 format=3]

          [ext_resource path="res://scripts/main.gd" type="Script" id="1"]

          [node name="MundoV1" type="Node3D"]
          script = ExtResource("1")
          EOF

          cat > scripts/main.gd <<'EOF'
          extends Node3D

          var player: CharacterBody3D
          var camera: Camera3D

          func _ready():
              criar_mundo()
              criar_jogador()
              criar_interface()

          func material(c: Color):
              var m := StandardMaterial3D.new()
              m.albedo_color = c
              m.roughness = 0.85
              return m

          func criar_mundo():

              var ambiente := WorldEnvironment.new()
              var env := Environment.new()

              env.background_mode = Environment.BG_COLOR
              env.background_color = Color(0.38, 0.62, 0.88)
              env.ambient_light_source = Environment.AMBIENT_SOURCE_COLOR
              env.ambient_light_color = Color(0.8, 0.85, 1.0)
              env.ambient_light_energy = 0.8

              ambiente.environment = env
              add_child(ambiente)

              var sol := DirectionalLight3D.new()
              sol.rotation_degrees = Vector3(-50, -30, 0)
              sol.light_energy = 1.2
              sol.shadow_enabled = true

              add_child(sol)

              var terreno := StaticBody3D.new()
              terreno.position = Vector3(0, -1, 0)

              add_child(terreno)

              var mesh := MeshInstance3D.new()
              var box := BoxMesh.new()

              box.size = Vector3(80, 2, 80)

              mesh.mesh = box
              mesh.material_override = material(
                  Color(0.30, 0.60, 0.25)
              )

              terreno.add_child(mesh)

              var col := CollisionShape3D.new()
              var forma := BoxShape3D.new()

              forma.size = Vector3(80, 2, 80)
              col.shape = forma

              terreno.add_child(col)

              criar_arvore(Vector3(-12, 0, -8))
              criar_arvore(Vector3(10, 0, -15))
              criar_arvore(Vector3(20, 0, 5))
              criar_arvore(Vector3(-20, 0, 12))

          func criar_arvore(pos: Vector3):

              var tronco := MeshInstance3D.new()
              var tronco_mesh := CylinderMesh.new()

              tronco_mesh.top_radius = 0.35
              tronco_mesh.bottom_radius = 0.45
              tronco_mesh.height = 3.5

              tronco.mesh = tronco_mesh
              tronco.position = pos + Vector3(0, 1.75, 0)
              tronco.material_override = material(
                  Color(0.38, 0.20, 0.08)
              )

              add_child(tronco)

              var copa := MeshInstance3D.new()
              var copa_mesh := SphereMesh.new()

              copa_mesh.radius = 2.2
              copa_mesh.height = 4.0

              copa.mesh = copa_mesh
              copa.position = pos + Vector3(0, 4.2, 0)
              copa.material_override = material(
                  Color(0.10, 0.48, 0.18)
              )

              add_child(copa)

          func criar_jogador():

              player = CharacterBody3D.new()

              player.position = Vector3(0, 2, 8)

              add_child(player)

              var corpo := MeshInstance3D.new()
              var corpo_mesh := CapsuleMesh.new()

              corpo_mesh.radius = 0.45
              corpo_mesh.height = 1.8

              corpo.mesh = corpo_mesh
              corpo.position.y = 0.9
              corpo.material_override = material(
                  Color(0.15, 0.35, 0.75)
              )

              player.add_child(corpo)

              var colisao := CollisionShape3D.new()
              var forma := CapsuleShape3D.new()

              forma.radius = 0.45
              forma.height = 1.8

              colisao.shape = forma
              colisao.position.y = 0.9

              player.add_child(colisao)

              camera = Camera3D.new()
              camera.position = Vector3(0, 4, 7)

              player.add_child(camera)

              camera.current = true

          func criar_interface():

              var camada := CanvasLayer.new()
              add_child(camada)

              var titulo := Label.new()

              titulo.text = "MUNDO V1"
              titulo.position = Vector2(30, 25)

              titulo.add_theme_font_size_override(
                  "font_size",
                  32
              )

              camada.add_child(titulo)

              var info := Label.new()

              info.text = "Explore o mundo"
              info.position = Vector2(32, 68)

              info.add_theme_font_size_override(
                  "font_size",
                  18
              )

              camada.add_child(info)

          func _physics_process(delta):

              if player == null:
                  return

              var entrada := Vector2(
                  Input.get_action_strength("move_right") -
                  Input.get_action_strength("move_left"),
                  Input.get_action_strength("move_back") -
                  Input.get_action_strength("move_forward")
              )

              var direcao := Vector3(
                  entrada.x,
                  0,
                  entrada.y
              )

              if direcao.length() > 1.0:
                  direcao = direcao.normalized()

              player.velocity.x = direcao.x * 6.0
              player.velocity.z = direcao.z * 6.0

              if not player.is_on_floor():
                  player.velocity.y -= 18.0 * delta

              elif Input.is_action_just_pressed("jump"):
                  player.velocity.y = 7.0

              player.move_and_slide()

              camera.look_at(
                  player.global_position + Vector3(0, 1, 0),
                  Vector3.UP
              )
          EOF

      - name: Criar assinatura
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/.android"

          keytool \
            -genkeypair \
            -v \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Criar preset Android
        shell: bash
        run: |
          cat > export_presets.cfg <<EOF
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/MundoV1.apk"

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""

          gradle_build/use_gradle_build=false

          package/unique_name="com.mundov1.game"
          package/name="Mundo V1"
          package/version_code=1
          package/version_name="1.0"

          package/signed=true

          package/keystore/debug="$HOME/.android/debug.keystore"
          package/keystore/debug_user="androiddebugkey"
          package/keystore/debug_password="android"

          package/keystore/release=""
          package/keystore/release_user=""
          package/keystore/release_password=""

          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false

          permissions/internet=false
          EOF

          echo "=== PRESET ==="
          cat export_presets.cfg

      - name: Diagnóstico Godot
        shell: bash
        run: |
          set -euxo pipefail

          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$HOME/android-sdk"

          echo "Godot:"
          "$GITHUB_WORKSPACE/Godot" --version

          echo "Templates:"
          find "$HOME/.local/share/godot/export_templates/4.3.stable" \
            -maxdepth 2 \
            -type f \
            -print

          echo "SDK:"
          ls -la "$ANDROID_HOME/platforms/android-34"
          ls -la "$ANDROID_HOME/build-tools/34.0.0"

      - name: Importar projeto
        shell: bash
        run: |
          set -euxo pipefail

          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$HOME/android-sdk"

          "$GITHUB_WORKSPACE/Godot" \
            --headless \
            --path "$GITHUB_WORKSPACE" \
            --editor \
            --quit

      - name: Exportar APK
        shell: bash
        run: |
          set -euxo pipefail

          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$HOME/android-sdk"

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/34.0.0:$PATH"

          rm -f build/MundoV1.apk

          "$GITHUB_WORKSPACE/Godot" \
            --headless \
            --path "$GITHUB_WORKSPACE" \
            --export-debug \
            "Android" \
            "$GITHUB_WORKSPACE/build/MundoV1.apk"

      - name: Conferir APK
        shell: bash
        run: |
          set -euxo pipefail

          test -f build/MundoV1.apk

          ls -lh build/MundoV1.apk

          file build/MundoV1.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MundoV1-APK
          path: build/MundoV1.apk
          if-no-files-found: error
