          func _jump() -> void:
              if player != null:
                  if player.is_on_floor():
                      velocity_y = 7.4

          func _collect() -> void:
              collected += 1

              if status_label != null:
                  status_label.text = \
                      "RECURSO COLETADO"

          func _update_ui() -> void:
              if life_bar != null:
                  life_bar.value = life

              if stamina_bar != null:
                  stamina_bar.value = stamina

              if inventory_label != null:
                  inventory_label.text = \
                      "RECURSOS  %02d" % collected

              if status_label != null:
                  if sprinting:
                      status_label.text = "CORRENDO"
                  else:
                      status_label.text = "EXPLORANDO"

          func _animate_water(delta: float) -> void:
              if water == null:
                  return

              water.position.y = \
                  WATER_LEVEL + \
                  sin(day_time * 1.35) * 0.035

          func _animate_sky(delta: float) -> void:
              if sun == null:
                  return

              var cycle: float = \
                  sin(day_time * 0.035)

              sun.rotation_degrees.x = \
                  -48.0 + cycle * 5.0

              sun.light_energy = \
                  1.45 + cycle * 0.15

          func _input(event: InputEvent) -> void:
              if event is InputEventScreenTouch:

                  if event.pressed:

                      if event.position.x < 330.0:

                          touch_move_active = true

                          move_touch = Vector2.ZERO

                      else:

                          touch_look_active = true

                  else:

                      touch_move_active = false
                      touch_look_active = false

              elif event is InputEventScreenDrag:

                  if touch_move_active and \
                     event.position.x < 330.0:

                      var center: Vector2 = \
                          Vector2(117.0, 610.0)

                      var offset: Vector2 = \
                          event.position - center

                      move_touch = Vector2(
                          clamp(
                              offset.x / 65.0,
                              -1.0,
                              1.0
                          ),
                          clamp(
                              offset.y / 65.0,
                              -1.0,
                              1.0
                          )
                      )

                  elif touch_look_active:

                      var look_delta: Vector2 = \
                          event.relative

                      if camera_pivot != null:

                          camera_pivot.rotation_degrees.y -= \
                              look_delta.x * 0.08

                          camera.rotation_degrees.x = clamp(
                              camera.rotation_degrees.x -
                              look_delta.y * 0.05,
                              -35.0,
                              5.0
                          )
          EOF

      - name: Criar export_presets.cfg
        shell: bash
        run: |
          set -euxo pipefail

          cat > export_presets.cfg <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=true

          export_filter="all_resources"
          include_filter=""
          exclude_filter=""

          export_path="build/MundoV1.apk"

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""

          package/unique_name="com.mundov1.game"
          package/name="MUNDO V1"

          package/version/code=25
          package/version/name="2.5"

          version/code=25
          version/name="2.5"

          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false

          package/signed=true

          options/keystore/debug="/home/runner/.android/debug.keystore"
          options/keystore/debug_user="androiddebugkey"
          options/keystore/debug_password="android"

          package/icon="res://icon.svg"

          rendering/method="gl_compatibility"
          rendering/driver="opengl3"

          texture_format/s3tc=false
          texture_format/etc=true
          texture_format/etc2=true
          texture_format/no_bptc=true

          screen/immersive_mode=true
          screen/edge_to_edge=true
          EOF

      - name: Criar debug keystore
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then

            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

          fi

          test -s "$HOME/.android/debug.keystore"

      - name: Validar projeto
        shell: bash
        run: |
          set -euxo pipefail

          test -f project.godot
          test -f Main.tscn
          test -f scripts/main.gd
          test -f export_presets.cfg

          godot \
            --headless \
            --editor \
            --path . \
            --quit

      - name: Exportar APK
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf build
          mkdir -p build

          godot \
            --headless \
            --path . \
            --export-debug \
            "Android" \
            build/MundoV1.apk

          test -s build/MundoV1.apk

      - name: Verificar APK
        shell: bash
        run: |
          set -euxo pipefail

          "$ANDROID_HOME/build-tools/34.0.0/apksigner" \
            verify \
            --verbose \
            build/MundoV1.apk

          ls -lh build/MundoV1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MUNDO-V1-V2.5-AAA-MOBILE-APK
          path: build/MundoV1.apk
          if-no-files-found: error
