name: MUNDO V1 - V2.0

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/34.0.0:$PATH"

          mkdir -p "$ANDROID_HOME/cmdline-tools"

          cd "$RUNNER_TEMP"

          curl -L \
            -o commandlinetools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip

          rm -rf "$ANDROID_HOME/cmdline-tools/latest"

          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"

          unzip -q commandlinetools.zip \
            -d "$ANDROID_HOME/cmdline-tools/latest"

          mv "$ANDROID_HOME/cmdline-tools/latest/cmdline-tools/"* \
             "$ANDROID_HOME/cmdline-tools/latest/"

          rm -rf "$ANDROID_HOME/cmdline-tools/latest/cmdline-tools"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"

      - name: Instalar Godot 4.3
        shell: bash
        run: |
          set -euxo pipefail

          cd "$RUNNER_TEMP"

          curl -L \
            -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip

          unzip -q godot.zip

          chmod +x Godot_v4.3-stable_linux.x86_64

          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot

          godot --version

      - name: Instalar templates Android do Godot
        shell: bash
        run: |
          set -euxo pipefail

          cd "$RUNNER_TEMP"

          curl -L \
            -o templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz

          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"

          unzip -q templates.tpz \
            -d "$RUNNER_TEMP/templates"

          find "$RUNNER_TEMP/templates" \
            -type f \
            -name "android_debug.apk" \
            -exec cp {} "$HOME/.local/share/godot/export_templates/4.3.stable/" \;

          find "$RUNNER_TEMP/templates" \
            -type f \
            -name "android_release.apk" \
            -exec cp {} "$HOME/.local/share/godot/export_templates/4.3.stable/" \;

          find "$RUNNER_TEMP/templates" \
            -type f \
            -name "android_source.zip" \
            -exec cp {} "$HOME/.local/share/godot/export_templates/4.3.stable/" \;

          ls -la "$HOME/.local/share/godot/export_templates/4.3.stable"

      - name: Criar projeto MUNDO V1 V2.0
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf project.godot Main.tscn scripts assets build
          mkdir -p scripts assets build

          cat > project.godot <<'EOF'
          ; MUNDO V1 - V2.0

          config_version=5

          [application]

          config/name="MUNDO V1"
          run/main_scene="res://Main.tscn"
          config/features=PackedStringArray("4.3", "GL Compatibility")
          config/icon="res://icon.svg"

          [display]

          window/size/viewport_width=1280
          window/size/viewport_height=720
          window/size/window_width_override=1280
          window/size/window_height_override=720
          window/stretch/mode="canvas_items"

          [rendering]

          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          textures/default_filters/use_nearest_mipmap_filter=false
          textures/vram_compression/import_etc2_astc=true

          [input]

          move_left={
          "deadzone": 0.5,
          "events": [Object(InputEventKey,"physical_keycode":65)]
          }

          move_right={
          "deadzone": 0.5,
          "events": [Object(InputEventKey,"physical_keycode":68)]
          }

          move_forward={
          "deadzone": 0.5,
          "events": [Object(InputEventKey,"physical_keycode":87)]
          }

          move_backward={
          "deadzone": 0.5,
          "events": [Object(InputEventKey,"physical_keycode":83)]
          }

          jump={
          "deadzone": 0.5,
          "events": [Object(InputEventKey,"physical_keycode":32)]
          }

          [display/window]

          size/viewport_width=1280
          size/viewport_height=720
          size/window_width_override=1280
          size/window_height_override=720
          stretch/mode="canvas_items"
          EOF

          cat > icon.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
            <defs>
              <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#63c7ff"/>
                <stop offset="1" stop-color="#245c9c"/>
              </linearGradient>
            </defs>
            <rect x="12" y="12" width="232" height="232" rx="52" fill="url(#g)"/>
            <path d="M42 174 L82 94 L119 146 L150 108 L214 174 Z" fill="#4e8f55"/>
            <circle cx="176" cy="70" r="25" fill="#fff0a8"/>
            <path d="M36 190 Q128 145 220 190 L220 216 L36 216 Z" fill="#376c42"/>
            <text x="128" y="205" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="white">MUNDO</text>
          </svg>
          EOF

          cat > Main.tscn <<'EOF'
          [gd_scene load_steps=2 format=3]

          [ext_resource path="res://scripts/main.gd" type="Script" id="1"]

          [node name="MundoV1" type="Node3D"]
          script = ExtResource("1")
          EOF

          cat > scripts/main.gd <<'EOF'
          extends Node3D

          var player: CharacterBody3D
          var camera: Camera3D

          var move_input: Vector2 = Vector2.ZERO
          var water_time: float = 0.0

          var health: float = 100.0
          var wood: int = 0
          var stone: int = 0

          var camera_distance: float = 8.2
          var camera_height: float = 4.4

          var joystick_center: Vector2 = Vector2.ZERO
          var joystick_active: bool = false
          var joystick_id: int = -1

          var health_label: Label
          var inventory_label: Label
          var status_label: Label

          var world_objects: Array[Node3D] = []


          func _ready() -> void:
              create_environment()
              create_world()
              create_player()
              create_interface()


          func make_material(color: Color, roughness: float = 0.85) -> StandardMaterial3D:
              var material := StandardMaterial3D.new()
              material.albedo_color = color
              material.roughness = roughness
              return material


          func create_environment() -> void:
              var world := WorldEnvironment.new()
              world.name = "WorldEnvironment"

              var environment := Environment.new()
              environment.background_mode = Environment.BG_COLOR
              environment.background_color = Color("#82c4ea")
              environment.ambient_light_source = Environment.AMBIENT_SOURCE_COLOR
              environment.ambient_light_color = Color("#e8f5ff")
              environment.ambient_light_energy = 0.88
              environment.tonemap_mode = Environment.TONE_MAPPER_FILMIC
              environment.tonemap_exposure = 1.06
              environment.fog_enabled = true
              environment.fog_light_color = Color("#b9dff2")
              environment.fog_light_energy = 0.42
              environment.fog_density = 0.008
              environment.fog_height = 3.0
              environment.fog_height_density = 0.04

              world.environment = environment
              add_child(world)

              var sun := DirectionalLight3D.new()
              sun.name = "Sun"
              sun.rotation_degrees = Vector3(-48.0, -32.0, 0.0)
              sun.light_color = Color("#fff4dc")
              sun.light_energy = 1.22
              sun.shadow_enabled = true
              sun.directional_shadow_max_distance = 85.0
              sun.directional_shadow_split_1 = 0.12
              sun.directional_shadow_split_2 = 0.28
              sun.directional_shadow_split_3 = 0.55
              sun.shadow_bias = 0.04
              add_child(sun)

              var fill := DirectionalLight3D.new()
              fill.name = "FillLight"
              fill.rotation_degrees = Vector3(-25.0, 145.0, 0.0)
              fill.light_color = Color("#b9dcff")
              fill.light_energy = 0.22
              fill.shadow_enabled = false
              add_child(fill)


          func create_world() -> void:
              create_ground()
              create_water()

              var hills := [
                  Vector3(-24.0, 2.5, -20.0),
                  Vector3(28.0, 3.0, -23.0),
                  Vector3(34.0, 2.0, 17.0),
                  Vector3(-30.0, 2.0, 25.0)
              ]

              for position in hills:
                  create_hill(position)

              var trees := [
                  Vector3(-18, 0, -8),
                  Vector3(-11, 0, -17),
                  Vector3(18, 0, -20),
                  Vector3(25, 0, -8),
                  Vector3(31, 0, 5),
                  Vector3(-25, 0, 12),
                  Vector3(-17, 0, 25),
                  Vector3(15, 0, 24),
                  Vector3(4, 0, -25)
              ]

              for position in trees:
                  create_tree(position)

              for i in range(4):
                  create_pine(Vector3(-34 + i * 5, 0, -7 + i * 8))

              for i in range(36):
                  var x := -45.0 + float((i * 17) % 90)
                  var z := -40.0 + float((i * 29) % 80)
                  create_bush(Vector3(x, 0, z))

              for i in range(55):
                  var x := -48.0 + float((i * 31) % 96)
                  var z := -43.0 + float((i * 23) % 86)
                  create_grass(Vector3(x, 0, z))

              for i in range(22):
                  var x := -42.0 + float((i * 37) % 84)
                  var z := -38.0 + float((i * 19) % 76)
                  create_flower(Vector3(x, 0, z))

              for i in range(7):
                  var x := -35.0 + float((i * 21) % 70)
                  var z := -30.0 + float((i * 27) % 60)
                  create_rock(Vector3(x, 0, z))

              create_resource(Vector3(-5, 0.35, -3), "MADEIRA")
              create_resource(Vector3(9, 0.35, 3), "MADEIRA")
              create_resource(Vector3(-12, 0.35, 9), "PEDRA")
              create_resource(Vector3(16, 0.35, 12), "PEDRA")


          func create_ground() -> void:
              var ground := MeshInstance3D.new()
              ground.name = "Ground"

              var mesh := PlaneMesh.new()
              mesh.size = Vector2(110, 110)
              mesh.subdivide_width = 24
              mesh.subdivide_depth = 24

              ground.mesh = mesh
              ground.position.y = -0.05
              ground.material_override = make_material(Color("#5f9448"), 1.0)

              add_child(ground)

              var body := StaticBody3D.new()
              body.name = "GroundCollision"

              var collision := CollisionShape3D.new()
              var shape := BoxShape3D.new()
              shape.size = Vector3(110, 1, 110)

              collision.shape = shape
              collision.position.y = -0.5

              body.add_child(collision)
              add_child(body)


          func create_water() -> void:
              var water := MeshInstance3D.new()
              water.name = "Water"

              var mesh := PlaneMesh.new()
              mesh.size = Vector2(45, 27)
              mesh.subdivide_width = 14
              mesh.subdivide_depth = 10

              water.mesh = mesh
              water.position = Vector3(10, 0.065, -8)

              var material := make_material(
                  Color(0.055, 0.39, 0.58, 0.76),
                  0.08
              )

              material.transparency = BaseMaterial3D.TRANSPARENCY_ALPHA
              material.shading_mode = BaseMaterial3D.SHADING_MODE_PER_PIXEL
              material.cull_mode = BaseMaterial3D.CULL_DISABLED

              water.material_override = material
              add_child(water)

              for i in range(7):
                  var shine := MeshInstance3D.new()
                  var shine_mesh := BoxMesh.new()
                  shine_mesh.size = Vector3(2.8, 0.018, 0.045)
                  shine.mesh = shine_mesh
                  shine.position = Vector3(
                      -4.0 + i * 5.0,
                      0.085,
                      -13.0 + (i % 3) * 5.0
                  )
                  shine.material_override = make_material(
                      Color(0.65, 0.9, 1.0, 0.32),
                      0.05
                  )
                  add_child(shine)


          func create_hill(position: Vector3) -> void:
              var hill := MeshInstance3D.new()
              var mesh := SphereMesh.new()

              mesh.radius = 6.0
              mesh.height = 8.0
              mesh.radial_segments = 20
              mesh.rings = 10

              hill.mesh = mesh
              hill.position = position + Vector3(0, 1.0, 0)
              hill.scale = Vector3(1.7, 0.65, 1.5)
              hill.material_override = make_material(Color("#668f4d"), 1.0)

              add_child(hill)


          func create_tree(position: Vector3) -> void:
              var tree := Node3D.new()
              tree.position = position
              add_child(tree)

              var trunk := MeshInstance3D.new()
              var trunk_mesh := CylinderMesh.new()
              trunk_mesh.top_radius = 0.25
              trunk_mesh.bottom_radius = 0.36
              trunk_mesh.height = 2.7
              trunk_mesh.radial_segments = 10

              trunk.mesh = trunk_mesh
              trunk.position.y = 1.35
              trunk.material_override = make_material(Color("#6b4931"), 0.92)
              tree.add_child(trunk)

              for i in range(4):
                  var crown := MeshInstance3D.new()
                  var crown_mesh := SphereMesh.new()
                  crown_mesh.radius = 1.45
                  crown_mesh.height = 2.3
                  crown_mesh.radial_segments = 12
                  crown_mesh.rings = 7

                  crown.mesh = crown_mesh
                  crown.position = Vector3(
                      -0.55 + float(i % 2) * 1.05,
                      2.7 + float(i / 2) * 0.72,
                      -0.25 + float(i % 2) * 0.4
                  )
                  crown.scale = Vector3(1.0, 0.8, 0.9)
                  crown.material_override = make_material(
                      Color("#3f7e48"),
                      0.95
                  )
                  tree.add_child(crown)


          func create_pine(position: Vector3) -> void:
              var tree := Node3D.new()
              tree.position = position
              add_child(tree)

              var trunk := MeshInstance3D.new()
              var trunk_mesh := CylinderMesh.new()
              trunk_mesh.top_radius = 0.16
              trunk_mesh.bottom_radius = 0.25
              trunk_mesh.height = 2.2
              trunk.mesh = trunk_mesh
              trunk.position.y = 1.1
              trunk.material_override = make_material(Color("#61422f"))
              tree.add_child(trunk)

              for i in range(3):
                  var cone := MeshInstance3D.new()
                  var cone_mesh := CylinderMesh.new()
                  cone_mesh.top_radius = 0.0
                  cone_mesh.bottom_radius = 1.45 - i * 0.28
                  cone_mesh.height = 2.3
                  cone_mesh.radial_segments = 12

                  cone.mesh = cone_mesh
                  cone.position.y = 2.0 + i * 0.75
                  cone.material_override = make_material(Color("#2f6842"))
                  tree.add_child(cone)


          func create_bush(position: Vector3) -> void:
              var bush := MeshInstance3D.new()
              var mesh := SphereMesh.new()
              mesh.radius = 0.48
              mesh.height = 0.75
              mesh.radial_segments = 8
              mesh.rings = 5

              bush.mesh = mesh
              bush.position = position + Vector3(0, 0.35, 0)
              bush.scale = Vector3(1.25, 0.7, 1.0)
              bush.material_override = make_material(Color("#477f3e"))
              add_child(bush)


          func create_grass(position: Vector3) -> void:
              var grass := MeshInstance3D.new()
              var mesh := BoxMesh.new()
              mesh.size = Vector3(0.08, 0.45, 0.08)

              grass.mesh = mesh
              grass.position = position + Vector3(0, 0.22, 0)
              grass.rotation_degrees.y = float((position.x + position.z) * 17.0)
              grass.material_override = make_material(Color("#76a84e"))
              add_child(grass)


          func create_flower(position: Vector3) -> void:
              var flower := MeshInstance3D.new()
              var mesh := SphereMesh.new()
              mesh.radius = 0.11
              mesh.height = 0.22
              mesh.radial_segments = 8
              mesh.rings = 4

              flower.mesh = mesh
              flower.position = position + Vector3(0, 0.2, 0)
              flower.material_override = make_material(Color("#f1c75b"))
              add_child(flower)


          func create_rock(position: Vector3) -> void:
              var rock := MeshInstance3D.new()
              var mesh := SphereMesh.new()
              mesh.radius = 0.55
              mesh.height = 0.8
              mesh.radial_segments = 8
              mesh.rings = 5

              rock.mesh = mesh
              rock.position = position + Vector3(0, 0.35, 0)
              rock.scale = Vector3(1.3, 0.7, 0.95)
              rock.material_override = make_material(Color("#777b77"), 1.0)
              add_child(rock)


          func create_resource(position: Vector3, resource_type: String) -> void:
              var resource := Area3D.new()
              resource.name = resource_type

              var mesh_instance := MeshInstance3D.new()

              if resource_type == "MADEIRA":
                  var mesh := CylinderMesh.new()
                  mesh.top_radius = 0.35
                  mesh.bottom_radius = 0.42
                  mesh.height = 1.0
                  mesh.radial_segments = 8
                  mesh_instance.mesh = mesh
                  mesh_instance.material_override = make_material(Color("#8a5b32"))
              else:
                  var mesh := SphereMesh.new()
                  mesh.radius = 0.52
                  mesh.height = 0.8
                  mesh.radial_segments = 8
                  mesh.rings = 5
                  mesh_instance.mesh = mesh
                  mesh_instance.material_override = make_material(Color("#777b80"))

              mesh_instance.position.y = 0.55
              resource.add_child(mesh_instance)

              var collision := CollisionShape3D.new()
              var shape := SphereShape3D.new()
              shape.radius = 0.65
              collision.shape = shape
              collision.position.y = 0.55

              resource.add_child(collision)
              resource.position = position

              resource.body_entered.connect(
                  func(body: Node) -> void:
                      if body == player:
                          collect_resource(resource, resource_type)
              )

              add_child(resource)
              world_objects.append(resource)


          func collect_resource(resource: Node3D, resource_type: String) -> void:
              if not is_instance_valid(resource):
                  return

              if resource_type == "MADEIRA":
                  wood += 1
              else:
                  stone += 1

              status_label.text = "RECURSO COLETADO!"
              resource.queue_free()
              update_interface()


          func create_player() -> void:
              player = CharacterBody3D.new()
              player.name = "Player"
              player.position = Vector3(0, 1.3, 8)

              var collision := CollisionShape3D.new()
              var shape := CapsuleShape3D.new()
              shape.radius = 0.45
              shape.height = 1.8
              collision.shape = shape
              collision.position.y = 0.9
              player.add_child(collision)

              var body := MeshInstance3D.new()
              var body_mesh := CapsuleMesh.new()
              body_mesh.radius = 0.45
              body_mesh.height = 1.8
              body.mesh = body_mesh
              body.position.y = 0.9
              body.material_override = make_material(Color("#3d72a8"))
              player.add_child(body)

              var head := MeshInstance3D.new()
              var head_mesh := SphereMesh.new()
              head_mesh.radius = 0.42
              head_mesh.height = 0.84
              head_mesh.radial_segments = 12
              head_mesh.rings = 8
              head.mesh = head_mesh
              head.position.y = 2.0
              head.material_override = make_material(Color("#d99d70"))
              player.add_child(head)

              add_child(player)

              camera = Camera3D.new()
              camera.name = "Camera3D"
              camera.current = true
              camera.fov = 68.0
              add_child(camera)


          func create_interface() -> void:
              var layer := CanvasLayer.new()
              layer.name = "HUD"
              add_child(layer)

              var title := Label.new()
              title.text = "MUNDO V1"
              title.position = Vector2(32, 24)
              title.add_theme_font_size_override("font_size", 30)
              layer.add_child(title)

              var version := Label.new()
              version.text = "V2.0 • EXPLORA • COLETE • CONSTRUA"
              version.position = Vector2(35, 62)
              version.add_theme_font_size_override("font_size", 15)
              layer.add_child(version)

              status_label = Label.new()
              status_label.text = "MUNDO PRONTO"
              status_label.position = Vector2(35, 92)
              status_label.add_theme_font_size_override("font_size", 16)
              layer.add_child(status_label)

              health_label = Label.new()
              health_label.position = Vector2(35, 130)
              health_label.add_theme_font_size_override("font_size", 18)
              layer.add_child(health_label)

              inventory_label = Label.new()
              inventory_label.position = Vector2(35, 158)
              inventory_label.add_theme_font_size_override("font_size", 18)
              layer.add_child(inventory_label)

              var controls := Label.new()
              controls.text = "W A S D  •  ESPAÇO"
              controls.position = Vector2(35, 685)
              controls.add_theme_font_size_override("font_size", 16)
              layer.add_child(controls)

              var build_button := Button.new()
              build_button.text = "CONSTRUIR"
              build_button.position = Vector2(1080, 570)
              build_button.size = Vector2(160, 58)
              build_button.add_theme_font_size_override("font_size", 18)
              build_button.pressed.connect(build_object)
              layer.add_child(build_button)

              var collect_button := Button.new()
              collect_button.text = "COLETAR"
              collect_button.position = Vector2(1080, 640)
              collect_button.size = Vector2(160, 58)
              collect_button.add_theme_font_size_override("font_size", 18)
              collect_button.pressed.connect(collect_nearby)
              layer.add_child(collect_button)

              var jump_button := Button.new()
              jump_button.text = "PULAR"
              jump_button.position = Vector2(900, 590)
              jump_button.size = Vector2(140, 58)
              jump_button.add_theme_font_size_override("font_size", 18)
              jump_button.pressed.connect(jump)
              layer.add_child(jump_button)

              var joy := Label.new()
              joy.text = "◉"
              joy.position = Vector2(70, 535)
              joy.add_theme_font_size_override("font_size", 75)
              layer.add_child(joy)

              joystick_center = Vector2(110, 575)

              update_interface()


          func update_interface() -> void:
              if health_label:
                  health_label.text = "VIDA: %d / 100" % int(health)

              if inventory_label:
                  inventory_label.text = "MADEIRA: %d    PEDRA: %d" % [wood, stone]


          func _physics_process(delta: float) -> void:
              if not player:
                  return

              var keyboard_input := Vector2(
                  Input.get_axis("move_left", "move_right"),
                  Input.get_axis("move_forward", "move_backward")
              )

              if keyboard_input.length() > 0.1:
                  move_input = keyboard_input.normalized()

              var direction := Vector3(
                  move_input.x,
                  0.0,
                  move_input.y
              )

              var speed: float = 4.8

              player.velocity.x = direction.x * speed
              player.velocity.z = direction.z * speed

              if not player.is_on_floor():
                  player.velocity.y -= 18.0 * delta
              else:
                  player.velocity.y = -0.5

              player.move_and_slide()

              if direction.length() > 0.1:
                  var target_rotation: float = atan2(direction.x, direction.z)
                  player.rotation.y = lerp_angle(
                      player.rotation.y,
                      target_rotation,
                      delta * 8.0
                  )

              update_camera(delta)

              water_time += delta

              for node in get_tree().get_nodes_in_group("water_animation"):
                  if is_instance_valid(node):
                      node.position.y = 0.065 + sin(water_time * 1.5) * 0.015


          func update_camera(delta: float) -> void:
              if not camera or not player:
                  return

              var desired_position: Vector3 = (
                  player.position
                  + Vector3(0, camera_height, camera_distance)
              )

              camera.position = camera.position.lerp(
                  desired_position,
                  delta * 5.0
              )

              var look_target: Vector3 = (
                  player.position + Vector3(0, 1.2, 0)
              )

              camera.look_at(look_target, Vector3.UP)


          func jump() -> void:
              if player and player.is_on_floor():
                  player.velocity.y = 7.0


          func collect_nearby() -> void:
              if not player:
                  return

              var found := false

              for object in world_objects:
                  if not is_instance_valid(object):
                      continue

                  var distance: float = player.global_position.distance_to(
                      object.global_position
                  )

                  if distance < 3.0:
                      var resource_type: String = object.name
                      collect_resource(object, resource_type)
                      found = true
                      break

              if found:
                  status_label.text = "ITEM ADICIONADO AO INVENTÁRIO"
              else:
                  status_label.text = "NENHUM RECURSO PRÓXIMO"


          func build_object() -> void:
              if wood <= 0 and stone <= 0:
                  status_label.text = "PRECISA DE MADEIRA OU PEDRA"
                  return

              var block := MeshInstance3D.new()
              var mesh := BoxMesh.new()
              mesh.size = Vector3(1.4, 1.0, 1.4)

              block.mesh = mesh
              block.position = player.position + Vector3(0, 0.5, -2.0)

              if wood > 0:
                  block.material_override = make_material(Color("#8a5b32"))
                  wood -= 1
                  status_label.text = "CONSTRUÇÃO: MADEIRA"
              else:
                  block.material_override = make_material(Color("#777b80"))
                  stone -= 1
                  status_label.text = "CONSTRUÇÃO: PEDRA"

              add_child(block)
              update_interface()


          func _unhandled_input(event: InputEvent) -> void:
              if event is InputEventScreenTouch:
                  if event.pressed:
                      if event.position.x < 280.0 and event.position.y > 430.0:
                          joystick_active = true
                          joystick_id = event.index
                          update_joystick(event.position)
                  elif event.index == joystick_id:
                      joystick_active = false
                      joystick_id = -1
                      move_input = Vector2.ZERO

              elif event is InputEventScreenDrag:
                  if joystick_active and event.index == joystick_id:
                      update_joystick(event.position)


          func update_joystick(position: Vector2) -> void:
              var offset: Vector2 = position - joystick_center

              if offset.length() > 70.0:
                  offset = offset.normalized() * 70.0

              move_input = Vector2(
                  offset.x / 70.0,
                  offset.y / 70.0
              )

              move_input.y = -move_input.y
          EOF

      - name: Criar export_presets.cfg
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p /home/runner/.android

          keytool \
            -genkeypair \
            -v \
            -keystore /home/runner/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            2>/dev/null || true

          cat > export_presets.cfg <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/MundoV1.apk"
          patch_list=PackedStringArray()

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""

          gradle_build/use_gradle_build=false

          package/unique_name="com.mundov1.game"
          package/name="MUNDO V1"
          package/version/code=20
          package/version/name="2.0"

          package/short_name="MUNDO V1"

          launcher_icons/main_192x192=""
          launcher_icons/adaptive_foreground_432x432=""
          launcher_icons/adaptive_background_432x432=""

          screen/immersive_mode=true
          screen/orientation=1

          architecture/arm64-v8a=true
          architecture/armeabi-v7a=false
          architecture/x86=false
          architecture/x86_64=false

          keystore/debug="/home/runner/.android/debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"

          keystore/release=""
          keystore/release_user=""
          keystore/release_password=""

          version/code=20
          version/name="2.0"

          permissions/internet=false
          EOF

      - name: Validar projeto
        shell: bash
        run: |
          set -euxo pipefail

          godot \
            --headless \
            --editor \
            --path . \
            --quit

      - name: Exportar APK V2.0
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf build
          mkdir -p build

          godot \
            --headless \
            --path . \
            --export-debug \
            "Android" \
            build/MundoV1.apk

          test -f build/MundoV1.apk

          ls -lh build/MundoV1.apk

      - name: Verificar assinatura APK
        shell: bash
        run: |
          set -euxo pipefail

          "$ANDROID_HOME/build-tools/34.0.0/apksigner" \
            verify \
            --verbose \
            build/MundoV1.apk

      - name: Preparar APK final
        shell: bash
        run: |
          set -euxo pipefail

          cp build/MundoV1.apk \
             build/MUNDO-V1-V2.0.apk

          ls -lh build/MUNDO-V1-V2.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MUNDO-V1-V2.0-APK
          path: build/MUNDO-V1-V2.0.apk
          if-no-files-found: error
