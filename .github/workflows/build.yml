name: MUNDO V1.8 - AGUA E AMBIENTE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          mkdir -p "$ANDROID_HOME/cmdline-tools"

          cd /tmp

          curl -L -o commandlinetools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip

          unzip -q commandlinetools.zip

          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"

          cp -R cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"

      - name: Baixar Godot 4.3
        shell: bash
        run: |
          set -euxo pipefail

          cd /tmp

          curl -L -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip

          unzip -q godot.zip

          chmod +x Godot_v4.3-stable_linux.x86_64

          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot

          godot --version

      - name: Instalar templates Android do Godot
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"

          cd /tmp

          curl -L -o templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz

          unzip -q templates.tpz -d templates_unpacked

          cp -R templates_unpacked/templates/* \
            "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Criar projeto
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p scripts
          mkdir -p build

          cat > project.godot <<'EOF'
          ; MUNDO V1.8

          config_version=5

          [application]

          config/name="MUNDO V1"
          run/main_scene="res://Main.tscn"
          config/features=PackedStringArray("4.3", "GL Compatibility")
          config/icon="res://icon.svg"

          [display]

          window/size/viewport_width=1280
          window/size/viewport_height=720
          window/size/window_width_override=1280
          window/size/window_height_override=720
          window/stretch/mode="canvas_items"

          [rendering]

          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"

          textures/vram_compression/import_etc2_astc=true

          [android]

          package/unique_name="com.mundov1.game"
          package/name="MUNDO V1"
          version/code=18
          version/name="1.8"

          [input]

          move_forward={
          "deadzone": 0.2,
          "events": [Object(InputEventKey,"physical_keycode":87)]
          }

          move_backward={
          "deadzone": 0.2,
          "events": [Object(InputEventKey,"physical_keycode":83)]
          }

          move_left={
          "deadzone": 0.2,
          "events": [Object(InputEventKey,"physical_keycode":65)]
          }

          move_right={
          "deadzone": 0.2,
          "events": [Object(InputEventKey,"physical_keycode":68)]
          }

          jump={
          "deadzone": 0.2,
          "events": [Object(InputEventKey,"physical_keycode":32)]
          }
          EOF

          cat > Main.tscn <<'EOF'
          [gd_scene load_steps=2 format=3]

          [ext_resource path="res://scripts/main.gd" type="Script" id="1"]

          [node name="MundoV1" type="Node3D"]
          script = ExtResource("1")
          EOF

          cat > icon.svg <<'EOF'
          <svg width="128" height="128" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#72c96b"/>
                <stop offset="1" stop-color="#267a4b"/>
              </linearGradient>
            </defs>
            <rect width="128" height="128" rx="28" fill="#193b2b"/>
            <circle cx="64" cy="58" r="42" fill="url(#g)"/>
            <path d="M25 82 Q64 55 103 82 L103 101 L25 101 Z" fill="#5b9b45"/>
            <circle cx="48" cy="47" r="13" fill="#9cdb71"/>
            <circle cx="78" cy="43" r="15" fill="#4e9f51"/>
          </svg>
          EOF

      - name: Criar mundo V1.8
        shell: bash
        run: |
          set -euxo pipefail

          cat > scripts/main.gd <<'EOF'
          extends Node3D

          var player: CharacterBody3D
          var camera: Camera3D

          var joystick_center := Vector2.ZERO
          var joystick_active := false
          var joystick_vector := Vector2.ZERO

          var gravity := 18.0
          var water_time := 0.0

          func _ready():
              create_environment()
              create_lighting()
              create_ground()
              create_water()
              create_water_details()
              create_shore()
              create_hills()
              create_vegetation()
              create_rocks()
              create_player()
              create_camera()
              create_ui()

          func make_material(
                  color: Color,
                  roughness := 1.0,
                  metallic := 0.0
          ):
              var material = StandardMaterial3D.new()
              material.albedo_color = color
              material.roughness = roughness
              material.metallic = metallic
              return material

          func create_environment():
              var world_environment = WorldEnvironment.new()
              var env = Environment.new()

              env.background_mode = Environment.BG_COLOR
              env.background_color = Color("#78b9e5")

              env.ambient_light_source = Environment.AMBIENT_SOURCE_COLOR
              env.ambient_light_color = Color("#e5f2ff")
              env.ambient_light_energy = 0.82

              env.tonemap_mode = Environment.TONE_MAPPER_FILMIC
              env.tonemap_exposure = 1.08
              env.tonemap_white = 1.1

              world_environment.environment = env
              add_child(world_environment)

          func create_lighting():
              var sun = DirectionalLight3D.new()

              sun.rotation_degrees = Vector3(-52, -32, 0)
              sun.light_energy = 1.35
              sun.shadow_enabled = true
              sun.directional_shadow_max_distance = 85.0

              add_child(sun)

          func create_ground():
              var ground = MeshInstance3D.new()
              var mesh = PlaneMesh.new()

              mesh.size = Vector2(110, 110)

              ground.mesh = mesh
              ground.position.y = -0.05
              ground.material_override = make_material(
                  Color("#5f9448"),
                  1.0
              )

              add_child(ground)

              var body = StaticBody3D.new()
              body.position.y = -0.5

              var collision = CollisionShape3D.new()
              var shape = BoxShape3D.new()

              shape.size = Vector3(110, 1, 110)

              collision.shape = shape
              body.add_child(collision)
              add_child(body)

          func create_water():
              var water = MeshInstance3D.new()
              var mesh = PlaneMesh.new()

              mesh.size = Vector2(45, 27)
              mesh.subdivide_width = 12
              mesh.subdivide_depth = 8

              water.mesh = mesh
              water.position = Vector3(10, 0.065, -8)

              var material = make_material(
                  Color(0.055, 0.39, 0.58, 0.76),
                  0.08,
                  0.08
              )

              material.transparency = BaseMaterial3D.TRANSPARENCY_ALPHA
              material.shading_mode = BaseMaterial3D.SHADING_MODE_PER_PIXEL
              material.cull_mode = BaseMaterial3D.CULL_DISABLED

              water.material_override = material

              add_child(water)

          func create_water_details():
              var positions = [
                  Vector3(2.0, 0.09, -5.0),
                  Vector3(7.0, 0.09, -10.0),
                  Vector3(13.0, 0.09, -4.0),
                  Vector3(18.0, 0.09, -11.0),
                  Vector3(22.0, 0.09, -7.0),
                  Vector3(11.0, 0.09, -15.0)
              ]

              for i in positions.size():
                  var shine = MeshInstance3D.new()
                  var mesh = PlaneMesh.new()

                  mesh.size = Vector2(
                      2.4 + float(i % 3),
                      0.12
                  )

                  shine.mesh = mesh
                  shine.position = positions[i]
                  shine.rotation_degrees.y = -8.0 + float(i * 13)

                  var material = make_material(
                      Color(0.65, 0.9, 1.0, 0.26),
                      0.05,
                      0.0
                  )

                  material.transparency = BaseMaterial3D.TRANSPARENCY_ALPHA
                  material.shading_mode = BaseMaterial3D.SHADING_MODE_PER_PIXEL

                  shine.material_override = material

                  add_child(shine)

          func create_shore():
              var spots = [
                  Vector3(1, 0.05, -2),
                  Vector3(6, 0.05, 1),
                  Vector3(14, 0.05, 3),
                  Vector3(20, 0.05, -1),
                  Vector3(17, 0.05, -14),
                  Vector3(5, 0.05, -18)
              ]

              for pos in spots:
                  var patch = MeshInstance3D.new()
                  var mesh = SphereMesh.new()

                  mesh.radius = 1.0
                  mesh.height = 2.0

                  patch.mesh = mesh
                  patch.position = pos
                  patch.scale = Vector3(4.7, 0.08, 3.2)

                  patch.material_override = make_material(
                      Color("#d9bf7d"),
                      1.0
                  )

                  add_child(patch)

              var wet_spots = [
                  Vector3(2, 0.065, -1),
                  Vector3(8, 0.065, 1),
                  Vector3(16, 0.065, 0),
                  Vector3(18, 0.065, -12),
                  Vector3(8, 0.065, -17)
              ]

              for pos in wet_spots:
                  var wet = MeshInstance3D.new()
                  var mesh = SphereMesh.new()

                  mesh.radius = 1.0
                  mesh.height = 2.0

                  wet.mesh = mesh
                  wet.position = pos
                  wet.scale = Vector3(3.0, 0.035, 1.5)

                  wet.material_override = make_material(
                      Color("#9f9b70"),
                      0.78
                  )

                  add_child(wet)

          func create_hills():
              var positions = [
                  Vector3(-27, 1.2, -23),
                  Vector3(-18, 0.7, -29),
                  Vector3(27, 1.4, -25),
                  Vector3(34, 0.9, -10),
                  Vector3(-34, 0.8, 17),
                  Vector3(30, 0.7, 20)
              ]

              var scales = [
                  Vector3(14, 3.5, 12),
                  Vector3(11, 2.5, 10),
                  Vector3(15, 4.0, 13),
                  Vector3(12, 3.0, 11),
                  Vector3(13, 2.8, 12),
                  Vector3(11, 2.5, 10)
              ]

              for i in positions.size():
                  var hill = MeshInstance3D.new()
                  var mesh = SphereMesh.new()

                  mesh.radius = 1.0
                  mesh.height = 2.0

                  hill.mesh = mesh
                  hill.position = positions[i]
                  hill.scale = scales[i]

                  hill.material_override = make_material(
                      Color("#4f833f"),
                      1.0
                  )

                  add_child(hill)

          func create_vegetation():
              create_tree(Vector3(-12, 0, -10), 1.25, Color("#3f873e"))
              create_tree(Vector3(-7, 0, -16), 1.0, Color("#4d9945"))
              create_tree(Vector3(-25, 0, -7), 1.45, Color("#397a39"))
              create_tree(Vector3(28, 0, -18), 1.3, Color("#468f40"))
              create_tree(Vector3(32, 0, 8), 1.1, Color("#54a14a"))
              create_tree(Vector3(-29, 0, 25), 1.35, Color("#3d843b"))
              create_tree(Vector3(22, 0, 27), 1.0, Color("#4a9442"))

              create_tree(Vector3(-2, 0, -25), 0.82, Color("#58a94e"))
              create_tree(Vector3(14, 0, -25), 0.95, Color("#438d3d"))
              create_tree(Vector3(-32, 0, -20), 0.9, Color("#5ba64d"))
              create_tree(Vector3(35, 0, -2), 0.82, Color("#4c9845"))

              create_pine(Vector3(-22, 0, -25), 1.3)
              create_pine(Vector3(24, 0, -28), 1.15)
              create_pine(Vector3(-36, 0, 5), 1.0)
              create_pine(Vector3(35, 0, 24), 1.25)
              create_pine(Vector3(10, 0, 30), 0.9)

              var bushes = [
                  Vector3(-16, 0, -4),
                  Vector3(-10, 0, 4),
                  Vector3(-4, 0, -7),
                  Vector3(4, 0, 7),
                  Vector3(18, 0, 8),
                  Vector3(25, 0, 4),
                  Vector3(-25, 0, 14),
                  Vector3(12, 0, 20),
                  Vector3(-5, 0, 22)
              ]

              for i in bushes.size():
                  create_bush(
                      bushes[i],
                      0.8 + float(i % 3) * 0.18,
                      Color("#4d963f")
                  )

              var grass_groups = [
                  Vector3(-18, 0, 2),
                  Vector3(-13, 0, 12),
                  Vector3(-2, 0, 16),
                  Vector3(5, 0, -23),
                  Vector3(16, 0, 14),
                  Vector3(26, 0, 16),
                  Vector3(-30, 0, -1),
                  Vector3(30, 0, -8)
              ]

              for pos in grass_groups:
                  create_grass_cluster(pos)

              create_flowers(Vector3(-8, 0, 11))
              create_flowers(Vector3(8, 0, 17))
              create_flowers(Vector3(27, 0, 12))
              create_flowers(Vector3(-24, 0, 18))

          func create_tree(
                  pos: Vector3,
                  scale_value: float,
                  crown_color: Color
          ):
              var tree = Node3D.new()

              tree.position = pos
              tree.scale = Vector3.ONE * scale_value

              add_child(tree)

              var trunk = MeshInstance3D.new()
              var trunk_mesh = CylinderMesh.new()

              trunk_mesh.top_radius = 0.25
              trunk_mesh.bottom_radius = 0.36
              trunk_mesh.height = 3.2

              trunk.mesh = trunk_mesh
              trunk.position.y = 1.6

              trunk.material_override = make_material(
                  Color("#68442c")
              )

              tree.add_child(trunk)

              var crown_positions = [
                  Vector3(0, 3.6, 0),
                  Vector3(-0.65, 3.35, 0.1),
                  Vector3(0.65, 3.4, 0),
                  Vector3(0, 4.05, -0.25),
                  Vector3(0, 3.45, 0.65)
              ]

              var crown_scales = [
                  Vector3(1.35, 1.05, 1.25),
                  Vector3(0.85, 0.8, 0.9),
                  Vector3(0.9, 0.82, 0.92),
                  Vector3(0.85, 0.75, 0.85),
                  Vector3(0.8, 0.72, 0.82)
              ]

              for i in crown_positions.size():
                  var crown = MeshInstance3D.new()
                  var crown_mesh = SphereMesh.new()

                  crown_mesh.radius = 1.0
                  crown_mesh.height = 2.0

                  crown.mesh = crown_mesh
                  crown.position = crown_positions[i]
                  crown.scale = crown_scales[i]

                  crown.material_override = make_material(
                      crown_color.lightened(float(i) * 0.025),
                      0.95
                  )

                  tree.add_child(crown)

          func create_pine(pos: Vector3, scale_value: float):
              var pine = Node3D.new()

              pine.position = pos
              pine.scale = Vector3.ONE * scale_value

              add_child(pine)

              var trunk = MeshInstance3D.new()
              var trunk_mesh = CylinderMesh.new()

              trunk_mesh.top_radius = 0.18
              trunk_mesh.bottom_radius = 0.28
              trunk_mesh.height = 3.0

              trunk.mesh = trunk_mesh
              trunk.position.y = 1.5

              trunk.material_override = make_material(
                  Color("#60432d")
              )

              pine.add_child(trunk)

              var layers = [
                  [2.5, 2.0],
                  [3.25, 1.65],
                  [3.9, 1.3],
                  [4.45, 0.9]
              ]

              for data in layers:
                  var cone = MeshInstance3D.new()
                  var mesh = CylinderMesh.new()

                  mesh.top_radius = 0.0
                  mesh.bottom_radius = data[1]
                  mesh.height = 1.7

                  cone.mesh = mesh
                  cone.position.y = data[0]

                  cone.material_override = make_material(
                      Color("#32743c"),
                      1.0
                  )

                  pine.add_child(cone)

          func create_bush(
                  pos: Vector3,
                  size_value: float,
                  color: Color
          ):
              var bush = Node3D.new()

              bush.position = pos
              bush.scale = Vector3.ONE * size_value

              add_child(bush)

              var offsets = [
                  Vector3(-0.55, 0.45, 0),
                  Vector3(0.0, 0.65, 0),
                  Vector3(0.55, 0.45, 0),
                  Vector3(0.15, 0.4, 0.5)
              ]

              for i in offsets.size():
                  var part = MeshInstance3D.new()
                  var mesh = SphereMesh.new()

                  mesh.radius = 0.75
                  mesh.height = 1.25

                  part.mesh = mesh
                  part.position = offsets[i]
                  part.scale = Vector3(1.0, 0.75, 0.9)

                  part.material_override = make_material(
                      color.lightened(float(i) * 0.035),
                      1.0
                  )

                  bush.add_child(part)

          func create_grass_cluster(pos: Vector3):
              var cluster = Node3D.new()

              cluster.position = pos

              add_child(cluster)

              for i in 5:
                  var blade = MeshInstance3D.new()
                  var mesh = CylinderMesh.new()

                  mesh.top_radius = 0.015
                  mesh.bottom_radius = 0.055
                  mesh.height = 0.55 + float(i % 2) * 0.18

                  blade.mesh = mesh

                  blade.position = Vector3(
                      -0.8 + float(i) * 0.4,
                      mesh.height / 2.0,
                      sin(float(i)) * 0.35
                  )

                  blade.rotation_degrees.z = (
                      -8.0 + float(i) * 4.0
                  )

                  blade.material_override = make_material(
                      Color("#4f9a42"),
                      1.0
                  )

                  cluster.add_child(blade)

          func create_flowers(pos: Vector3):
              var colors = [
                  Color("#f1d45d"),
                  Color("#e87979"),
                  Color("#c98ee8")
              ]

              for i in 6:
                  var flower = MeshInstance3D.new()
                  var mesh = SphereMesh.new()

                  mesh.radius = 0.11
                  mesh.height = 0.2

                  flower.mesh = mesh

                  flower.position = Vector3(
                      -1.2 + float(i % 3) * 0.9,
                      0.13,
                      -0.5 + float(i / 3) * 0.9
                  )

                  flower.material_override = make_material(
                      colors[i % colors.size()],
                      0.8
                  )

                  add_child(flower)

          func create_rocks():
              var positions = [
                  Vector3(-18, 0.15, -13),
                  Vector3(-8, 0.12, 20),
                  Vector3(2, 0.13, 12),
                  Vector3(17, 0.16, 5),
                  Vector3(28, 0.15, 18),
                  Vector3(-28, 0.18, 10),
                  Vector3(31, 0.15, -14),
                  Vector3(-5, 0.12, -19)
              ]

              for i in positions.size():
                  var rock = MeshInstance3D.new()
                  var mesh = SphereMesh.new()

                  mesh.radius = 0.7
                  mesh.height = 1.2

                  rock.mesh = mesh
                  rock.position = positions[i]

                  rock.scale = Vector3(
                      1.2 + float(i % 2) * 0.45,
                      0.65,
                      0.9
                  )

                  rock.rotation_degrees.y = float(i * 31)

                  rock.material_override = make_material(
                      Color("#77766d"),
                      0.92
                  )

                  add_child(rock)

          func create_player():
              player = CharacterBody3D.new()
              player.position = Vector3(0, 1.3, 8)

              add_child(player)

              var collision = CollisionShape3D.new()
              var shape = CapsuleShape3D.new()

              shape.radius = 0.45
              shape.height = 1.8

              collision.shape = shape
              collision.position.y = 0.9

              player.add_child(collision)

              var body = MeshInstance3D.new()
              var body_mesh = CapsuleMesh.new()

              body_mesh.radius = 0.43
              body_mesh.height = 1.65

              body.mesh = body_mesh
              body.position.y = 0.9

              body.material_override = make_material(
                  Color("#3d70a8"),
                  0.85
              )

              player.add_child(body)

              var head = MeshInstance3D.new()
              var head_mesh = SphereMesh.new()

              head_mesh.radius = 0.38
              head_mesh.height = 0.76

              head.mesh = head_mesh
              head.position = Vector3(0, 2.05, 0)

              head.material_override = make_material(
                  Color("#dca97b"),
                  0.9
              )

              player.add_child(head)

          func create_camera():
              camera = Camera3D.new()

              camera.current = true
              camera.fov = 68.0

              add_child(camera)

              camera.global_position = (
                  player.global_position +
                  Vector3(0, 4.2, 7.8)
              )

              camera.look_at(
                  player.global_position +
                  Vector3(0, 1.0, 0),
                  Vector3.UP
              )

          func create_ui():
              var layer = CanvasLayer.new()
              add_child(layer)

              var title = Label.new()
              title.text = "MUNDO V1"
              title.position = Vector2(34, 28)

              title.add_theme_font_size_override(
                  "font_size",
                  34
              )

              title.add_theme_color_override(
                  "font_color",
                  Color("#ffffff")
              )

              layer.add_child(title)

              var subtitle = Label.new()
              subtitle.text = "V1.8 • ÁGUA E AMBIENTE"
              subtitle.position = Vector2(37, 70)

              subtitle.add_theme_font_size_override(
                  "font_size",
                  17
              )

              subtitle.add_theme_color_override(
                  "font_color",
                  Color("#e6f5df")
              )

              layer.add_child(subtitle)

              var status = Label.new()
              status.text = "EXPLORA • DESCUBRA • CONSTRUA"
              status.position = Vector2(38, 100)

              status.add_theme_font_size_override(
                  "font_size",
                  15
              )

              status.add_theme_color_override(
                  "font_color",
                  Color("#f4f4f4")
              )

              layer.add_child(status)

              var joystick = ColorRect.new()

              joystick.position = Vector2(45, 575)
              joystick.size = Vector2(130, 130)
              joystick.color = Color(1, 1, 1, 0.12)

              layer.add_child(joystick)

              var joystick_text = Label.new()

              joystick_text.text = "MOV"
              joystick_text.position = Vector2(88, 620)

              joystick_text.add_theme_font_size_override(
                  "font_size",
                  18
              )

              joystick_text.add_theme_color_override(
                  "font_color",
                  Color(1, 1, 1, 0.65)
              )

              layer.add_child(joystick_text)

              var jump = Button.new()

              jump.text = "PULAR"
              jump.position = Vector2(1080, 575)
              jump.size = Vector2(140, 55)

              layer.add_child(jump)

              jump.pressed.connect(_on_jump)

              var explore = Button.new()

              explore.text = "EXPLORAR"
              explore.position = Vector2(1080, 640)
              explore.size = Vector2(140, 55)

              layer.add_child(explore)

          func _on_jump():
              if player.is_on_floor():
                  player.velocity.y = 7.0

          func _unhandled_input(event):
              if event is InputEventScreenTouch:
                  if event.pressed:
                      if (
                          event.position.x < 250
                          and event.position.y > 500
                      ):
                          joystick_active = true
                          joystick_center = event.position
                  else:
                      joystick_active = false
                      joystick_vector = Vector2.ZERO

              elif event is InputEventScreenDrag:
                  if joystick_active:
                      var delta = event.position - joystick_center
                      joystick_vector = (
                          delta.limit_length(70.0) / 70.0
                      )

          func _physics_process(delta):
              if not player:
                  return

              water_time += delta

              var direction := Vector3.ZERO

              var keyboard_input = Input.get_vector(
                  "move_left",
                  "move_right",
                  "move_forward",
                  "move_backward"
              )

              direction.x = keyboard_input.x
              direction.z = keyboard_input.y

              if joystick_active:
                  direction.x = joystick_vector.x
                  direction.z = joystick_vector.y

              if direction.length() > 1.0:
                  direction = direction.normalized()

              var speed := 5.0

              player.velocity.x = direction.x * speed
              player.velocity.z = direction.z * speed

              if not player.is_on_floor():
                  player.velocity.y -= gravity * delta
              else:
                  if Input.is_action_just_pressed("jump"):
                      player.velocity.y = 7.0

              player.move_and_slide()

              var target_camera = (
                  player.global_position +
                  Vector3(0, 4.2, 7.8)
              )

              camera.global_position = camera.global_position.lerp(
                  target_camera,
                  min(delta * 5.0, 1.0)
              )

              camera.look_at(
                  player.global_position +
                  Vector3(0, 1.0, 0),
                  Vector3.UP
              )
          EOF

      - name: Criar preset Android corrigido
        shell: bash
        run: |
          set -euxo pipefail

          cat > export_presets.cfg <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""

          package/unique_name="com.mundov1.game"
          package/name="MUNDO V1"
          package/version_code=18
          package/version_name="1.8"

          package/architecture/arm64-v8a=true
          package/architecture/armeabi-v7a=false
          package/architecture/x86=false
          package/architecture/x86_64=false

          screen/immersive_mode=true
          screen/edge_to_edge=true

          graphics/opengl3=true

          keystore/debug="/home/runner/.android/debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"

          permissions/internet=false
          EOF

      - name: Criar debug keystore
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/.android"

          keytool \
            -genkeypair \
            -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          test -f "$HOME/.android/debug.keystore"

      - name: Validar projeto Godot
        shell: bash
        run: |
          set -euxo pipefail

          godot \
            --headless \
            --editor \
            --path . \
            --quit

      - name: Exportar APK
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf build
          mkdir -p build

          godot \
            --headless \
            --path . \
            --export-debug "Android" \
            build/MundoV1.apk

          test -f build/MundoV1.apk

          ls -lh build/MundoV1.apk

      - name: Verificar assinatura
        shell: bash
        run: |
          set -euxo pipefail

          "$ANDROID_HOME/build-tools/34.0.0/apksigner" \
            verify \
            --verbose \
            build/MundoV1.apk

      - name: Mostrar APK
        shell: bash
        run: |
          set -euxo pipefail

          ls -lh build/MundoV1.apk

          "$ANDROID_HOME/build-tools/34.0.0/aapt" \
            dump badging \
            build/MundoV1.apk | head -20

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: MUNDO-V1.8-APK
          path: build/MundoV1.apk
          if-no-files-found: error
