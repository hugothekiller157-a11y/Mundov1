name: MUNDO V1 - V2.5 AAA MOBILE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          mkdir -p "$ANDROID_HOME/cmdline-tools"

          curl -L -o commandlinetools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip

          unzip -q commandlinetools.zip \
            -d "$ANDROID_HOME/cmdline-tools"

          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"

          cp -r \
            "$ANDROID_HOME/cmdline-tools/cmdline-tools/"* \
            "$ANDROID_HOME/cmdline-tools/latest/"

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Instalar Godot 4.3
        shell: bash
        run: |
          set -euxo pipefail

          curl -L -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip

          unzip -q godot.zip

          GODOT_BIN="$(find . -maxdepth 3 -type f \
            -name 'Godot_v4.3-stable_linux.x86_64' \
            | head -n 1)"

          test -n "$GODOT_BIN"

          chmod +x "$GODOT_BIN"

          sudo cp "$GODOT_BIN" /usr/local/bin/godot

          godot --version

      - name: Instalar templates Android Godot 4.3
        shell: bash
        run: |
          set -euxo pipefail

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"

          rm -rf "$TEMPLATE_DIR"
          mkdir -p "$TEMPLATE_DIR"

          curl -L -o templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz

          rm -rf godot_templates
          mkdir -p godot_templates

          unzip -q templates.tpz \
            -d godot_templates

          DEBUG_TEMPLATE="$(find godot_templates \
            -type f \
            -name 'android_debug.apk' \
            | head -n 1)"

          RELEASE_TEMPLATE="$(find godot_templates \
            -type f \
            -name 'android_release.apk' \
            | head -n 1)"

          SOURCE_TEMPLATE="$(find godot_templates \
            -type f \
            -name 'android_source.zip' \
            | head -n 1)"

          VERSION_FILE="$(find godot_templates \
            -type f \
            -name 'version.txt' \
            | head -n 1)"

          test -n "$DEBUG_TEMPLATE"
          test -n "$RELEASE_TEMPLATE"

          cp "$DEBUG_TEMPLATE" \
            "$TEMPLATE_DIR/android_debug.apk"

          cp "$RELEASE_TEMPLATE" \
            "$TEMPLATE_DIR/android_release.apk"

          if [ -n "$SOURCE_TEMPLATE" ]; then
            cp "$SOURCE_TEMPLATE" \
              "$TEMPLATE_DIR/android_source.zip"
          fi

          if [ -n "$VERSION_FILE" ]; then
            cp "$VERSION_FILE" \
              "$TEMPLATE_DIR/version.txt"
          else
            echo "4.3.stable" > \
              "$TEMPLATE_DIR/version.txt"
          fi

          test -s "$TEMPLATE_DIR/android_debug.apk"
          test -s "$TEMPLATE_DIR/android_release.apk"

          echo "Templates Android encontrados:"
          ls -lh "$TEMPLATE_DIR"

      - name: Criar estrutura do jogo
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p scripts
          mkdir -p build

          cat > project.godot <<'EOF'
          ; MUNDO V1 - V2.5 AAA MOBILE
          ; Godot 4.3

          config_version=5

          [application]

          config/name="MUNDO V1"
          run/main_scene="res://Main.tscn"
          config/features=PackedStringArray("4.3", "GL Compatibility")

          boot_splash/bg_color=Color(0.04, 0.08, 0.12, 1)
          boot_splash/show_image=false

          [display]

          window/size/viewport_width=1280
          window/size/viewport_height=720
          window/size/window_width_override=1280
          window/size/window_height_override=720
          window/stretch/mode="canvas_items"

          [input]

          move_left={
          "deadzone": 0.2,
          "events": [Object(InputEventKey,"physical_keycode":65)]
          }

          move_right={
          "deadzone": 0.2,
          "events": [Object(InputEventKey,"physical_keycode":68)]
          }

          move_forward={
          "deadzone": 0.2,
          "events": [Object(InputEventKey,"physical_keycode":87)]
          }

          move_back={
          "deadzone": 0.2,
          "events": [Object(InputEventKey,"physical_keycode":83)]
          }

          jump={
          "deadzone": 0.2,
          "events": [Object(InputEventKey,"physical_keycode":32)]
          }

          sprint={
          "deadzone": 0.2,
          "events": [Object(InputEventKey,"physical_keycode":4194325)]
          }

          [rendering]

          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"

          textures/default_filters/use_nearest_mipmap_filter=false
          textures/vram_compression/import_etc2_astc=true

          environment/defaults/default_clear_color=Color(0.45, 0.72, 0.86, 1)

          [physics]

          3d/default_gravity=18.0

          [audio]

          default_bus_layout="res://default_bus_layout.tres"
          EOF

          cat > default_bus_layout.tres <<'EOF'
          [gd_resource format=3]

          [resource]
          EOF

          cat > Main.tscn <<'EOF'
          [gd_scene load_steps=2 format=3]

          [ext_resource path="res://scripts/main.gd" type="Script" id="1"]

          [node name="MundoV1" type="Node3D"]
          script = ExtResource("1")
          EOF

          cat > icon.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg"
               width="256"
               height="256"
               viewBox="0 0 256 256">

            <defs>
              <linearGradient id="sky"
                x1="0"
                y1="0"
                x2="1"
                y2="1">

                <stop offset="0"
                  stop-color="#79D9FF"/>

                <stop offset="1"
                  stop-color="#276AC1"/>
              </linearGradient>
            </defs>

            <rect
              x="10"
              y="10"
              width="236"
              height="236"
              rx="60"
              fill="url(#sky)"/>

            <circle
              cx="185"
              cy="66"
              r="25"
              fill="#FFF2C4"/>

            <path
              d="M24 170
                 Q65 110 106 151
                 Q137 181 165 132
                 Q195 94 232 130
                 L232 232
                 L24 232 Z"
              fill="#365F55"/>

            <path
              d="M24 188
                 Q67 143 105 175
                 Q141 205 175 157
                 Q205 121 232 151
                 L232 232
                 L24 232 Z"
              fill="#5D9B59"/>

            <path
              d="M24 207
                 Q65 176 105 198
                 Q150 222 187 181
                 Q211 154 232 176
                 L232 232
                 L24 232 Z"
              fill="#80C968"/>
          </svg>
          EOF

      - name: Criar mundo V2.5
        shell: bash
        run: |
          set -euxo pipefail

          cat > scripts/main.gd <<'EOF'
          extends Node3D

          const WORLD_SIZE: float = 110.0
          const WATER_LEVEL: float = -1.25

          var player: CharacterBody3D
          var camera: Camera3D
          var camera_pivot: Node3D

          var velocity_y: float = 0.0

          var life: float = 100.0
          var stamina: float = 100.0
          var collected: int = 0

          var sprinting: bool = false
          var day_time: float = 0.0

          var status_label: Label
          var life_bar: ProgressBar
          var stamina_bar: ProgressBar
          var inventory_label: Label

          var move_touch: Vector2 = Vector2.ZERO
          var touch_move_active: bool = false
          var touch_look_active: bool = false

          var environment: Environment
          var sun: DirectionalLight3D
          var water: MeshInstance3D

          func _ready() -> void:
              randomize()

              _create_environment()
              _create_lighting()

              _create_world()
              _create_mountains()
              _create_water()

              _create_forest()
              _create_rocks()
              _create_flowers()

              _create_resources()
              _create_camp()
              _create_player()
              _create_camera()
              _create_ui()

          func _process(delta: float) -> void:
              day_time += delta

              _animate_sky(delta)
              _animate_water(delta)
              _update_ui()

          func _physics_process(delta: float) -> void:
              if player == null:
                  return

              var input_dir: Vector2 = Input.get_vector(
                  "move_left",
                  "move_right",
                  "move_forward",
                  "move_back"
              )

              if touch_move_active:
                  input_dir = move_touch

              var direction: Vector3 = Vector3(
                  input_dir.x,
                  0.0,
                  input_dir.y
              )

              if direction.length() > 1.0:
                  direction = direction.normalized()

              sprinting = Input.is_action_pressed("sprint")

              var speed: float = 4.4

              if sprinting and stamina > 1.0 and direction.length() > 0.05:
                  speed = 7.2
                  stamina = max(
                      0.0,
                      stamina - delta * 14.0
                  )
              else:
                  stamina = min(
                      100.0,
                      stamina + delta * 8.0
                  )

              player.velocity.x = lerp(
                  player.velocity.x,
                  direction.x * speed,
                  delta * 8.0
              )

              player.velocity.z = lerp(
                  player.velocity.z,
                  direction.z * speed,
                  delta * 8.0
              )

              if not player.is_on_floor():
                  velocity_y -= 18.0 * delta
              else:
                  velocity_y = -0.5

              if Input.is_action_just_pressed("jump"):
                  if player.is_on_floor():
                      velocity_y = 7.4

              player.velocity.y = velocity_y

              player.move_and_slide()

              player.position.x = clamp(
                  player.position.x,
                  -WORLD_SIZE * 0.47,
                  WORLD_SIZE * 0.47
              )

              player.position.z = clamp(
                  player.position.z,
                  -WORLD_SIZE * 0.47,
                  WORLD_SIZE * 0.47
              )

              if direction.length() > 0.1:
                  var target_rotation: float = atan2(
                      direction.x,
                      direction.z
                  )

                  player.rotation.y = lerp_angle(
                      player.rotation.y,
                      target_rotation,
                      delta * 7.0
                  )

          func _create_environment() -> void:
              var world_environment: WorldEnvironment = WorldEnvironment.new()

              environment = Environment.new()

              environment.background_mode = Environment.BG_SKY

              var sky: Sky = Sky.new()
              var sky_material: ProceduralSkyMaterial = ProceduralSkyMaterial.new()

              sky_material.sky_top_color = Color("#2869A2")
              sky_material.sky_horizon_color = Color("#B9E0F1")

              sky_material.ground_bottom_color = Color("#243737")
              sky_material.ground_horizon_color = Color("#BBD4D1")

              sky_material.sun_angle_max = 24.0

              sky.sky_material = sky_material

              environment.sky = sky

              environment.ambient_light_source = \
                  Environment.AMBIENT_SOURCE_SKY

              environment.ambient_light_energy = 0.82

              environment.reflected_light_source = \
                  Environment.REFLECTION_SOURCE_SKY

              environment.tonemap_mode = \
                  Environment.TONE_MAPPER_FILMIC

              environment.tonemap_exposure = 1.12

              environment.glow_enabled = true
              environment.glow_intensity = 0.75
              environment.glow_strength = 0.95

              environment.fog_enabled = true
              environment.fog_light_color = Color("#A9D4E4")
              environment.fog_light_energy = 0.72
              environment.fog_density = 0.0038
              environment.fog_height = 8.0
              environment.fog_height_density = 0.015

              world_environment.environment = environment

              add_child(world_environment)

          func _create_lighting() -> void:
              sun = DirectionalLight3D.new()

              sun.name = "Sun"

              sun.rotation_degrees = Vector3(
                  -48.0,
                  -35.0,
                  0.0
              )

              sun.light_color = Color("#FFE8C2")
              sun.light_energy = 1.55

              sun.shadow_enabled = true
              sun.directional_shadow_max_distance = 85.0

              add_child(sun)

              var fill: DirectionalLight3D = \
                  DirectionalLight3D.new()

              fill.name = "SkyFill"

              fill.rotation_degrees = Vector3(
                  -28.0,
                  145.0,
                  0.0
              )

              fill.light_color = Color("#8FC9FF")
              fill.light_energy = 0.38

              add_child(fill)

          func _create_world() -> void:
              var ground_material: StandardMaterial3D = \
                  StandardMaterial3D.new()

              ground_material.albedo_color = Color("#547C52")
              ground_material.roughness = 0.96

              var islands: Array[Vector3] = [
                  Vector3(0, -2.8, 2),
                  Vector3(-31, -3.2, -10),
                  Vector3(32, -3.1, -18),
                  Vector3(-20, -3.0, 28),
                  Vector3(30, -3.0, 30),
                  Vector3(2, -3.7, 42)
              ]

              var sizes: Array[Vector3] = [
                  Vector3(57, 6, 52),
                  Vector3(31, 5, 29),
                  Vector3(34, 5, 27),
                  Vector3(34, 5, 31),
                  Vector3(31, 5, 30),
                  Vector3(36, 5, 25)
              ]

              for i in islands.size():
                  var island: MeshInstance3D = \
                      MeshInstance3D.new()

                  var mesh: SphereMesh = SphereMesh.new()

                  mesh.radius = 1.0
                  mesh.height = 2.0

                  mesh.radial_segments = 48
                  mesh.rings = 20

                  island.mesh = mesh

                  island.position = islands[i]
                  island.scale = sizes[i]

                  island.material_override = ground_material

                  add_child(island)

              _create_ground_patches()

          func _create_ground_patches() -> void:
              var dirt_material: StandardMaterial3D = \
                  StandardMaterial3D.new()

              dirt_material.albedo_color = Color("#866B4B")
              dirt_material.roughness = 1.0

              for i in 30:
                  var patch: MeshInstance3D = \
                      MeshInstance3D.new()

                  var mesh: SphereMesh = SphereMesh.new()

                  mesh.radius = 1.0
                  mesh.height = 2.0
                  mesh.radial_segments = 24
                  mesh.rings = 8

                  patch.mesh = mesh

                  patch.position = Vector3(
                      randf_range(-48.0, 48.0),
                      -0.05,
                      randf_range(-46.0, 46.0)
                  )

                  patch.scale = Vector3(
                      randf_range(1.0, 3.5),
                      0.035,
                      randf_range(0.7, 2.5)
                  )

                  patch.rotation.y = randf_range(
                      0.0,
                      TAU
                  )

                  patch.material_override = dirt_material

                  add_child(patch)

          func _create_mountains() -> void:
              var mountain_material: StandardMaterial3D = \
                  StandardMaterial3D.new()

              mountain_material.albedo_color = Color("#405A5C")
              mountain_material.roughness = 1.0

              var snow_material: StandardMaterial3D = \
                  StandardMaterial3D.new()

              snow_material.albedo_color = Color("#CFE1E0")
              snow_material.roughness = 0.92

              var positions: Array[Vector3] = [
                  Vector3(-62, 7, -55),
                  Vector3(-35, 5, -66),
                  Vector3(0, 8, -72),
                  Vector3(38, 6, -66),
                  Vector3(65, 9, -52),
                  Vector3(70, 4, 10)
              ]

              for p in positions:
                  var mountain: Node3D = Node3D.new()

                  mountain.position = p
                  add_child(mountain)

                  var base: MeshInstance3D = \
                      MeshInstance3D.new()

                  var mesh: CylinderMesh = CylinderMesh.new()

                  mesh.top_radius = 0.25
                  mesh.bottom_radius = 1.0
                  mesh.height = 25.0
                  mesh.radial_segments = 7

                  base.mesh = mesh

                  base.position.y = 8.0

                  base.scale = Vector3(
                      randf_range(1.8, 3.1),
                      randf_range(1.1, 1.7),
                      randf_range(1.5, 2.6)
                  )

                  base.material_override = mountain_material

                  mountain.add_child(base)

                  var peak: MeshInstance3D = \
                      MeshInstance3D.new()

                  var peak_mesh: CylinderMesh = \
                      CylinderMesh.new()

                  peak_mesh.top_radius = 0.02
                  peak_mesh.bottom_radius = 0.45
                  peak_mesh.height = 7.0
                  peak_mesh.radial_segments = 7

                  peak.mesh = peak_mesh

                  peak.position.y = 21.0

                  peak.scale = Vector3(
                      1.0,
                      1.0,
                      1.0
                  )

                  peak.material_override = snow_material

                  mountain.add_child(peak)

          func _create_water() -> void:
              water = MeshInstance3D.new()

              water.name = "Water"

              var mesh: PlaneMesh = PlaneMesh.new()

              mesh.size = Vector2(
                  55.0,
                  38.0
              )

              mesh.subdivide_width = 20
              mesh.subdivide_depth = 16

              water.mesh = mesh

              water.position = Vector3(
                  10.0,
                  WATER_LEVEL,
                  -24.0
              )

              var material: StandardMaterial3D = \
                  StandardMaterial3D.new()

              material.albedo_color = Color(
                  0.08,
                  0.43,
                  0.68,
                  0.78
              )

              material.metallic = 0.25
              material.roughness = 0.08

              material.transparency = \
                  BaseMaterial3D.TRANSPARENCY_ALPHA

              water.material_override = material

              add_child(water)

              for i in 12:
                  var ripple: MeshInstance3D = \
                      MeshInstance3D.new()

                  var ripple_mesh: TorusMesh = \
                      TorusMesh.new()

                  ripple_mesh.inner_radius = 0.35
                  ripple_mesh.outer_radius = 0.43

                  ripple_mesh.rings = 16
                  ripple_mesh.ring_segments = 12

                  ripple.mesh = ripple_mesh

                  ripple.position = Vector3(
                      randf_range(-14.0, 34.0),
                      WATER_LEVEL + 0.04,
                      randf_range(-40.0, -10.0)
                  )

                  ripple.scale = Vector3(
                      randf_range(1.0, 2.6),
                      1.0,
                      randf_range(0.5, 1.5)
                  )

                  var ripple_material: StandardMaterial3D = \
                      StandardMaterial3D.new()

                  ripple_material.albedo_color = Color(
                      0.65,
                      0.91,
                      1.0,
                      0.28
                  )

                  ripple_material.transparency = \
                      BaseMaterial3D.TRANSPARENCY_ALPHA

                  ripple.material_override = ripple_material

                  add_child(ripple)

          func _create_forest() -> void:
              for i in 34:
                  var p: Vector3 = Vector3(
                      randf_range(-47.0, 47.0),
                      0.45,
                      randf_range(-44.0, 44.0)
                  )

                  if p.distance_to(
                      Vector3(0, 0, 6)
                  ) < 11.0:
                      continue

                  if p.z < -11.0 and \
                     p.x > -18.0 and \
                     p.x < 34.0:
                      continue

                  _create_tree(
                      p,
                      randf_range(0.8, 1.35)
                  )

              for i in 85:
                  var bush_position: Vector3 = Vector3(
                      randf_range(-48.0, 48.0),
                      0.55,
                      randf_range(-46.0, 46.0)
                  )

                  _create_bush(
                      bush_position,
                      randf_range(0.55, 1.35)
                  )

              for i in 125:
                  var grass_position: Vector3 = Vector3(
                      randf_range(-48.0, 48.0),
                      0.62,
                      randf_range(-46.0, 46.0)
                  )

                  _create_grass(
                      grass_position,
                      randf_range(0.55, 1.3)
                  )

          func _create_tree(
              position: Vector3,
              scale_factor: float
          ) -> void:

              var tree: Node3D = Node3D.new()

              tree.position = position
              tree.scale = Vector3.ONE * scale_factor

              add_child(tree)

              var trunk_material: StandardMaterial3D = \
                  StandardMaterial3D.new()

              trunk_material.albedo_color = Color("#704A32")
              trunk_material.roughness = 0.96

              var trunk: MeshInstance3D = \
                  MeshInstance3D.new()

              var trunk_mesh: CylinderMesh = \
                  CylinderMesh.new()

              trunk_mesh.top_radius = 0.23
              trunk_mesh.bottom_radius = 0.42
              trunk_mesh.height = 4.2
              trunk_mesh.radial_segments = 12

              trunk.mesh = trunk_mesh
              trunk.position.y = 2.1

              trunk.material_override = trunk_material

              tree.add_child(trunk)

              var leaf_material: StandardMaterial3D = \
                  StandardMaterial3D.new()

              leaf_material.albedo_color = Color("#347C49")
              leaf_material.roughness = 0.82

              var leaf_light_material: StandardMaterial3D = \
                  StandardMaterial3D.new()

              leaf_light_material.albedo_color = Color("#4F9A56")
              leaf_light_material.roughness = 0.8

              var positions: Array[Vector3] = [
                  Vector3(0, 4.0, 0),
                  Vector3(-1.0, 4.4, 0.2),
                  Vector3(1.0, 4.5, -0.2),
                  Vector3(-0.4, 5.1, -0.8),
                  Vector3(0.5, 5.2, 0.8),
                  Vector3(0, 5.8, 0)
              ]

              for i in positions.size():
                  var leaf: MeshInstance3D = \
                      MeshInstance3D.new()

                  var sphere: SphereMesh = SphereMesh.new()

                  sphere.radius = \
                      randf_range(1.15, 1.65)

                  sphere.height = \
                      randf_range(2.0, 3.0)

                  sphere.radial_segments = 18
                  sphere.rings = 10

                  leaf.mesh = sphere
                  leaf.position = positions[i]

                  leaf.scale = Vector3(
                      randf_range(0.9, 1.3),
                      randf_range(0.75, 1.0),
                      randf_range(0.9, 1.25)
                  )

                  if i % 2 == 0:
                      leaf.material_override = \
                          leaf_material
                  else:
                      leaf.material_override = \
                          leaf_light_material

                  tree.add_child(leaf)

          func _create_bush(
              position: Vector3,
              scale_factor: float
          ) -> void:

              var bush: MeshInstance3D = \
                  MeshInstance3D.new()

              var mesh: SphereMesh = SphereMesh.new()

              mesh.radius = 0.8
              mesh.height = 1.3
              mesh.radial_segments = 16
              mesh.rings = 8

              bush.mesh = mesh

              bush.position = position

              bush.scale = Vector3(
                  1.35,
                  0.72,
                  1.05
              ) * scale_factor

              var material: StandardMaterial3D = \
                  StandardMaterial3D.new()

              material.albedo_color = Color("#4C914F")
              material.roughness = 0.92

              bush.material_override = material

              add_child(bush)

          func _create_grass(
              position: Vector3,
              scale_factor: float
          ) -> void:

              var grass: MeshInstance3D = \
                  MeshInstance3D.new()

              var mesh: CylinderMesh = \
                  CylinderMesh.new()

              mesh.top_radius = 0.01
              mesh.bottom_radius = 0.11
              mesh.height = 0.9
              mesh.radial_segments = 5

              grass.mesh = mesh
              grass.position = position

              grass.scale = Vector3.ONE * scale_factor

              grass.rotation.y = randf_range(
                  0.0,
                  TAU
              )

              var material: StandardMaterial3D = \
                  StandardMaterial3D.new()

              material.albedo_color = Color("#75A94F")
              material.roughness = 1.0

              grass.material_override = material

              add_child(grass)

