name: MUNDO V1.9 - APK Android ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          mkdir -p "$ANDROID_HOME/cmdline-tools"

          cd "$RUNNER_TEMP"

          curl -L \
            -o commandlinetools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip

          unzip -q commandlinetools.zip -d "$ANDROID_HOME/cmdline-tools"

          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" \
             "$ANDROID_HOME/cmdline-tools/latest"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Instalar Godot 4.3
        shell: bash
        run: |
          set -euxo pipefail

          cd "$RUNNER_TEMP"

          curl -L \
            -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip

          unzip -q godot.zip

          chmod +x Godot_v4.3-stable_linux.x86_64

          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot

          godot --version

      - name: Instalar templates do Godot
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"

          cd "$RUNNER_TEMP"

          curl -L \
            -o templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz

          mkdir -p templates

          unzip -q templates.tpz -d templates

          cp -r templates/templates/* \
            "$HOME/.local/share/godot/export_templates/4.3.stable/"

          find "$HOME/.local/share/godot/export_templates/4.3.stable" -maxdepth 2 -type f

      - name: Criar projeto MUNDO V1.9
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf project.godot Main.tscn scripts icon.svg export_presets.cfg build
          mkdir -p scripts build

          cat > project.godot <<'EOF'
          ; Engine configuration file.
          ; MUNDO V1.9

          config_version=5

          [application]

          config/name="MUNDO V1"
          run/main_scene="res://Main.tscn"
          config/icon="res://icon.svg"

          [display]

          window/size/viewport_width=1280
          window/size/viewport_height=720
          window/size/window_width_override=1280
          window/size/window_height_override=720
          window/stretch/mode="canvas_items"

          [rendering]

          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          textures/default_filters/use_nearest_mipmap_filter=false
          textures/canvas_textures/default_texture_filter=1
          textures/vram_compression/import_etc2_astc=true

          [input]

          move_forward={
          "deadzone": 0.5,
          "events": [Object(InputEventKey,"physical_keycode":87)]
          }

          move_back={
          "deadzone": 0.5,
          "events": [Object(InputEventKey,"physical_keycode":83)]
          }

          move_left={
          "deadzone": 0.5,
          "events": [Object(InputEventKey,"physical_keycode":65)]
          }

          move_right={
          "deadzone": 0.5,
          "events": [Object(InputEventKey,"physical_keycode":68)]
          }

          jump={
          "deadzone": 0.5,
          "events": [Object(InputEventKey,"physical_keycode":32)]
          }
          EOF

          cat > Main.tscn <<'EOF'
          [gd_scene load_steps=2 format=3]

          [ext_resource path="res://scripts/main.gd" type="Script" id="1"]

          [node name="MundoV1" type="Node3D"]
          script = ExtResource("1")
          EOF

          cat > icon.svg <<'EOF'
          <svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#75c8f2"/>
                <stop offset="1" stop-color="#d9f1ff"/>
              </linearGradient>
              <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#75ad52"/>
                <stop offset="1" stop-color="#386c39"/>
              </linearGradient>
            </defs>
            <rect width="256" height="256" rx="54" fill="url(#sky)"/>
            <circle cx="184" cy="70" r="32" fill="#fff3b0"/>
            <path d="M0 165 Q60 120 116 157 T256 145 V256 H0Z" fill="url(#land)"/>
            <path d="M0 194 Q55 160 105 191 T256 178 V256 H0Z" fill="#4d843f"/>
            <path d="M104 256 Q130 220 161 198 Q180 185 201 179 Q185 222 185 256Z" fill="#4c9fc1"/>
            <path d="M72 160 Q82 127 98 105 Q111 128 118 160Z" fill="#315f35"/>
            <rect x="92" y="137" width="10" height="43" rx="5" fill="#765137"/>
            <circle cx="98" cy="118" r="27" fill="#4f9147"/>
            <circle cx="78" cy="132" r="19" fill="#5b9d4d"/>
            <circle cx="116" cy="133" r="20" fill="#43833f"/>
          </svg>
          EOF

          cat > scripts/main.gd <<'EOF'
          extends Node3D

          var player: CharacterBody3D
          var camera: Camera3D
          var sun: DirectionalLight3D
          var env: WorldEnvironment

          var move_input := Vector2.ZERO
          var water_time := 0.0
          var camera_distance := 8.2
          var camera_height := 4.4

          func _ready():
              setup_environment()
              setup_lighting()
              create_world()
              create_player()
              create_ui()

          func setup_environment():
              env = WorldEnvironment.new()
              env.name = "WorldEnvironment"

              var environment := Environment.new()

              environment.background_mode = Environment.BG_COLOR
              environment.background_color = Color("#82c4ea")

              environment.ambient_light_source = Environment.AMBIENT_SOURCE_COLOR
              environment.ambient_light_color = Color("#e8f5ff")
              environment.ambient_light_energy = 0.88

              environment.reflected_light_source = Environment.REFLECTION_SOURCE_BG

              environment.tonemap_mode = Environment.TONE_MAPPER_FILMIC
              environment.tonemap_exposure = 1.06
              environment.tonemap_white = 1.12

              environment.fog_enabled = true
              environment.fog_light_color = Color("#b8d9e9")
              environment.fog_light_energy = 0.32
              environment.fog_density = 0.003
              environment.fog_sky_affect = 0.55

              env.environment = environment
              add_child(env)

          func setup_lighting():
              sun = DirectionalLight3D.new()
              sun.name = "Sun"

              sun.rotation_degrees = Vector3(-48, -32, 0)
              sun.light_color = Color("#fff4dc")
              sun.light_energy = 1.22

              sun.shadow_enabled = true
              sun.directional_shadow_max_distance = 85.0
              sun.directional_shadow_split_1 = 0.08
              sun.directional_shadow_split_2 = 0.25
              sun.directional_shadow_split_3 = 0.55

              sun.shadow_normal_bias = 1.0
              sun.shadow_bias = 0.08

              add_child(sun)

              var fill := DirectionalLight3D.new()
              fill.name = "SkyFill"
              fill.rotation_degrees = Vector3(35, 145, 0)
              fill.light_color = Color("#b9dcff")
              fill.light_energy = 0.22
              fill.shadow_enabled = false
              add_child(fill)

          func create_world():
              create_ground()
              create_water()
              create_hills()
              create_shore()
              create_vegetation()
              create_rocks()

          func make_material(color: Color, roughness := 0.9, metallic := 0.0) -> StandardMaterial3D:
              var material := StandardMaterial3D.new()
              material.albedo_color = color
              material.roughness = roughness
              material.metallic = metallic
              return material

          func create_ground():
              var ground := MeshInstance3D.new()
              ground.name = "Ground"

              var mesh := PlaneMesh.new()
              mesh.size = Vector2(110, 110)
              mesh.subdivide_width = 24
              mesh.subdivide_depth = 24

              ground.mesh = mesh
              ground.position.y = -0.05
              ground.material_override = make_material(Color("#62994b"), 1.0)

              add_child(ground)

              var body := StaticBody3D.new()
              body.name = "GroundCollision"

              var collision := CollisionShape3D.new()
              var shape := BoxShape3D.new()
              shape.size = Vector3(110, 1, 110)

              collision.shape = shape
              collision.position.y = -0.5

              body.add_child(collision)
              add_child(body)

          func create_water():
              var water := MeshInstance3D.new()
              water.name = "Water"

              var mesh := PlaneMesh.new()
              mesh.size = Vector2(45, 27)
              mesh.subdivide_width = 14
              mesh.subdivide_depth = 10

              water.mesh = mesh
              water.position = Vector3(10, 0.065, -8)

              var material := make_material(
                  Color(0.045, 0.36, 0.56, 0.78),
                  0.08,
                  0.08
              )

              material.transparency = BaseMaterial3D.TRANSPARENCY_ALPHA
              material.shading_mode = BaseMaterial3D.SHADING_MODE_PER_PIXEL
              material.cull_mode = BaseMaterial3D.CULL_DISABLED

              water.material_override = material
              add_child(water)

              for i in range(7):
                  var shine := MeshInstance3D.new()
                  var strip := PlaneMesh.new()

                  strip.size = Vector2(3.5 + float(i % 3), 0.10)

                  shine.mesh = strip
                  shine.position = Vector3(
                      1.0 + float(i) * 4.8,
                      0.105,
                      -13.0 + float((i * 5) % 18)
                  )

                  var shine_mat := make_material(
                      Color(0.68, 0.9, 0.96, 0.22),
                      0.05,
                      0.0
                  )

                  shine_mat.transparency = BaseMaterial3D.TRANSPARENCY_ALPHA
                  shine.material_override = shine_mat

                  add_child(shine)

          func create_hills():
              var positions = [
                  Vector3(-30, 3.0, -18),
                  Vector3(-18, 2.0, -30),
                  Vector3(29, 4.0, -27),
                  Vector3(36, 2.5, 8),
                  Vector3(-35, 2.0, 22),
                  Vector3(30, 2.0, 30)
              ]

              for i in range(positions.size()):
                  var hill := MeshInstance3D.new()
                  var sphere := SphereMesh.new()

                  sphere.radius = 9.0 + float(i % 3) * 2.0
                  sphere.height = 8.0 + float(i % 2) * 2.0

                  hill.mesh = sphere
                  hill.position = positions[i]
                  hill.scale = Vector3(1.4, 0.55, 1.1)

                  hill.material_override = make_material(
                      Color("#4e813f"),
                      1.0
                  )

                  add_child(hill)

          func create_shore():
              var shore_positions = [
                  Vector3(-6, 0.02, -18),
                  Vector3(1, 0.02, -18),
                  Vector3(18, 0.02, -18),
                  Vector3(25, 0.02, -9),
                  Vector3(25, 0.02, 1)
              ]

              for pos in shore_positions:
                  var patch := MeshInstance3D.new()
                  var mesh := PlaneMesh.new()

                  mesh.size = Vector2(7.0, 3.0)

                  patch.mesh = mesh
                  patch.position = pos
                  patch.rotation_degrees.y = 15

                  patch.material_override = make_material(
                      Color("#c9b779"),
                      0.98
                  )

                  add_child(patch)

          func create_vegetation():
              var tree_positions = [
                  Vector3(-12, 0, -4),
                  Vector3(-22, 0, 4),
                  Vector3(-28, 0, -9),
                  Vector3(-6, 0, 18),
                  Vector3(3, 0, 23),
                  Vector3(20, 0, 17),
                  Vector3(30, 0, 20),
                  Vector3(-35, 0, -3),
                  Vector3(33, 0, -18)
              ]

              for i in range(tree_positions.size()):
                  create_tree(tree_positions[i], 0.85 + float(i % 4) * 0.08)

              var pine_positions = [
                  Vector3(-17, 0, -19),
                  Vector3(13, 0, 26),
                  Vector3(25, 0, -28),
                  Vector3(-31, 0, 14)
              ]

              for pos in pine_positions:
                  create_pine(pos)

              for i in range(34):
                  var x := -42.0 + float((i * 17) % 84)
                  var z := -39.0 + float((i * 29) % 78)

                  if abs(x - 10.0) < 23.0 and abs(z + 8.0) < 15.0:
                      continue

                  create_bush(Vector3(x, 0, z), 0.65 + float(i % 3) * 0.12)

              for i in range(55):
                  var x := -44.0 + float((i * 23) % 88)
                  var z := -42.0 + float((i * 31) % 84)

                  create_grass(Vector3(x, 0, z))

              for i in range(22):
                  var x := -38.0 + float((i * 19) % 76)
                  var z := -36.0 + float((i * 27) % 72)

                  create_flower(Vector3(x, 0, z), i % 2 == 0)

          func create_tree(pos: Vector3, scale_value: float):
              var trunk := MeshInstance3D.new()
              var trunk_mesh := CylinderMesh.new()

              trunk_mesh.top_radius = 0.22
              trunk_mesh.bottom_radius = 0.32
              trunk_mesh.height = 2.7

              trunk.mesh = trunk_mesh
              trunk.position = pos + Vector3(0, 1.35 * scale_value, 0)
              trunk.scale = Vector3.ONE * scale_value
              trunk.material_override = make_material(Color("#765238"), 0.95)

              add_child(trunk)

              var crown_colors = [
                  Color("#4d8d45"),
                  Color("#5b9d4b"),
                  Color("#3f7d3d")
              ]

              for j in range(4):
                  var crown := MeshInstance3D.new()
                  var sphere := SphereMesh.new()

                  sphere.radius = 1.55 - float(j) * 0.08
                  sphere.height = 2.5

                  crown.mesh = sphere

                  var angle := float(j) * 1.57

                  crown.position = pos + Vector3(
                      cos(angle) * 0.55,
                      3.0 * scale_value + float(j % 2) * 0.28,
                      sin(angle) * 0.55
                  )

                  crown.scale = Vector3(1.0, 0.72, 1.0) * scale_value
                  crown.material_override = make_material(crown_colors[j % 3], 1.0)

                  add_child(crown)

          func create_pine(pos: Vector3):
              var trunk := MeshInstance3D.new()
              var trunk_mesh := CylinderMesh.new()

              trunk_mesh.top_radius = 0.18
              trunk_mesh.bottom_radius = 0.28
              trunk_mesh.height = 3.1

              trunk.mesh = trunk_mesh
              trunk.position = pos + Vector3(0, 1.55, 0)
              trunk.material_override = make_material(Color("#65462f"), 1.0)

              add_child(trunk)

              for j in range(3):
                  var crown := MeshInstance3D.new()
                  var cone := CylinderMesh.new()

                  cone.top_radius = 0.0
                  cone.bottom_radius = 1.45 - float(j) * 0.28
                  cone.height = 2.3

                  crown.mesh = cone
                  crown.position = pos + Vector3(
                      0,
                      2.4 + float(j) * 0.85,
                      0
                  )

                  crown.material_override = make_material(
                      Color("#356f3d"),
                      1.0
                  )

                  add_child(crown)

          func create_bush(pos: Vector3, scale_value: float):
              var bush := MeshInstance3D.new()
              var sphere := SphereMesh.new()

              sphere.radius = 0.7
              sphere.height = 1.15

              bush.mesh = sphere
              bush.position = pos + Vector3(0, 0.55 * scale_value, 0)
              bush.scale = Vector3(1.2, 0.75, 1.0) * scale_value

              bush.material_override = make_material(
                  Color("#477f3e"),
                  1.0
              )

              add_child(bush)

          func create_grass(pos: Vector3):
              var grass := MeshInstance3D.new()
              var mesh := CylinderMesh.new()

              mesh.top_radius = 0.015
              mesh.bottom_radius = 0.055
              mesh.height = 0.45

              grass.mesh = mesh
              grass.position = pos + Vector3(0, 0.22, 0)
              grass.rotation_degrees.y = float(pos.x * 13.0)

              grass.material_override = make_material(
                  Color("#76a953"),
                  1.0
              )

              add_child(grass)

          func create_flower(pos: Vector3, yellow: bool):
              var stem := MeshInstance3D.new()
              var stem_mesh := CylinderMesh.new()

              stem_mesh.top_radius = 0.015
              stem_mesh.bottom_radius = 0.025
              stem_mesh.height = 0.45

              stem.mesh = stem_mesh
              stem.position = pos + Vector3(0, 0.23, 0)

              stem.material_override = make_material(
                  Color("#4c813e"),
                  1.0
              )

              add_child(stem)

              var flower := MeshInstance3D.new()
              var sphere := SphereMesh.new()

              sphere.radius = 0.11
              sphere.height = 0.20

              flower.mesh = sphere
              flower.position = pos + Vector3(0, 0.48, 0)

              flower.material_override = make_material(
                  Color("#f2d34f") if yellow else Color("#e58aa8"),
                  0.7
              )

              add_child(flower)

          func create_rocks():
              var positions = [
                  Vector3(-8, 0.35, 4),
                  Vector3(-25, 0.3, 18),
                  Vector3(5, 0.25, -4),
                  Vector3(27, 0.4, 8),
                  Vector3(37, 0.3, -4),
                  Vector3(-31, 0.3, -23),
                  Vector3(15, 0.25, 13)
              ]

              for i in range(positions.size()):
                  var rock := MeshInstance3D.new()
                  var sphere := SphereMesh.new()

                  sphere.radius = 0.65 + float(i % 3) * 0.15
                  sphere.height = 0.9

                  rock.mesh = sphere
                  rock.position = positions[i]
                  rock.scale = Vector3(1.3, 0.7, 0.9)
                  rock.rotation_degrees.y = float(i * 37)

                  rock.material_override = make_material(
                      Color("#777c72"),
                      0.92
                  )

                  add_child(rock)

          func create_player():
              player = CharacterBody3D.new()
              player.name = "Player"
              player.position = Vector3(0, 1.3, 8)

              var collision := CollisionShape3D.new()
              var capsule := CapsuleShape3D.new()

              capsule.radius = 0.45
              capsule.height = 1.8

              collision.shape = capsule
              collision.position.y = 0.9

              player.add_child(collision)

              var body := MeshInstance3D.new()
              var body_mesh := CapsuleMesh.new()

              body_mesh.radius = 0.43
              body_mesh.height = 1.35

              body.mesh = body_mesh
              body.position.y = 0.88
              body.material_override = make_material(Color("#4f79a8"), 0.82)

              player.add_child(body)

              var head := MeshInstance3D.new()
              var head_mesh := SphereMesh.new()

              head_mesh.radius = 0.47
              head_mesh.height = 0.94

              head.mesh = head_mesh
              head.position.y = 1.78
              head.material_override = make_material(Color("#d99f78"), 0.88)

              player.add_child(head)

              add_child(player)

              camera = Camera3D.new()
              camera.name = "Camera3D"
              camera.current = true
              camera.fov = 62.0

              add_child(camera)

          func create_ui():
              var layer := CanvasLayer.new()
              layer.name = "UI"
              add_child(layer)

              var title := Label.new()
              title.text = "MUNDO V1"
              title.position = Vector2(34, 24)
              title.add_theme_font_size_override("font_size", 32)
              title.add_theme_color_override("font_color", Color("#ffffff"))
              layer.add_child(title)

              var subtitle := Label.new()
              subtitle.text = "V1.9 • UM NOVO MUNDO PARA EXPLORAR"
              subtitle.position = Vector2(36, 63)
              subtitle.add_theme_font_size_override("font_size", 16)
              subtitle.add_theme_color_override("font_color", Color("#e4f5ff"))
              layer.add_child(subtitle)

              var status := Label.new()
              status.text = "EXPLORA  •  DESCUBRA  •  CONSTRUA"
              status.position = Vector2(36, 96)
              status.add_theme_font_size_override("font_size", 14)
              status.add_theme_color_override("font_color", Color("#ffffff"))
              layer.add_child(status)

              var joystick := Label.new()
              joystick.text = "◯"
              joystick.position = Vector2(55, 570)
              joystick.add_theme_font_size_override("font_size", 82)
              joystick.add_theme_color_override(
                  "font_color",
                  Color(1, 1, 1, 0.38)
              )
              layer.add_child(joystick)

              var jump := Label.new()
              jump.text = "PULAR"
              jump.position = Vector2(1040, 560)
              jump.add_theme_font_size_override("font_size", 20)
              jump.add_theme_color_override(
                  "font_color",
                  Color(1, 1, 1, 0.82)
              )
              layer.add_child(jump)

              var explore := Label.new()
              explore.text = "EXPLORAR"
              explore.position = Vector2(1010, 605)
              explore.add_theme_font_size_override("font_size", 24)
              explore.add_theme_color_override(
                  "font_color",
                  Color("#ffffff")
              )
              layer.add_child(explore)

          func _physics_process(delta):
              if not player:
                  return

              var keyboard_input := Vector2(
                  Input.get_axis("move_left", "move_right"),
                  Input.get_axis("move_forward", "move_back")
              )

              if keyboard_input.length() > 0.1:
                  move_input = keyboard_input.normalized()

              var direction := Vector3(
                  move_input.x,
                  0,
                  move_input.y
              )

              var speed := 4.2

              if direction.length() > 0.1:
                  player.velocity.x = direction.x * speed
                  player.velocity.z = direction.z * speed

                  var target_rotation := atan2(
                      direction.x,
                      direction.z
                  )

                  player.rotation.y = lerp_angle(
                      player.rotation.y,
                      target_rotation,
                      delta * 8.0
                  )
              else:
                  player.velocity.x = move_toward(
                      player.velocity.x,
                      0,
                      speed * delta * 5.0
                  )

                  player.velocity.z = move_toward(
                      player.velocity.z,
                      0,
                      speed * delta * 5.0
                  )

              if not player.is_on_floor():
                  player.velocity.y -= 12.0 * delta
              else:
                  player.velocity.y = -0.5

              if Input.is_action_just_pressed("jump") and player.is_on_floor():
                  player.velocity.y = 5.0

              player.move_and_slide()

              update_camera(delta)

              water_time += delta

          func update_camera(delta):
              if not camera:
                  return

              var desired_position := player.global_position + Vector3(
                  0,
                  camera_height,
                  camera_distance
              )

              camera.global_position = camera.global_position.lerp(
                  desired_position,
                  delta * 5.0
              )

              var look_target := player.global_position + Vector3(
                  0,
                  1.0,
                  0
              )

              camera.look_at(look_target, Vector3.UP)

          func _unhandled_input(event):
              if event is InputEventScreenTouch:
                  if event.pressed:
                      if event.position.x < 430:
                          move_input = Vector2.ZERO

              elif event is InputEventScreenDrag:
                  if event.position.x < 430:
                      var center := Vector2(150, 620)
                      var offset := event.position - center

                      if offset.length() > 12.0:
                          move_input = offset.normalized()
                      else:
                          move_input = Vector2.ZERO

          EOF

      - name: Criar export_presets.cfg
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/.android"

          keytool \
            -genkeypair \
            -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          cat > export_presets.cfg <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""

          gradle_build/use_gradle_build=false

          package/unique_name="com.mundov1.game"
          package/name="MUNDO V1"
          package/signed=true

          version/code=19
          version/name="1.9"

          screen/immersive_mode=true
          screen/edge_to_edge=false

          launcher_icons/main_192x192=""
          launcher_icons/adaptive_foreground_432x432=""
          launcher_icons/adaptive_background_432x432=""

          graphics/opengl=true

          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false

          keystore/debug="$HOME/.android/debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"

          keystore/release=""
          keystore/release_user=""
          keystore/release_password=""
          EOF

      - name: Validar projeto Godot
        shell: bash
        run: |
          set -euxo pipefail

          godot \
            --headless \
            --editor \
            --path . \
            --quit

      - name: Exportar APK ARM64
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf build
          mkdir -p build

          godot \
            --headless \
            --path . \
            --export-debug "Android" \
            build/MundoV1.apk

          test -f build/MundoV1.apk

          ls -lh build/MundoV1.apk

      - name: Verificar assinatura APK
        shell: bash
        run: |
          set -euxo pipefail

          "$ANDROID_HOME/build-tools/34.0.0/apksigner" \
            verify \
            --verbose \
            build/MundoV1.apk

      - name: Verificar arquitetura ARM64
        shell: bash
        run: |
          set -euxo pipefail

          unzip -l build/MundoV1.apk | grep "lib/arm64-v8a" || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MUNDO-V1.9-APK
          path: build/MundoV1.apk
          if-no-files-found: error
