name: MUNDO V1 - V2.3 AAA MOBILE ESTILIZADO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          mkdir -p "$ANDROID_HOME/cmdline-tools"

          cd /tmp

          rm -f commandlinetools.zip

          curl -L \
            -o commandlinetools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip

          rm -rf "$ANDROID_HOME/cmdline-tools/latest"

          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"

          unzip -q commandlinetools.zip \
            -d "$ANDROID_HOME/cmdline-tools/latest"

          if [ -d "$ANDROID_HOME/cmdline-tools/latest/cmdline-tools" ]; then
            mv "$ANDROID_HOME/cmdline-tools/latest/cmdline-tools/"* \
              "$ANDROID_HOME/cmdline-tools/latest/"
            rm -rf "$ANDROID_HOME/cmdline-tools/latest/cmdline-tools"
          fi

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Baixar Godot 4.3
        shell: bash
        run: |
          set -euxo pipefail

          cd /tmp

          rm -rf godot
          mkdir -p godot

          curl -L \
            -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip

          unzip -q godot.zip -d godot

          GODOT_BIN="$(find /tmp/godot -type f -name 'Godot_v4.3-stable_linux.x86_64' | head -n 1)"

          test -n "$GODOT_BIN"

          chmod +x "$GODOT_BIN"

          sudo cp "$GODOT_BIN" /usr/local/bin/godot

          godot --version

      - name: Instalar templates Android Godot 4.3
        shell: bash
        run: |
          set -euxo pipefail

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"

          rm -rf "$TEMPLATE_DIR"
          mkdir -p "$TEMPLATE_DIR"

          cd /tmp

          rm -f templates.tpz
          rm -rf godot_templates

          mkdir -p godot_templates

          curl -L \
            -o templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz

          unzip -q templates.tpz -d godot_templates

          echo "Conteúdo baixado:"
          find godot_templates -type f -maxdepth 5 -print

          DEBUG_TEMPLATE="$(find godot_templates -type f -name 'android_debug.apk' | head -n 1)"
          RELEASE_TEMPLATE="$(find godot_templates -type f -name 'android_release.apk' | head -n 1)"
          SOURCE_TEMPLATE="$(find godot_templates -type f -name 'android_source.zip' | head -n 1)"

          test -n "$DEBUG_TEMPLATE"
          test -n "$RELEASE_TEMPLATE"

          cp "$DEBUG_TEMPLATE" \
            "$TEMPLATE_DIR/android_debug.apk"

          cp "$RELEASE_TEMPLATE" \
            "$TEMPLATE_DIR/android_release.apk"

          if [ -n "$SOURCE_TEMPLATE" ]; then
            cp "$SOURCE_TEMPLATE" \
              "$TEMPLATE_DIR/android_source.zip"
          fi

          echo "Templates instalados:"
          ls -lh "$TEMPLATE_DIR"

          test -f "$TEMPLATE_DIR/android_debug.apk"
          test -f "$TEMPLATE_DIR/android_release.apk"

      - name: Verificar templates
        shell: bash
        run: |
          set -euxo pipefail

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"

          echo "Verificando:"
          ls -lh "$TEMPLATE_DIR"

          test -s "$TEMPLATE_DIR/android_debug.apk"
          test -s "$TEMPLATE_DIR/android_release.apk"

          echo "Templates Android OK"

      - name: Criar projeto MUNDO V1 V2.3
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf build
          mkdir -p build
          mkdir -p scripts

          cat > project.godot <<'EOF'
          ; MUNDO V1 - V2.3 AAA MOBILE ESTILIZADO

          config_version=5

          [application]

          config/name="MUNDO V1"
          config/description="MUNDO V1 - AAA Mobile Estilizado"
          run/main_scene="res://Main.tscn"
          config/features=PackedStringArray("4.3", "GL Compatibility")
          boot_splash/bg_color=Color(0.035, 0.055, 0.075, 1)
          boot_splash/show_image=false

          [display]

          window/size/viewport_width=1280
          window/size/viewport_height=720
          window/size/window_width_override=1280
          window/size/window_height_override=720
          window/stretch/mode="canvas_items"

          [rendering]

          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          textures/default_filters/use_nearest_mipmap_filter=false
          textures/vram_compression/import_etc2_astc=true
          environment/defaults/default_clear_color=Color(0.12, 0.20, 0.27, 1)

          [physics]

          3d/default_gravity=18.0

          [input]

          move_forward={
          "deadzone": 0.5,
          "events": [Object(InputEventKey,"physical_keycode":87)]
          }

          move_back={
          "deadzone": 0.5,
          "events": [Object(InputEventKey,"physical_keycode":83)]
          }

          move_left={
          "deadzone": 0.5,
          "events": [Object(InputEventKey,"physical_keycode":65)]
          }

          move_right={
          "deadzone": 0.5,
          "events": [Object(InputEventKey,"physical_keycode":68)]
          }

          jump={
          "deadzone": 0.5,
          "events": [Object(InputEventKey,"physical_keycode":32)]
          }

          sprint={
          "deadzone": 0.5,
          "events": [Object(InputEventKey,"physical_keycode":4194325)]
          }

          [application/android]

          package/unique_name="com.mundov1.game"
          package/name="MUNDO V1"
          version/code=23
          version/name="2.3"

          [display/window]

          size/viewport_width=1280
          size/viewport_height=720
          size/window_width_override=1280
          size/window_height_override=720
          stretch/mode="canvas_items"

          [audio]

          driver/enable_input=false
          EOF

          cat > Main.tscn <<'EOF'
          [gd_scene load_steps=2 format=3]

          [ext_resource path="res://scripts/main.gd" type="Script" id="1"]

          [node name="MundoV1" type="Node3D"]
          script = ExtResource("1")
          EOF

          cat > icon.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#5DB7E8"/>
                <stop offset="1" stop-color="#1D5C72"/>
              </linearGradient>
              <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#78C95C"/>
                <stop offset="1" stop-color="#28683A"/>
              </linearGradient>
            </defs>
            <rect width="256" height="256" rx="54" fill="url(#bg)"/>
            <circle cx="190" cy="64" r="31" fill="#FFE9A9"/>
            <path d="M0 185 C60 145 95 170 145 150 C190 132 218 145 256 120 L256 256 L0 256 Z" fill="#315F42"/>
            <path d="M0 205 C65 176 111 194 163 172 C205 155 229 164 256 149 L256 256 L0 256 Z" fill="#4D8750"/>
            <rect x="116" y="109" width="18" height="78" rx="8" fill="#714A2F"/>
            <circle cx="125" cy="91" r="43" fill="url(#leaf)"/>
            <circle cx="93" cy="107" r="29" fill="#4D9A47"/>
            <circle cx="157" cy="107" r="30" fill="#4C9444"/>
            <circle cx="125" cy="65" r="32" fill="#74C456"/>
          </svg>
          EOF

          # Recupera o script existente se ele já estiver no repositório.
          # Se não existir, o workflow falha claramente em vez de gerar
          # uma versão visual incompleta.
          test -f scripts/main.gd

      - name: Criar export_presets.cfg
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool \
              -genkeypair \
              -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          cat > export_presets.cfg <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/MundoV1.apk"

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""

          gradle_build/use_gradle_build=false

          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false

          package/unique_name="com.mundov1.game"
          package/name="MUNDO V1"
          package/signed=true
          package/version/code=23
          package/version/name="2.3"

          version/code=23
          version/name="2.3"

          package/launcher_icons/main="res://icon.svg"

          screen/immersive_mode=true
          screen/orientation=1

          rendering/method="gl_compatibility"
          rendering/driver="opengl3"

          input_devices/pointing/emulate_touch_from_mouse=true
          input_devices/pointing/emulate_mouse_from_touch=true

          options/keystore/debug="/home/runner/.android/debug.keystore"
          options/keystore/debug_user="androiddebugkey"
          options/keystore/debug_password="android"
          EOF

      - name: Validar projeto Godot
        shell: bash
        run: |
          set -euxo pipefail

          godot \
            --headless \
            --editor \
            --path . \
            --quit

      - name: Exportar APK V2.3
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p build

          godot \
            --headless \
            --path . \
            --export-debug \
            "Android" \
            build/MundoV1.apk

          test -f build/MundoV1.apk

          ls -lh build/MundoV1.apk

      - name: Verificar assinatura APK
        shell: bash
        run: |
          set -euxo pipefail

          "$ANDROID_HOME/build-tools/34.0.0/apksigner" \
            verify \
            --verbose \
            build/MundoV1.apk

      - name: Informações finais
        shell: bash
        run: |
          set -euxo pipefail

          echo "========================================"
          echo " MUNDO V1 - V2.3 AAA MOBILE ESTILIZADO"
          echo "========================================"
          echo "APK: build/MundoV1.apk"
          echo "Package: com.mundov1.game"
          echo "Version: 2.3"
          echo "Architecture: ARM64"
          echo "Renderer: GL Compatibility"
          echo "========================================"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MUNDO-V1-V2.3-AAA-MOBILE-APK
          path: build/MundoV1.apk
          if-no-files-found: error
