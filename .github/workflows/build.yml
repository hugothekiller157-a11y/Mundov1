          func update_interface() -> void:
              if health_label:
                  health_label.text = (
                      "VIDA: %d / 100"
                      % int(health)
                  )

              if stamina_label:
                  stamina_label.text = (
                      "ENERGIA: %d / 100"
                      % int(stamina)
                  )

              if inventory_label:
                  inventory_label.text = (
                      "MADEIRA: %d    PEDRA: %d"
                      % [wood, stone]
                  )


          func _physics_process(delta: float) -> void:
              if not player:
                  return

              var keyboard_input := Vector2(
                  Input.get_axis(
                      "move_left",
                      "move_right"
                  ),
                  Input.get_axis(
                      "move_forward",
                      "move_backward"
                  )
              )

              if keyboard_input.length() > 0.1:
                  move_input = keyboard_input.normalized()

              var direction := Vector3(
                  move_input.x,
                  0.0,
                  move_input.y
              )

              var moving := direction.length() > 0.1

              if sprint_active and moving and stamina > 0.0:
                  stamina = max(
                      0.0,
                      stamina - delta * 16.0
                  )
              else:
                  stamina = min(
                      100.0,
                      stamina + delta * 10.0
                  )

              var speed: float = 4.8

              if sprint_active and stamina > 1.0:
                  speed = 7.2

              player.velocity.x = direction.x * speed
              player.velocity.z = direction.z * speed

              if not player.is_on_floor():
                  player.velocity.y -= 18.0 * delta
              else:
                  player.velocity.y = -0.5

              player.move_and_slide()

              if moving:
                  var target_rotation: float = atan2(
                      direction.x,
                      direction.z
                  )

                  player.rotation.y = lerp_angle(
                      player.rotation.y,
                      target_rotation,
                      delta * 9.0
                  )

                  walk_time += delta * (
                      9.0 if not sprint_active else 13.0
                  )

                  if player_visual:
                      player_visual.position.y = (
                          sin(walk_time) * 0.025
                      )
              else:
                  if player_visual:
                      player_visual.position.y = lerp(
                          player_visual.position.y,
                          0.0,
                          delta * 8.0
                      )

              update_camera(delta)
              update_water(delta)
              update_interface()


          func update_camera(delta: float) -> void:
              if not camera or not player:
                  return

              var target_position := (
                  player.global_position
                  + Vector3(
                      0,
                      camera_height,
                      camera_distance
                  )
              )

              camera.global_position = camera.global_position.lerp(
                  target_position,
                  delta * 6.0
              )

              var look_target := (
                  player.global_position
                  + Vector3(0, 1.25, 0)
              )

              camera.look_at(
                  look_target,
                  Vector3.UP
              )


          func update_water(delta: float) -> void:
              water_time += delta

              var water_nodes := get_tree().get_nodes_in_group(
                  "water"
              )

              for node in water_nodes:
                  if is_instance_valid(node):
                      node.position.y = (
                          0.065
                          + sin(water_time * 1.5) * 0.018
                      )


          func jump() -> void:
              if player and player.is_on_floor():
                  player.velocity.y = 7.0


          func collect_nearby() -> void:
              if not player:
                  return

              var nearest: Node3D = null
              var nearest_distance: float = 3.2

              for object in resources:
                  if not is_instance_valid(object):
                      continue

                  var distance := player.global_position.distance_to(
                      object.global_position
                  )

                  if distance < nearest_distance:
                      nearest_distance = distance
                      nearest = object

              if nearest:
                  var resource_type: String = nearest.name

                  collect_resource(
                      nearest,
                      resource_type
                  )
              else:
                  status_label.text = (
                      "NENHUM RECURSO PRÓXIMO"
                  )


          func build_object() -> void:
              if wood <= 0 and stone <= 0:
                  status_label.text = (
                      "COLETE MADEIRA OU PEDRA"
                  )
                  return

              var build := Node3D.new()

              var foundation := MeshInstance3D.new()
              var foundation_mesh := BoxMesh.new()

              foundation_mesh.size = Vector3(
                  1.8,
                  0.35,
                  1.8
              )

              foundation.mesh = foundation_mesh
              foundation.position.y = 0.18

              if wood > 0:
                  foundation.material_override = make_material(
                      Color("#8a5b32"),
                      0.82
                  )
              else:
                  foundation.material_override = make_material(
                      Color("#777b80"),
                      1.0
                  )

              build.add_child(foundation)

              var post_positions := [
                  Vector3(-0.72, 0.9, -0.72),
                  Vector3(0.72, 0.9, -0.72),
                  Vector3(-0.72, 0.9, 0.72),
                  Vector3(0.72, 0.9, 0.72)
              ]

              for position in post_positions:
                  var post := MeshInstance3D.new()
                  var post_mesh := BoxMesh.new()

                  post_mesh.size = Vector3(
                      0.22,
                      1.55,
                      0.22
                  )

                  post.mesh = post_mesh
                  post.position = position

                  if wood > 0:
                      post.material_override = make_material(
                          Color("#754829"),
                          0.86
                      )
                  else:
                      post.material_override = make_material(
                          Color("#676b6d"),
                          1.0
                      )

                  build.add_child(post)

              var roof := MeshInstance3D.new()
              var roof_mesh := BoxMesh.new()

              roof_mesh.size = Vector3(
                  2.05,
                  0.22,
                  2.05
              )

              roof.mesh = roof_mesh
              roof.position.y = 1.72

              if wood > 0:
                  roof.material_override = make_material(
                      Color("#9b6538"),
                      0.86
                  )
              else:
                  roof.material_override = make_material(
                      Color("#85898b"),
                      1.0
                  )

              build.add_child(roof)

              build.position = (
                  player.global_position
                  + Vector3(0, 0, -3.0)
              )

              build.rotation.y = player.rotation.y

              add_child(build)
              built_objects.append(build)

              if wood > 0:
                  wood -= 1
                  status_label.text = (
                      "ABRIGO DE MADEIRA CONSTRUÍDO"
                  )
              else:
                  stone -= 1
                  status_label.text = (
                      "ABRIGO DE PEDRA CONSTRUÍDO"
                  )

              update_interface()


          func _unhandled_input(event: InputEvent) -> void:
              if event is InputEventScreenTouch:
                  if event.pressed:
                      if (
                          event.position.x < 300.0
                          and event.position.y > 450.0
                      ):
                          joystick_active = true
                          joystick_id = event.index
                          update_joystick(
                              event.position
                          )
                  elif event.index == joystick_id:
                      joystick_active = false
                      joystick_id = -1
                      move_input = Vector2.ZERO
                      reset_joystick()

              elif event is InputEventScreenDrag:
                  if (
                      joystick_active
                      and event.index == joystick_id
                  ):
                      update_joystick(
                          event.position
                      )


          func update_joystick(position: Vector2) -> void:
              var offset: Vector2 = (
                  position - joystick_center
              )

              if offset.length() > 70.0:
                  offset = (
                      offset.normalized() * 70.0
                  )

              move_input = Vector2(
                  offset.x / 70.0,
                  -offset.y / 70.0
              )

              var knob := get_node_or_null(
                  "HUD/JoystickKnob"
              )

              if knob:
                  knob.position = (
                      joystick_center
                      + offset
                      - Vector2(21, 21)
                  )


          func reset_joystick() -> void:
              var knob := get_node_or_null(
                  "HUD/JoystickKnob"
              )

              if knob:
                  knob.position = Vector2(
                      joystick_center.x - 21,
                      joystick_center.y - 21
                  )
          EOF

      - name: Criar export_presets.cfg
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p /home/runner/.android

          keytool \
            -genkeypair \
            -v \
            -keystore /home/runner/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            2>/dev/null || true

          cat > export_presets.cfg <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/MundoV1.apk"
          patch_list=PackedStringArray()

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""

          gradle_build/use_gradle_build=false

          package/unique_name="com.mundov1.game"
          package/name="MUNDO V1"
          package/version/code=21
          package/version/name="2.1"

          package/short_name="MUNDO V1"

          launcher_icons/main_192x192=""
          launcher_icons/adaptive_foreground_432x432=""
          launcher_icons/adaptive_background_432x432=""

          screen/immersive_mode=true
          screen/orientation=1

          architecture/arm64-v8a=true
          architecture/armeabi-v7a=false
          architecture/x86=false
          architecture/x86_64=false

          keystore/debug="/home/runner/.android/debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"

          keystore/release=""
          keystore/release_user=""
          keystore/release_password=""

          version/code=21
          version/name="2.1"

          permissions/internet=false
          EOF

      - name: Validar projeto
        shell: bash
        run: |
          set -euxo pipefail

          godot \
            --headless \
            --editor \
            --path . \
            --quit

      - name: Exportar APK V2.1
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf build
          mkdir -p build

          godot \
            --headless \
            --path . \
            --export-debug \
            "Android" \
            build/MundoV1.apk

          test -f build/MundoV1.apk

          ls -lh build/MundoV1.apk

      - name: Verificar assinatura APK
        shell: bash
        run: |
          set -euxo pipefail

          "$ANDROID_HOME/build-tools/34.0.0/apksigner" \
            verify \
            --verbose \
            build/MundoV1.apk

      - name: Preparar APK final
        shell: bash
        run: |
          set -euxo pipefail

          cp build/MundoV1.apk \
             build/MUNDO-V1-V2.1.apk

          ls -lh build/MUNDO-V1-V2.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MUNDO-V1-V2.1-APK
          path: build/MUNDO-V1-V2.1.apk
          if-no-files-found: error
