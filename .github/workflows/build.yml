name: MUNDO V1 - V2.2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          mkdir -p "$ANDROID_HOME/cmdline-tools"

          cd /tmp

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O cmdline-tools.zip

          unzip -q cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"

          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" \
             "$ANDROID_HOME/cmdline-tools/latest"

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Instalar Godot 4.3
        shell: bash
        run: |
          set -euxo pipefail

          cd /tmp

          wget -q \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip \
            -O godot.zip

          unzip -q godot.zip

          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot

          sudo chmod +x /usr/local/bin/godot

          godot --version

      - name: Instalar templates Android do Godot
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"

          cd /tmp

          wget -q \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz \
            -O templates.tpz

          unzip -q templates.tpz -d templates

          cp -r templates/templates/* \
            "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Criar projeto MUNDO V1 V2.2
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf project.godot Main.tscn scripts textures build export_presets.cfg
          mkdir -p scripts textures build

          cat > project.godot <<'EOF'
          ; Engine configuration file.
          ; MUNDO V1 - V2.2

          config_version=5

          [application]

          config/name="MUNDO V1"
          config/description="Mundo de exploração, construção e sobrevivência."
          run/main_scene="res://Main.tscn"
          config/features=PackedStringArray("4.3", "GL Compatibility")
          config/icon="res://icon.svg"

          [display]

          window/size/viewport_width=1280
          window/size/viewport_height=720
          window/size/window_width_override=1280
          window/size/window_height_override=720
          window/stretch/mode="canvas_items"

          [rendering]

          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          textures/default_filters/use_nearest_mipmap_filter=false
          textures/vram_compression/import_etc2_astc=true

          [input]

          move_forward={
          "deadzone": 0.5,
          "events": [Object(InputEventKey,"physical_keycode":87)]
          }

          move_back={
          "deadzone": 0.5,
          "events": [Object(InputEventKey,"physical_keycode":83)]
          }

          move_left={
          "deadzone": 0.5,
          "events": [Object(InputEventKey,"physical_keycode":65)]
          }

          move_right={
          "deadzone": 0.5,
          "events": [Object(InputEventKey,"physical_keycode":68)]
          }

          jump={
          "deadzone": 0.5,
          "events": [Object(InputEventKey,"physical_keycode":32)]
          }
          EOF

          cat > icon.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
            <defs>
              <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#7ed6ff"/>
                <stop offset="1" stop-color="#2f7f52"/>
              </linearGradient>
            </defs>
            <rect width="256" height="256" rx="56" fill="url(#g)"/>
            <circle cx="128" cy="112" r="62" fill="#f3d19b"/>
            <path d="M72 108 Q128 48 184 108 L174 80 Q128 42 82 80Z" fill="#4b3828"/>
            <circle cx="105" cy="113" r="7" fill="#222"/>
            <circle cx="151" cy="113" r="7" fill="#222"/>
            <path d="M106 143 Q128 157 150 143" fill="none" stroke="#5b3527" stroke-width="7" stroke-linecap="round"/>
            <path d="M62 208 Q128 166 194 208" fill="#d89b5b"/>
          </svg>
          EOF

          cat > Main.tscn <<'EOF'
          [gd_scene load_steps=2 format=3]

          [ext_resource path="res://scripts/main.gd" type="Script" id="1"]

          [node name="Main" type="Node3D"]
          script = ExtResource("1")
          EOF

      - name: Criar código V2.2
        shell: bash
        run: |
          set -euxo pipefail

          cat > scripts/main.gd <<'EOF'
          extends Node3D

          var move_input: Vector2 = Vector2.ZERO
          var water_time: float = 0.0

          var player: CharacterBody3D
          var camera: Camera3D

          var joystick_center: Vector2 = Vector2.ZERO
          var joystick_active: bool = false

          var stamina: float = 100.0
          var life: int = 100
          var wood: int = 0
          var stone: int = 0

          var speed: float = 4.2
          var sprint_speed: float = 6.4
          var gravity: float = 18.0
          var jump_force: float = 7.0

          var camera_distance: float = 8.6
          var camera_height: float = 4.7

          var environment: Environment
          var water_mesh: MeshInstance3D

          var inventory_label: Label
          var stamina_label: Label
          var life_label: Label
          var status_label: Label

          func _ready() -> void:
              create_environment()
              create_world()
              create_player()
              create_ui()

          func make_material(
                  color: Color,
                  roughness: float = 0.75,
                  metallic: float = 0.0
          ) -> StandardMaterial3D:
              var material := StandardMaterial3D.new()
              material.albedo_color = color
              material.roughness = roughness
              material.metallic = metallic
              return material

          func create_environment() -> void:
              var world_environment := WorldEnvironment.new()
              environment = Environment.new()

              environment.background_mode = Environment.BG_COLOR
              environment.background_color = Color("#86c9ed")

              environment.ambient_light_source = Environment.AMBIENT_SOURCE_COLOR
              environment.ambient_light_color = Color("#e9f5ff")
              environment.ambient_light_energy = 0.92

              environment.tonemap_mode = Environment.TONE_MAPPER_FILMIC
              environment.tonemap_exposure = 1.08

              environment.fog_enabled = true
              environment.fog_light_color = Color("#b9dcef")
              environment.fog_light_energy = 0.38
              environment.fog_density = 0.006
              environment.fog_height = 8.0
              environment.fog_height_density = 0.012

              world_environment.environment = environment
              add_child(world_environment)

              var sun := DirectionalLight3D.new()
              sun.rotation_degrees = Vector3(-50, -32, 0)
              sun.light_color = Color("#fff1d5")
              sun.light_energy = 1.28
              sun.shadow_enabled = true
              sun.directional_shadow_max_distance = 90.0
              sun.directional_shadow_split_1 = 0.08
              sun.directional_shadow_split_2 = 0.25
              sun.directional_shadow_split_3 = 0.55
              sun.shadow_bias = 0.04
              add_child(sun)

              var fill := DirectionalLight3D.new()
              fill.rotation_degrees = Vector3(-25, 145, 0)
              fill.light_color = Color("#b9dcff")
              fill.light_energy = 0.24
              fill.shadow_enabled = false
              add_child(fill)

          func create_world() -> void:
              create_ground()
              create_water()
              create_hills()

              for i in range(13):
                  create_tree(
                      Vector3(
                          -34.0 + float((i * 19) % 68),
                          0.0,
                          -29.0 + float((i * 31) % 57)
                      ),
                      0.82 + float(i % 4) * 0.12
                  )

              for i in range(6):
                  create_pine(
                      Vector3(
                          -38.0 + float((i * 27) % 72),
                          0.0,
                          -20.0 + float((i * 17) % 48)
                      ),
                      0.85 + float(i % 3) * 0.12
                  )

              for i in range(48):
                  create_bush(
                      Vector3(
                          -42.0 + float((i * 17) % 84),
                          0.0,
                          -40.0 + float((i * 23) % 80)
                      ),
                      0.55 + float(i % 4) * 0.13
                  )

              for i in range(72):
                  create_grass(
                      Vector3(
                          -45.0 + float((i * 13) % 90),
                          0.0,
                          -45.0 + float((i * 29) % 90)
                      )
                  )

              for i in range(28):
                  create_flower(
                      Vector3(
                          -42.0 + float((i * 21) % 84),
                          0.0,
                          -40.0 + float((i * 19) % 80)
                      )
                  )

              for i in range(11):
                  create_rock(
                      Vector3(
                          -40.0 + float((i * 25) % 80),
                          0.0,
                          -34.0 + float((i * 33) % 68)
                      )
                  )

              create_resource(Vector3(-8, 0, 5), "MADEIRA")
              create_resource(Vector3(12, 0, -2), "PEDRA")
              create_resource(Vector3(-17, 0, -11), "MADEIRA")
              create_resource(Vector3(21, 0, 11), "PEDRA")
              create_resource(Vector3(-27, 0, 16), "MADEIRA")
              create_resource(Vector3(29, 0, -15), "PEDRA")

          func create_ground() -> void:
              var ground := MeshInstance3D.new()
              var mesh := PlaneMesh.new()
              mesh.size = Vector2(110, 110)
              mesh.subdivide_width = 28
              mesh.subdivide_depth = 28

              ground.mesh = mesh
              ground.position.y = -0.05
              ground.material_override = make_material(Color("#609b4d"), 0.94)
              add_child(ground)

              var body := StaticBody3D.new()
              body.position.y = -0.55

              var collision := CollisionShape3D.new()
              var shape := BoxShape3D.new()
              shape.size = Vector3(110, 1, 110)

              collision.shape = shape
              body.add_child(collision)
              add_child(body)

          func create_water() -> void:
              water_mesh = MeshInstance3D.new()

              var mesh := PlaneMesh.new()
              mesh.size = Vector2(45, 27)
              mesh.subdivide_width = 16
              mesh.subdivide_depth = 12

              water_mesh.mesh = mesh
              water_mesh.position = Vector3(10, 0.07, -8)

              var material := make_material(
                  Color(0.045, 0.42, 0.64, 0.78),
                  0.08,
                  0.05
              )

              material.transparency = BaseMaterial3D.TRANSPARENCY_ALPHA
              material.shading_mode = BaseMaterial3D.SHADING_MODE_PER_PIXEL
              material.cull_mode = BaseMaterial3D.CULL_DISABLED

              water_mesh.material_override = material
              water_mesh.add_to_group("water")

              add_child(water_mesh)

              for i in range(7):
                  var shine := MeshInstance3D.new()
                  var shine_mesh := PlaneMesh.new()

                  shine_mesh.size = Vector2(
                      3.0 + float(i % 3),
                      0.08
                  )

                  shine.mesh = shine_mesh
                  shine.position = Vector3(
                      -3.0 + float(i * 4),
                      0.105,
                      -13.0 + float(i % 4) * 4.0
                  )

                  var shine_mat := make_material(
                      Color(0.72, 0.93, 1.0, 0.28),
                      0.05
                  )

                  shine_mat.transparency = BaseMaterial3D.TRANSPARENCY_ALPHA
                  shine.material_override = shine_mat

                  add_child(shine)

          func create_hills() -> void:
              var positions := [
                  Vector3(-31, 2.0, -23),
                  Vector3(35, 2.4, -26),
                  Vector3(-34, 1.7, 28),
                  Vector3(33, 2.1, 25),
                  Vector3(3, 1.5, -35)
              ]

              for pos in positions:
                  var hill := MeshInstance3D.new()
                  var mesh := SphereMesh.new()

                  mesh.radius = 8.0
                  mesh.height = 7.0

                  hill.mesh = mesh
                  hill.position = pos
                  hill.scale = Vector3(1.8, 0.55, 1.45)
                  hill.material_override = make_material(
                      Color("#568b46"),
                      1.0
                  )

                  add_child(hill)

          func create_tree(pos: Vector3, scale_factor: float) -> void:
              var root := Node3D.new()
              root.position = pos
              root.scale = Vector3.ONE * scale_factor

              var trunk := MeshInstance3D.new()
              var trunk_mesh := CylinderMesh.new()

              trunk_mesh.top_radius = 0.23
              trunk_mesh.bottom_radius = 0.34
              trunk_mesh.height = 2.7

              trunk.mesh = trunk_mesh
              trunk.position.y = 1.35
              trunk.material_override = make_material(
                  Color("#70472b"),
                  0.95
              )

              root.add_child(trunk)

              var crown_colors := [
                  Color("#397a43"),
                  Color("#478c4b"),
                  Color("#579d55")
              ]

              for i in range(5):
                  var crown := MeshInstance3D.new()
                  var crown_mesh := SphereMesh.new()

                  crown_mesh.radius = 1.55
                  crown_mesh.height = 2.25

                  crown.mesh = crown_mesh
                  crown.position = Vector3(
                      -0.7 + float(i % 3) * 0.7,
                      2.9 + float(i % 2) * 0.55,
                      -0.25 + float(i / 3) * 0.55
                  )

                  crown.scale = Vector3(
                      1.0,
                      0.78,
                      0.92
                  )

                  crown.material_override = make_material(
                      crown_colors[i % crown_colors.size()],
                      0.98
                  )

                  root.add_child(crown)

              add_child(root)

          func create_pine(pos: Vector3, scale_factor: float) -> void:
              var root := Node3D.new()
              root.position = pos
              root.scale = Vector3.ONE * scale_factor

              var trunk := MeshInstance3D.new()
              var trunk_mesh := CylinderMesh.new()

              trunk_mesh.top_radius = 0.16
              trunk_mesh.bottom_radius = 0.25
              trunk_mesh.height = 2.8

              trunk.mesh = trunk_mesh
              trunk.position.y = 1.4
              trunk.material_override = make_material(
                  Color("#62412a"),
                  0.95
              )

              root.add_child(trunk)

              for i in range(4):
                  var cone := MeshInstance3D.new()
                  var cone_mesh := CylinderMesh.new()

                  cone_mesh.top_radius = 0.05
                  cone_mesh.bottom_radius = 1.55 - float(i) * 0.25
                  cone_mesh.height = 2.3

                  cone.mesh = cone_mesh
                  cone.position.y = 2.15 + float(i) * 0.9
                  cone.material_override = make_material(
                      Color("#356f43"),
                      0.98
                  )

                  root.add_child(cone)

              add_child(root)

          func create_bush(pos: Vector3, scale_factor: float) -> void:
              var bush := MeshInstance3D.new()
              var mesh := SphereMesh.new()

              mesh.radius = 0.72
              mesh.height = 1.15

              bush.mesh = mesh
              bush.position = pos + Vector3(0, 0.5, 0)
              bush.scale = Vector3(
                  1.2,
                  0.7,
                  1.05
              ) * scale_factor

              bush.material_override = make_material(
                  Color("#4f914c"),
                  1.0
              )

              add_child(bush)

          func create_grass(pos: Vector3) -> void:
              var grass := MeshInstance3D.new()
              var mesh := PlaneMesh.new()

              mesh.size = Vector2(0.16, 0.8)

              grass.mesh = mesh
              grass.position = pos + Vector3(0, 0.4, 0)
              grass.rotation_degrees.y = float(
                  pos.x * 13.0 + pos.z * 7.0
              )

              grass.material_override = make_material(
                  Color("#6aa74e"),
                  1.0
              )

              add_child(grass)

          func create_flower(pos: Vector3) -> void:
              var root := Node3D.new()
              root.position = pos

              var stem := MeshInstance3D.new()
              var stem_mesh := CylinderMesh.new()

              stem_mesh.top_radius = 0.025
              stem_mesh.bottom_radius = 0.035
              stem_mesh.height = 0.55

              stem.mesh = stem_mesh
              stem.position.y = 0.275
              stem.material_override = make_material(
                  Color("#3d783d"),
                  0.95
              )

              root.add_child(stem)

              var flower := MeshInstance3D.new()
              var flower_mesh := SphereMesh.new()

              flower_mesh.radius = 0.13
              flower_mesh.height = 0.18

              flower.mesh = flower_mesh
              flower.position.y = 0.6
              flower.material_override = make_material(
                  Color("#f4c85b"),
                  0.7
              )

              root.add_child(flower)
              add_child(root)

          func create_rock(pos: Vector3) -> void:
              var rock := MeshInstance3D.new()
              var mesh := SphereMesh.new()

              mesh.radius = 0.55
              mesh.height = 0.8

              rock.mesh = mesh
              rock.position = pos + Vector3(0, 0.3, 0)
              rock.scale = Vector3(1.3, 0.65, 1.0)

              rock.material_override = make_material(
                  Color("#7b8581"),
                  0.92
              )

              add_child(rock)

          func create_resource(pos: Vector3, resource_type: String) -> void:
              var root := Area3D.new()
              root.position = pos + Vector3(0, 1.0, 0)

              var mesh_instance := MeshInstance3D.new()

              if resource_type == "MADEIRA":
                  var mesh := CylinderMesh.new()
                  mesh.top_radius = 0.34
                  mesh.bottom_radius = 0.42
                  mesh.height = 1.8

                  mesh_instance.mesh = mesh
                  mesh_instance.material_override = make_material(
                      Color("#87522f"),
                      0.9
                  )
              else:
                  var mesh := SphereMesh.new()
                  mesh.radius = 0.65
                  mesh.height = 1.05

                  mesh_instance.mesh = mesh
                  mesh_instance.material_override = make_material(
                      Color("#727b7c"),
                      0.92
                  )

              root.add_child(mesh_instance)

              var collision := CollisionShape3D.new()
              var shape := SphereShape3D.new()
              shape.radius = 1.0

              collision.shape = shape
              root.add_child(collision)

              root.set_meta("resource_type", resource_type)
              root.body_entered.connect(
                  func(body: Node3D) -> void:
                      if body == player:
                          collect_resource(root)
              )

              add_child(root)

          func collect_resource(node: Node3D) -> void:
              var resource_type: String = str(
                  node.get_meta("resource_type")
              )

              if resource_type == "MADEIRA":
                  wood += 1
              else:
                  stone += 1

              status_label.text = "RECURSO COLETADO"
              update_inventory()
              node.queue_free()

          func create_player() -> void:
              player = CharacterBody3D.new()
              player.position = Vector3(0, 1.3, 8)

              var collision := CollisionShape3D.new()
              var capsule := CapsuleShape3D.new()

              capsule.radius = 0.45
              capsule.height = 1.8

              collision.shape = capsule
              player.add_child(collision)

              var body := MeshInstance3D.new()
              var body_mesh := CapsuleMesh.new()

              body_mesh.radius = 0.46
              body_mesh.height = 1.45

              body.mesh = body_mesh
              body.position.y = 0.82
              body.material_override = make_material(
                  Color("#d48b50"),
                  0.78
              )

              player.add_child(body)

              var shirt := MeshInstance3D.new()
              var shirt_mesh := SphereMesh.new()

              shirt_mesh.radius = 0.54
              shirt_mesh.height = 0.9

              shirt.mesh = shirt_mesh
              shirt.position.y = 0.85
              shirt.scale = Vector3(1.0, 0.8, 0.82)
              shirt.material_override = make_material(
                  Color("#3d7099"),
                  0.8
              )

              player.add_child(shirt)

              var head := MeshInstance3D.new()
              var head_mesh := SphereMesh.new()

              head_mesh.radius = 0.48
              head_mesh.height = 0.95

              head.mesh = head_mesh
              head.position.y = 1.85
              head.material_override = make_material(
                  Color("#efbd83"),
                  0.82
              )

              player.add_child(head)

              var hair := MeshInstance3D.new()
              var hair_mesh := SphereMesh.new()

              hair_mesh.radius = 0.5
              hair_mesh.height = 0.42

              hair.mesh = hair_mesh
              hair.position = Vector3(0, 2.18, -0.02)
              hair.scale = Vector3(1.02, 0.55, 1.02)
              hair.material_override = make_material(
                  Color("#38291f"),
                  0.95
              )

              player.add_child(hair)

              add_child(player)

              camera = Camera3D.new()
              camera.fov = 66.0
              camera.position = Vector3(0, camera_height, camera_distance)

              add_child(camera)

          func create_ui() -> void:
              var layer := CanvasLayer.new()
              add_child(layer)

              var title := Label.new()
              title.text = "MUNDO V1"
              title.position = Vector2(35, 25)
              title.add_theme_font_size_override("font_size", 34)
              title.add_theme_color_override(
                  "font_color",
                  Color("#ffffff")
              )
              layer.add_child(title)

              var version := Label.new()
              version.text = "V2.2 • EXPLORAÇÃO"
              version.position = Vector2(38, 67)
              version.add_theme_font_size_override("font_size", 16)
              version.add_theme_color_override(
                  "font_color",
                  Color("#e5f5ff")
              )
              layer.add_child(version)

              status_label = Label.new()
              status_label.text = "EXPLORE • COLETE • CONSTRUA"
              status_label.position = Vector2(38, 95)
              status_label.add_theme_font_size_override(
                  "font_size",
                  15
              )
              layer.add_child(status_label)

              life_label = Label.new()
              life_label.text = "❤ 100"
              life_label.position = Vector2(38, 130)
              life_label.add_theme_font_size_override(
                  "font_size",
                  20
              )
              layer.add_child(life_label)

              stamina_label = Label.new()
              stamina_label.text = "⚡ 100"
              stamina_label.position = Vector2(38, 160)
              stamina_label.add_theme_font_size_override(
                  "font_size",
                  18
              )
              layer.add_child(stamina_label)

              inventory_label = Label.new()
              inventory_label.text = "🌲 0    🪨 0"
              inventory_label.position = Vector2(38, 190)
              inventory_label.add_theme_font_size_override(
                  "font_size",
                  18
              )
              layer.add_child(inventory_label)

              var joystick := Label.new()
              joystick.text = "◉"
              joystick.position = Vector2(85, 570)
              joystick.add_theme_font_size_override(
                  "font_size",
                  70
              )
              joystick.modulate = Color(1, 1, 1, 0.42)
              layer.add_child(joystick)

              var build_button := Button.new()
              build_button.text = "CONSTRUIR"
              build_button.position = Vector2(1030, 545)
              build_button.size = Vector2(170, 55)
              build_button.pressed.connect(build_shelter)
              layer.add_child(build_button)

              var collect_button := Button.new()
              collect_button.text = "COLETAR"
              collect_button.position = Vector2(1030, 610)
              collect_button.size = Vector2(170, 55)
              collect_button.pressed.connect(collect_nearby)
              layer.add_child(collect_button)

              var jump_button := Button.new()
              jump_button.text = "PULAR"
              jump_button.position = Vector2(840, 610)
              jump_button.size = Vector2(145, 55)
              jump_button.pressed.connect(jump)
              layer.add_child(jump_button)

              var sprint_button := Button.new()
              sprint_button.text = "CORRER"
              sprint_button.position = Vector2(680, 610)
              sprint_button.size = Vector2(145, 55)
              sprint_button.pressed.connect(toggle_sprint)
              layer.add_child(sprint_button)

          func update_inventory() -> void:
              if inventory_label:
                  inventory_label.text = (
                      "🌲 %d    🪨 %d"
                      % [wood, stone]
                  )

          func _physics_process(delta: float) -> void:
              if not player:
                  return

              var keyboard_input := Vector2(
                  Input.get_axis("move_left", "move_right"),
                  Input.get_axis("move_forward", "move_back")
              )

              if keyboard_input.length() > 0.1:
                  move_input = keyboard_input.normalized()

              var direction := Vector3(
                  move_input.x,
                  0,
                  move_input.y
              )

              if direction.length() > 1.0:
                  direction = direction.normalized()

              var current_speed := speed

              if Input.is_key_pressed(KEY_SHIFT) and stamina > 1.0:
                  current_speed = sprint_speed
                  stamina -= 25.0 * delta
              else:
                  stamina += 18.0 * delta

              stamina = clamp(stamina, 0.0, 100.0)

              player.velocity.x = direction.x * current_speed
              player.velocity.z = direction.z * current_speed

              if not player.is_on_floor():
                  player.velocity.y -= gravity * delta
              else:
                  if Input.is_action_just_pressed("jump"):
                      player.velocity.y = jump_force

              player.move_and_slide()

              if direction.length() > 0.1:
                  var target_rotation := atan2(
                      direction.x,
                      direction.z
                  )

                  player.rotation.y = lerp_angle(
                      player.rotation.y,
                      target_rotation,
                      delta * 8.0
                  )

              update_camera(delta)
              animate_water(delta)

              stamina_label.text = "⚡ %d" % int(stamina)

          func update_camera(delta: float) -> void:
              if not camera or not player:
                  return

              var desired_position: Vector3 = (
                  player.global_position
                  + Vector3(
                      0,
                      camera_height,
                      camera_distance
                  )
              )

              camera.global_position = camera.global_position.lerp(
                  desired_position,
                  delta * 5.0
              )

              var look_target: Vector3 = (
                  player.global_position
                  + Vector3(0, 1.1, 0)
              )

              camera.look_at(look_target, Vector3.UP)

          func animate_water(delta: float) -> void:
              water_time += delta

              if water_mesh:
                  water_mesh.position.y = (
                      0.07
                      + sin(water_time * 1.5) * 0.025
                  )

          func jump() -> void:
              if player and player.is_on_floor():
                  player.velocity.y = jump_force

          func toggle_sprint() -> void:
              if stamina > 5.0:
                  status_label.text = "CORRENDO"

          func collect_nearby() -> void:
              if not player:
                  return

              var closest: Node3D = null
              var closest_distance := 3.2

              for child in get_children():
                  if child is Area3D and child.has_meta("resource_type"):
                      var distance := player.global_position.distance_to(
                          child.global_position
                      )

                      if distance < closest_distance:
                          closest = child
                          closest_distance = distance

              if closest:
                  collect_resource(closest)
              else:
                  status_label.text = "NENHUM RECURSO PRÓXIMO"

          func build_shelter() -> void:
              if not player:
                  return

              if wood < 2 or stone < 1:
                  status_label.text = "PRECISA DE 2 MADEIRAS + 1 PEDRA"
                  return

              wood -= 2
              stone -= 1
              update_inventory()

              var shelter := Node3D.new()
              shelter.position = (
                  player.global_position
                  + Vector3(0, 0, -4)
              )

              var foundation := MeshInstance3D.new()
              var foundation_mesh := BoxMesh.new()

              foundation_mesh.size = Vector3(4.5, 0.3, 4.5)
              foundation.mesh = foundation_mesh
              foundation.position.y = 0.15
              foundation.material_override = make_material(
                  Color("#77726a"),
                  0.9
              )

              shelter.add_child(foundation)

              for x in [-1.8, 1.8]:
                  for z in [-1.8, 1.8]:
                      var post := MeshInstance3D.new()
                      var post_mesh := BoxMesh.new()

                      post_mesh.size = Vector3(0.28, 2.8, 0.28)
                      post.mesh = post_mesh
                      post.position = Vector3(x, 1.55, z)
                      post.material_override = make_material(
                          Color("#80502e"),
                          0.92
                      )

                      shelter.add_child(post)

              var roof := MeshInstance3D.new()
              var roof_mesh := BoxMesh.new()

              roof_mesh.size = Vector3(5.0, 0.3, 5.0)
              roof.mesh = roof_mesh
              roof.position.y = 3.15
              roof.rotation_degrees.x = -4.0
              roof.material_override = make_material(
                  Color("#6b4731"),
                  0.88
              )

              shelter.add_child(roof)

              add_child(shelter)

              status_label.text = "ABRIGO CONSTRUÍDO!"

          func _input(event: InputEvent) -> void:
              if event is InputEventScreenTouch:
                  if event.pressed:
                      joystick_center = event.position
                      joystick_active = true
                  else:
                      joystick_active = false
                      move_input = Vector2.ZERO

              elif event is InputEventScreenDrag:
                  if joystick_active:
                      var center := joystick_center
                      var offset: Vector2 = event.position - center

                      if offset.length() > 100.0:
                          offset = offset.normalized() * 100.0

                      move_input = offset / 100.0
          EOF

      - name: Criar export_presets.cfg
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool \
              -genkeypair \
              -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          cat > export_presets.cfg <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""

          gradle_build/use_gradle_build=false
          gradle_build/gradle_build_directory=""

          package/unique_name="com.mundov1.game"
          package/name="MUNDO V1"

          version/code=22
          version/name="2.2"

          package/architecture/arm64-v8a=true
          package/architecture/armeabi-v7a=false
          package/architecture/x86=false
          package/architecture/x86_64=false

          package/signed=true

          keystore/debug="/home/runner/.android/debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"

          keystore/release=""
          keystore/release_user=""
          keystore/release_password=""

          export_format=0

          export_filter="all_resources"
          include_filter=""
          exclude_filter=""

          one_click_deploy/clear_previous_install=true

          screen/immersive_mode=true
          screen/orientation=1

          graphics/rendering_method="gl_compatibility"
          graphics/rendering_method.mobile="gl_compatibility"

          textures/default_filters/use_nearest_mipmap_filter=false
          EOF

      - name: Validar projeto
        shell: bash
        run: |
          set -euxo pipefail

          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          godot \
            --headless \
            --editor \
            --path . \
            --quit

      - name: Exportar APK V2.2
        shell: bash
        run: |
          set -euxo pipefail

          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          rm -rf build
          mkdir -p build

          godot \
            --headless \
            --path . \
            --export-debug \
            "Android" \
            build/MundoV1.apk

          test -f build/MundoV1.apk

      - name: Verificar APK
        shell: bash
        run: |
          set -euxo pipefail

          export ANDROID_HOME="$HOME/android-sdk"

          "$ANDROID_HOME/build-tools/34.0.0/apksigner" \
            verify \
            --verbose \
            build/MundoV1.apk

          ls -lh build/MundoV1.apk

      - name: Renomear APK
        shell: bash
        run: |
          set -euxo pipefail

          mv build/MundoV1.apk build/MUNDO-V1-V2.2-APK.apk

          ls -lh build/MUNDO-V1-V2.2-APK.apk

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: MUNDO-V1-V2.2-APK
          path: build/MUNDO-V1-V2.2-APK.apk
          if-no-files-found: error
          retention-days: 14
