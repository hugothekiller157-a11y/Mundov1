          func create_button(layer: CanvasLayer, text_value: String, pos: Vector2, size: Vector2) -> void:
              var button: Button = Button.new()
              button.text = text_value
              button.position = pos
              button.size = size
              button.add_theme_font_size_override("font_size", 17)
              button.add_theme_color_override("font_color", Color("#ffffff"))
              layer.add_child(button)

              if text_value == "PULAR":
                  button.pressed.connect(jump_player)
              elif text_value == "COLETAR":
                  button.pressed.connect(collect_nearby)
              elif text_value == "CONSTRUIR":
                  button.pressed.connect(build_shelter)

          func _physics_process(delta: float) -> void:
              if player == null:
                  return

              var keyboard_input: Vector2 = Input.get_vector(
                  "move_left",
                  "move_right",
                  "move_forward",
                  "move_back"
              )

              var final_input: Vector2 = keyboard_input

              if move_input.length() > 0.05:
                  final_input = move_input

              var direction: Vector3 = Vector3(
                  final_input.x,
                  0.0,
                  final_input.y
              )

              if direction.length() > 1.0:
                  direction = direction.normalized()

              var running: bool = Input.is_action_pressed("sprint")
              var speed: float = 4.2

              if running and stamina > 1.0 and direction.length() > 0.1:
                  speed = 6.3
                  stamina = max(0.0, stamina - delta * 18.0)
              else:
                  stamina = min(100.0, stamina + delta * 10.0)

              if not player.is_on_floor():
                  player.velocity.y -= 18.0 * delta

              if Input.is_action_just_pressed("jump") and player.is_on_floor():
                  player.velocity.y = 7.0

              player.velocity.x = direction.x * speed
              player.velocity.z = direction.z * speed

              player.move_and_slide()

              if direction.length() > 0.1:
                  var target_rotation: float = atan2(direction.x, direction.z)
                  player.rotation.y = lerp_angle(
                      player.rotation.y,
                      target_rotation,
                      delta * 9.0
                  )

              update_camera(delta)
              update_water(delta)
              update_ui()

          func update_camera(delta: float) -> void:
              if camera == null:
                  return

              var desired_position: Vector3 = player.position + Vector3(
                  0.0,
                  camera_height,
                  camera_distance
              )

              camera.position = camera.position.lerp(
                  desired_position,
                  delta * camera_smooth
              )

              var look_target: Vector3 = player.position + Vector3(
                  0.0,
                  1.35,
                  0.0
              )

              camera.look_at(look_target, Vector3.UP)

          func update_water(delta: float) -> void:
              water_time += delta

              var water_nodes: Array[Node] = get_tree().get_nodes_in_group("water")

              for node in water_nodes:
                  if node is Node3D:
                      var water_node: Node3D = node as Node3D
                      var base_y: float = float(water_node.get_meta("base_y", 0.075))
                      water_node.position.y = base_y + sin(water_time * 1.2) * 0.025

              var shine_nodes: Array[Node] = get_tree().get_nodes_in_group("water_shine")

              for i in range(shine_nodes.size()):
                  var shine_node: Node = shine_nodes[i]

                  if shine_node is Node3D:
                      var shine_3d: Node3D = shine_node as Node3D
                      shine_3d.position.x += delta * (0.20 + float(i % 3) * 0.08)

                      if shine_3d.position.x > 38.0:
                          shine_3d.position.x = -12.0

          func update_ui() -> void:
              if ui_stamina != null:
                  ui_stamina.text = "⚡  %d" % int(stamina)

              if ui_inventory != null:
                  ui_inventory.text = "MADEIRA %d   •   PEDRA %d" % [wood, stone]

          func jump_player() -> void:
              if player != null and player.is_on_floor():
                  player.velocity.y = 7.0

          func _on_resource_body_entered(body: Node3D, resource: Area3D) -> void:
              if body != player:
                  return

              if bool(resource.get_meta("collected", false)):
                  return

              resource.set_meta("collected", true)

              var resource_type: String = str(resource.get_meta("resource_type", "PEDRA"))

              if resource_type == "MADEIRA":
                  wood += 1
              else:
                  stone += 1

              ui_status.text = "+1 %s" % resource_type

              var tween: Tween = create_tween()
              tween.tween_property(
                  resource,
                  "scale",
                  Vector3.ZERO,
                  0.25
              )
              tween.tween_callback(resource.queue_free)

          func collect_nearby() -> void:
              if player == null:
                  return

              var closest: Area3D = null
              var closest_distance: float = 3.0

              for node in get_tree().get_nodes_in_group(""):
                  pass

              for child in get_children():
                  if child is Area3D and child.name.begins_with("Resource_"):
                      var resource: Area3D = child as Area3D

                      if bool(resource.get_meta("collected", false)):
                          continue

                      var distance: float = player.global_position.distance_to(
                          resource.global_position
                      )

                      if distance < closest_distance:
                          closest_distance = distance
                          closest = resource

              if closest != null:
                  closest.set_meta("collected", true)

                  var resource_type: String = str(
                      closest.get_meta("resource_type", "PEDRA")
                  )

                  if resource_type == "MADEIRA":
                      wood += 1
                  else:
                      stone += 1

                  ui_status.text = "+1 %s" % resource_type

                  var tween: Tween = create_tween()
                  tween.tween_property(
                      closest,
                      "scale",
                      Vector3.ZERO,
                      0.22
                  )
                  tween.tween_callback(closest.queue_free)
              else:
                  ui_status.text = "NENHUM RECURSO PRÓXIMO"

          func build_shelter() -> void:
              if player == null:
                  return

              if wood < 2 or stone < 1:
                  ui_status.text = "PRECISA DE 2 MADEIRAS + 1 PEDRA"
                  return

              wood -= 2
              stone -= 1

              var shelter: Node3D = Node3D.new()
              shelter.name = "Abrigo"

              var base_position: Vector3 = player.global_position
              base_position += Vector3(0, 0, -4)
              shelter.position = base_position
              add_child(shelter)

              create_build_piece(
                  shelter,
                  Vector3(0, 0.15, 0),
                  Vector3(3.6, 0.3, 3.6),
                  Color("#725034")
              )

              var posts: Array[Vector3] = [
                  Vector3(-1.5, 1.5, -1.5),
                  Vector3(1.5, 1.5, -1.5),
                  Vector3(-1.5, 1.5, 1.5),
                  Vector3(1.5, 1.5, 1.5)
              ]

              for post in posts:
                  create_build_piece(
                      shelter,
                      post,
                      Vector3(0.28, 2.8, 0.28),
                      Color("#805936")
                  )

              create_build_piece(
                  shelter,
                  Vector3(0, 2.85, 0),
                  Vector3(3.9, 0.28, 3.9),
                  Color("#4d6d3d")
              )

              ui_status.text = "ABRIGO CONSTRUÍDO!"

          func create_build_piece(
              parent: Node3D,
              local_position: Vector3,
              piece_size: Vector3,
              color: Color
          ) -> void:
              var piece: MeshInstance3D = MeshInstance3D.new()
              var mesh: BoxMesh = BoxMesh.new()
              mesh.size = piece_size
              piece.mesh = mesh
              piece.position = local_position
              piece.material_override = make_material(color, 0.88)
              parent.add_child(piece)

          func _input(event: InputEvent) -> void:
              if joystick_base == null:
                  return

              if event is InputEventScreenTouch:
                  var touch: InputEventScreenTouch = event

                  if touch.pressed:
                      var local_position: Vector2 = touch.position - joystick_base.position

                      if local_position.length() <= 100.0:
                          joystick_active = true
                          joystick_touch_id = touch.index
                          joystick_center = joystick_base.position + joystick_base.size * 0.5
                          update_joystick(touch.position)

                  elif touch.index == joystick_touch_id:
                      joystick_active = false
                      joystick_touch_id = -1
                      move_input = Vector2.ZERO
                      joystick_knob.position = joystick_base.position + Vector2(53, 53)

              elif event is InputEventScreenDrag:
                  var drag: InputEventScreenDrag = event

                  if joystick_active and drag.index == joystick_touch_id:
                      update_joystick(drag.position)

          func update_joystick(position: Vector2) -> void:
              var offset: Vector2 = position - joystick_center
              var radius: float = 55.0

              if offset.length() > radius:
                  offset = offset.normalized() * radius

              move_input = Vector2(
                  offset.x / radius,
                  offset.y / radius
              )

              joystick_knob.position = joystick_center + offset - Vector2(22, 22)
          EOF

      - name: Criar export_presets.cfg
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool \
              -genkeypair \
              -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          cat > export_presets.cfg <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/MundoV1.apk"

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false

          package/unique_name="com.mundov1.game"
          package/name="MUNDO V1"
          package/signed=true
          package/version/code=23
          package/version/name="2.3"

          version/code=23
          version/name="2.3"

          package/launcher_icons/main="res://icon.svg"
          package/launcher_icons/adaptive_foreground=""
          package/launcher_icons/adaptive_background=""

          package/permissions/internet=false
          package/permissions/access_network_state=false

          screen/immersive_mode=true
          screen/orientation=1
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true

          rendering/method="gl_compatibility"
          rendering/driver="opengl3"

          input_devices/pointing/emulate_touch_from_mouse=true
          input_devices/pointing/emulate_mouse_from_touch=true

          options/keystore/debug="/home/runner/.android/debug.keystore"
          options/keystore/debug_user="androiddebugkey"
          options/keystore/debug_password="android"

          debug/export_console_script=true

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false

          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false

          package/unique_name="com.mundov1.game"
          package/name="MUNDO V1"
          package/signed=true
          package/version/code=23
          package/version/name="2.3"

          version/code=23
          version/name="2.3"

          screen/immersive_mode=true
          screen/orientation=1

          rendering/method="gl_compatibility"
          rendering/driver="opengl3"

          input_devices/pointing/emulate_touch_from_mouse=true
          input_devices/pointing/emulate_mouse_from_touch=true

          options/keystore/debug="/home/runner/.android/debug.keystore"
          options/keystore/debug_user="androiddebugkey"
          options/keystore/debug_password="android"
          EOF

      - name: Validar projeto Godot
        shell: bash
        run: |
          set -euxo pipefail

          godot \
            --headless \
            --editor \
            --path . \
            --quit

      - name: Exportar APK V2.3
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p build

          godot \
            --headless \
            --path . \
            --export-debug \
            "Android" \
            build/MundoV1.apk

          test -f build/MundoV1.apk

          ls -lh build/MundoV1.apk

      - name: Verificar assinatura APK
        shell: bash
        run: |
          set -euxo pipefail

          "$ANDROID_HOME/build-tools/34.0.0/apksigner" \
            verify \
            --verbose \
            build/MundoV1.apk

      - name: Informações finais
        shell: bash
        run: |
          set -euxo pipefail

          echo "========================================"
          echo " MUNDO V1 - V2.3 AAA MOBILE ESTILIZADO"
          echo "========================================"
          echo "APK: build/MundoV1.apk"
          echo "Package: com.mundov1.game"
          echo "Version: 2.3"
          echo "Architecture: ARM64"
          echo "Renderer: GL Compatibility"
          echo "========================================"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MUNDO-V1-V2.3-AAA-MOBILE-APK
          path: build/MundoV1.apk
          if-no-files-found: error
