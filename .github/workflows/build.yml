name: Mundo V1 - APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$HOME/android-sdk"

          mkdir -p "$ANDROID_HOME/cmdline-tools"

          cd /tmp

          wget -q \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -O cmdline-tools.zip

          rm -rf /tmp/android-cmdline-tools

          mkdir -p /tmp/android-cmdline-tools

          unzip -q \
            cmdline-tools.zip \
            -d /tmp/android-cmdline-tools

          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"

          cp -r \
            /tmp/android-cmdline-tools/cmdline-tools/. \
            "$ANDROID_HOME/cmdline-tools/latest/"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"

      - name: Instalar componentes Android
        shell: bash
        run: |
          set -euxo pipefail

          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$HOME/android-sdk"

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          yes | sdkmanager --licenses >/dev/null || true

          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/build-tools/34.0.0"
          test -f "$ANDROID_HOME/platform-tools/adb"

          echo "Android SDK instalado."

      - name: Iniciar ADB
        shell: bash
        run: |
          set -euxo pipefail

          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$HOME/android-sdk"

          export PATH="$ANDROID_HOME/platform-tools:$PATH"

          echo "Versão do ADB:"
          adb version

          echo "Iniciando servidor ADB..."

          adb kill-server || true

          adb start-server

          sleep 3

          echo "Verificando servidor ADB..."

          adb devices

          echo "ADB funcionando."

      - name: Baixar Godot 4.3
        shell: bash
        run: |
          set -euxo pipefail

          cd /tmp

          wget -q \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip" \
            -O godot.zip

          unzip -q godot.zip

          chmod +x Godot_v4.3-stable_linux.x86_64

          cp \
            Godot_v4.3-stable_linux.x86_64 \
            "$GITHUB_WORKSPACE/Godot"

          chmod +x "$GITHUB_WORKSPACE/Godot"

          "$GITHUB_WORKSPACE/Godot" --version

      - name: Instalar templates Android do Godot
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p \
            "$HOME/.local/share/godot/export_templates/4.3.stable"

          cd /tmp

          wget -q \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" \
            -O templates.tpz

          rm -rf godot_templates

          mkdir -p godot_templates

          unzip -q \
            templates.tpz \
            -d godot_templates

          cp -r \
            godot_templates/templates/. \
            "$HOME/.local/share/godot/export_templates/4.3.stable/"

          echo "Templates Android instalados."

          ls -la \
            "$HOME/.local/share/godot/export_templates/4.3.stable"

      - name: Configurar Godot para Android
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]

          android/adb = "$HOME/android-sdk/platform-tools/adb"
          android/sdk_path = "$HOME/android-sdk"
          EOF

          echo "Configuração Godot:"
          cat "$HOME/.config/godot/editor_settings-4.tres"

      - name: Preparar projeto
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p scripts
          mkdir -p build

      - name: Criar project.godot
        shell: bash
        run: |
          cat > project.godot <<'EOF'
          [application]

          config/name="Mundo V1"
          config/description="Mundo V1 - exploração e construção"
          run/main_scene="res://Main.tscn"

          [display]

          window/size/viewport_width=1280
          window/size/viewport_height=720
          window/size/window_width_override=1280
          window/size/window_height_override=720

          [rendering]

          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"

          environment/defaults/default_clear_color=Color(0.38, 0.62, 0.88, 1)

          [input]

          move_forward={
          "deadzone": 0.5,
          "events": [Object(InputEventKey,"physical_keycode":87)]
          }

          move_back={
          "deadzone": 0.5,
          "events": [Object(InputEventKey,"physical_keycode":83)]
          }

          move_left={
          "deadzone": 0.5,
          "events": [Object(InputEventKey,"physical_keycode":65)]
          }

          move_right={
          "deadzone": 0.5,
          "events": [Object(InputEventKey,"physical_keycode":68)]
          }

          jump={
          "deadzone": 0.5,
          "events": [Object(InputEventKey,"physical_keycode":32)]
          }
          EOF

      - name: Criar Main.tscn
        shell: bash
        run: |
          cat > Main.tscn <<'EOF'
          [gd_scene load_steps=2 format=3]

          [ext_resource path="res://scripts/main.gd" type="Script" id="1"]

          [node name="MundoV1" type="Node3D"]
          script = ExtResource("1")
          EOF

      - name: Criar main.gd
        shell: bash
        run: |
          cat > scripts/main.gd <<'EOF'
          extends Node3D

          var player: CharacterBody3D
          var camera: Camera3D

          func _ready():
              create_environment()
              create_world()
              create_player()
              create_interface()

          func material(color: Color) -> StandardMaterial3D:
              var m := StandardMaterial3D.new()
              m.albedo_color = color
              m.roughness = 0.85
              return m

          func create_environment():

              var world_environment := WorldEnvironment.new()
              var environment := Environment.new()

              environment.background_mode = Environment.BG_COLOR
              environment.background_color = Color(0.38, 0.62, 0.88)

              environment.ambient_light_source = Environment.AMBIENT_SOURCE_COLOR
              environment.ambient_light_color = Color(0.8, 0.85, 1.0)
              environment.ambient_light_energy = 0.8

              world_environment.environment = environment

              add_child(world_environment)

              var sun := DirectionalLight3D.new()

              sun.rotation_degrees = Vector3(-50, -30, 0)
              sun.light_energy = 1.2
              sun.shadow_enabled = true

              add_child(sun)

          func create_world():

              create_ground()

              create_water()

              create_tree(Vector3(-12, 0, -8))
              create_tree(Vector3(10, 0, -15))
              create_tree(Vector3(20, 0, 5))
              create_tree(Vector3(-20, 0, 12))
              create_tree(Vector3(6, 0, 20))

              create_rock(Vector3(5, 0, 5))
              create_rock(Vector3(-7, 0, 10))
              create_rock(Vector3(15, 0, 15))
              create_rock(Vector3(-18, 0, -5))

          func create_ground():

              var ground := StaticBody3D.new()

              ground.position = Vector3(0, -1, 0)

              add_child(ground)

              var mesh := MeshInstance3D.new()
              var box := BoxMesh.new()

              box.size = Vector3(80, 2, 80)

              mesh.mesh = box

              mesh.material_override = material(
                  Color(0.30, 0.60, 0.25)
              )

              ground.add_child(mesh)

              var collision := CollisionShape3D.new()
              var shape := BoxShape3D.new()

              shape.size = Vector3(80, 2, 80)

              collision.shape = shape

              ground.add_child(collision)

          func create_water():

              var water := MeshInstance3D.new()
              var mesh := BoxMesh.new()

              mesh.size = Vector3(24, 0.15, 16)

              water.mesh = mesh
              water.position = Vector3(18, 0.1, -12)

              water.material_override = material(
                  Color(0.08, 0.45, 0.78)
              )

              add_child(water)

          func create_tree(pos: Vector3):

              var trunk := MeshInstance3D.new()
              var trunk_mesh := CylinderMesh.new()

              trunk_mesh.top_radius = 0.35
              trunk_mesh.bottom_radius = 0.45
              trunk_mesh.height = 3.5

              trunk.mesh = trunk_mesh

              trunk.position = pos + Vector3(0, 1.75, 0)

              trunk.material_override = material(
                  Color(0.38, 0.20, 0.08)
              )

              add_child(trunk)

              var leaves := MeshInstance3D.new()
              var leaves_mesh := SphereMesh.new()

              leaves_mesh.radius = 2.2
              leaves_mesh.height = 4.0

              leaves.mesh = leaves_mesh

              leaves.position = pos + Vector3(0, 4.2, 0)

              leaves.material_override = material(
                  Color(0.10, 0.48, 0.18)
              )

              add_child(leaves)

          func create_rock(pos: Vector3):

              var rock := MeshInstance3D.new()
              var mesh := SphereMesh.new()

              mesh.radius = 1.0
              mesh.height = 1.6

              rock.mesh = mesh
              rock.scale = Vector3(1.4, 0.7, 1.1)

              rock.position = pos + Vector3(0, 0.6, 0)

              rock.material_override = material(
                  Color(0.40, 0.43, 0.45)
              )

              add_child(rock)

          func create_player():

              player = CharacterBody3D.new()

              player.name = "Player"
              player.position = Vector3(0, 2, 8)

              add_child(player)

              var body := MeshInstance3D.new()
              var body_mesh := CapsuleMesh.new()

              body_mesh.radius = 0.45
              body_mesh.height = 1.8

              body.mesh = body_mesh
              body.position.y = 0.9

              body.material_override = material(
                  Color(0.15, 0.35, 0.75)
              )

              player.add_child(body)

              var collision := CollisionShape3D.new()
              var shape := CapsuleShape3D.new()

              shape.radius = 0.45
              shape.height = 1.8

              collision.shape = shape
              collision.position.y = 0.9

              player.add_child(collision)

              camera = Camera3D.new()

              camera.position = Vector3(0, 4, 7)

              player.add_child(camera)

              camera.current = true

          func create_interface():

              var layer := CanvasLayer.new()

              add_child(layer)

              var title := Label.new()

              title.text = "MUNDO V1"
              title.position = Vector2(30, 25)

              title.add_theme_font_size_override(
                  "font_size",
                  32
              )

              layer.add_child(title)

              var info := Label.new()

              info.text = "Explore o mundo"

              info.position = Vector2(32, 68)

              info.add_theme_font_size_override(
                  "font_size",
                  18
              )

              layer.add_child(info)

          func _physics_process(delta):

              if player == null:
                  return

              var input := Vector2(
                  Input.get_action_strength("move_right") -
                  Input.get_action_strength("move_left"),

                  Input.get_action_strength("move_back") -
                  Input.get_action_strength("move_forward")
              )

              var direction := Vector3(
                  input.x,
                  0,
                  input.y
              )

              if direction.length() > 1.0:
                  direction = direction.normalized()

              player.velocity.x = direction.x * 6.0
              player.velocity.z = direction.z * 6.0

              if not player.is_on_floor():

                  player.velocity.y -= 18.0 * delta

              elif Input.is_action_just_pressed("jump"):

                  player.velocity.y = 7.0

              player.move_and_slide()

              camera.look_at(
                  player.global_position + Vector3(0, 1, 0),
                  Vector3.UP
              )
          EOF

      - name: Criar chave de assinatura
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/.android"

          keytool \
            -genkeypair \
            -v \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Criar export_presets.cfg
        shell: bash
        run: |
          cat > export_presets.cfg <<EOF
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/MundoV1.apk"

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""

          gradle_build/use_gradle_build=false

          package/unique_name="com.mundov1.game"
          package/name="Mundo V1"
          package/version_code=1
          package/version_name="1.0"

          package/signed=true

          package/keystore/debug="$HOME/.android/debug.keystore"
          package/keystore/debug_user="androiddebugkey"
          package/keystore/debug_password="android"

          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false

          permissions/internet=false
          EOF

      - name: Verificar ADB antes do Godot
        shell: bash
        run: |
          set -euxo pipefail

          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$HOME/android-sdk"

          export PATH="$ANDROID_HOME/platform-tools:$PATH"

          echo "ADB:"
          adb version

          echo "Dispositivos:"
          adb devices

          echo "Testando porta 5037:"

          if adb devices >/dev/null 2>&1; then
            echo "Servidor ADB respondendo."
          else
            echo "ADB não respondeu."
            exit 1
          fi

      - name: Importar projeto Godot
        shell: bash
        run: |
          set -euxo pipefail

          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$HOME/android-sdk"

          export PATH="$ANDROID_HOME/platform-tools:$PATH"

          adb start-server

          "$GITHUB_WORKSPACE/Godot" \
            --headless \
            --path "$GITHUB_WORKSPACE" \
            --editor \
            --quit

      - name: Exportar APK
        shell: bash
        run: |
          set -euxo pipefail

          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$HOME/android-sdk"

          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/34.0.0:$PATH"

          adb start-server

          rm -f build/MundoV1.apk

          "$GITHUB_WORKSPACE/Godot" \
            --headless \
            --path "$GITHUB_WORKSPACE" \
            --export-debug \
            "Android" \
            "$GITHUB_WORKSPACE/build/MundoV1.apk"

      - name: Conferir APK
        shell: bash
        run: |
          set -euxo pipefail

          test -f build/MundoV1.apk

          echo "================================"
          echo "MUNDO V1 APK GERADO"
          echo "================================"

          ls -lh build/MundoV1.apk

          file build/MundoV1.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MundoV1-APK
          path: build/MundoV1.apk
          if-no-files-found: error
