name: MUNDO V1.3 - Mundo 3D Natural

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/android-sdk/cmdline-tools"

          cd "$RUNNER_TEMP"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O cmdline-tools.zip

          unzip -q cmdline-tools.zip

          mv cmdline-tools "$HOME/android-sdk/cmdline-tools/latest"

          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$HOME/android-sdk/platform-tools" >> "$GITHUB_PATH"

          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          adb start-server || true

      - name: Instalar Godot 4.3
        shell: bash
        run: |
          set -euxo pipefail

          cd "$RUNNER_TEMP"

          wget -q \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip \
            -O godot.zip

          unzip -q godot.zip

          chmod +x Godot_v4.3-stable_linux.x86_64

          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot

          godot --version

      - name: Instalar templates Android do Godot
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"

          cd "$RUNNER_TEMP"

          wget -q \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz \
            -O templates.tpz

          unzip -q templates.tpz

          mv templates/android_debug.apk \
            "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"

          mv templates/android_release.apk \
            "$HOME/.local/share/godot/export_templates/4.3.stable/android_release.apk"

          test -f "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"
          test -f "$HOME/.local/share/godot/export_templates/4.3.stable/android_release.apk"

      - name: Criar projeto MUNDO V1.3
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf \
            project.godot \
            Main.tscn \
            scripts \
            export_presets.cfg \
            icon.svg \
            build

          mkdir -p scripts
          mkdir -p build

          cat > project.godot <<'EOF'
          ; MUNDO V1.3
          ; Mundo 3D natural para Android

          config_version=5

          [application]

          config/name="MUNDO V1"
          run/main_scene="res://Main.tscn"
          config/features=PackedStringArray("4.3", "GL Compatibility")
          config/icon="res://icon.svg"

          [display]

          window/size/viewport_width=1280
          window/size/viewport_height=720
          window/size/window_width_override=1280
          window/size/window_height_override=720
          window/stretch/mode="canvas_items"

          [rendering]

          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          textures/vram_compression/import_etc2_astc=true

          [physics]

          3d/default_gravity=18.0

          [input]

          move_forward={
          "deadzone": 0.5,
          "events": [Object(InputEventKey,"physical_keycode":87)]
          }

          move_back={
          "deadzone": 0.5,
          "events": [Object(InputEventKey,"physical_keycode":83)]
          }

          move_left={
          "deadzone": 0.5,
          "events": [Object(InputEventKey,"physical_keycode":65)]
          }

          move_right={
          "deadzone": 0.5,
          "events": [Object(InputEventKey,"physical_keycode":68)]
          }

          jump={
          "deadzone": 0.5,
          "events": [Object(InputEventKey,"physical_keycode":32)]
          }
          EOF

          cat > Main.tscn <<'EOF'
          [gd_scene load_steps=2 format=3]

          [ext_resource path="res://scripts/main.gd" type="Script" id="1"]

          [node name="MundoV1" type="Node3D"]
          script = ExtResource("1")
          EOF

          cat > scripts/main.gd <<'EOF'
          extends Node3D

          var player: CharacterBody3D
          var camera: Camera3D

          var joystick_value := Vector2.ZERO
          var joystick_touch := -1
          var joystick_active := false

          var yaw := 0.0
          var camera_dragging := false
          var last_touch := Vector2.ZERO

          var inventory_wood := 0
          var inventory_stone := 0

          const SPEED := 5.2
          const JUMP := 7.2
          const GRAVITY := 18.0

          func _ready():
              create_environment()
              create_ground()
              create_hills()
              create_water()
              create_world_objects()
              create_player()
              create_camera()
              create_ui()

          func make_material(color: Color, roughness: float = 0.8):
              var material := StandardMaterial3D.new()
              material.albedo_color = color
              material.roughness = roughness
              return material

          func create_environment():
              var world_environment := WorldEnvironment.new()

              var environment := Environment.new()

              environment.background_mode = Environment.BG_SKY

              var sky := Sky.new()
              var sky_material := ProceduralSkyMaterial.new()

              sky_material.sky_top_color = Color("#3f82c4")
              sky_material.sky_horizon_color = Color("#dceeff")
              sky_material.ground_bottom_color = Color("#71836d")
              sky_material.ground_horizon_color = Color("#c9dccb")
              sky_material.sun_angle_max = 10.0

              sky.material = sky_material
              environment.sky = sky

              environment.ambient_light_source = Environment.AMBIENT_SOURCE_SKY
              environment.ambient_light_energy = 0.75

              environment.tonemap_mode = Environment.TONE_MAPPER_FILMIC

              world_environment.environment = environment
              add_child(world_environment)

              var sun := DirectionalLight3D.new()

              sun.rotation_degrees = Vector3(-52.0, -35.0, 0.0)
              sun.light_color = Color("#fff1d1")
              sun.light_energy = 1.35
              sun.shadow_enabled = true
              sun.directional_shadow_max_distance = 90.0

              add_child(sun)

          func create_ground():
              var ground := MeshInstance3D.new()

              var mesh := PlaneMesh.new()

              mesh.size = Vector2(100.0, 100.0)
              mesh.subdivide_width = 30
              mesh.subdivide_depth = 30

              ground.mesh = mesh
              ground.material_override = make_material(
                  Color("#4f9149"),
                  1.0
              )

              add_child(ground)

              var body := StaticBody3D.new()

              var collision := CollisionShape3D.new()
              var shape := BoxShape3D.new()

              shape.size = Vector3(100.0, 1.0, 100.0)

              collision.shape = shape

              body.position.y = -0.5
              body.add_child(collision)

              add_child(body)

          func create_hills():
              var hills = [
                  [Vector3(-32.0, 2.0, -25.0), Vector3(17.0, 4.0, 13.0)],
                  [Vector3(30.0, 3.0, -27.0), Vector3(21.0, 6.0, 15.0)],
                  [Vector3(-34.0, 2.0, 24.0), Vector3(19.0, 4.5, 14.0)],
                  [Vector3(31.0, 1.8, 25.0), Vector3(16.0, 3.5, 12.0)],
                  [Vector3(0.0, 1.3, -39.0), Vector3(30.0, 2.5, 10.0)],
                  [Vector3(42.0, 1.0, 0.0), Vector3(10.0, 2.0, 18.0)]
              ]

              var index := 0

              for data in hills:
                  var hill := MeshInstance3D.new()

                  var mesh := SphereMesh.new()

                  mesh.radius = 1.0
                  mesh.height = 2.0
                  mesh.radial_segments = 24
                  mesh.rings = 12

                  hill.mesh = mesh
                  hill.position = data[0]
                  hill.scale = data[1]

                  if index % 2 == 0:
                      hill.material_override = make_material(
                          Color("#427d3f"),
                          1.0
                      )
                  else:
                      hill.material_override = make_material(
                          Color("#3b733b"),
                          1.0
                      )

                  add_child(hill)

                  index += 1

          func create_water():
              var water := MeshInstance3D.new()

              var mesh := PlaneMesh.new()

              mesh.size = Vector2(32.0, 22.0)
              mesh.subdivide_width = 24
              mesh.subdivide_depth = 24

              water.mesh = mesh
              water.position = Vector3(10.0, 0.10, 11.0)

              var water_material := StandardMaterial3D.new()

              water_material.albedo_color = Color(
                  0.07,
                  0.38,
                  0.60,
                  0.82
              )

              water_material.transparency = BaseMaterial3D.TRANSPARENCY_ALPHA
              water_material.roughness = 0.12
              water_material.metallic = 0.08

              water.material_override = water_material

              add_child(water)

              var shore := MeshInstance3D.new()

              var shore_mesh := PlaneMesh.new()

              shore_mesh.size = Vector2(37.0, 27.0)

              shore.mesh = shore_mesh
              shore.position = Vector3(10.0, 0.02, 11.0)

              shore.material_override = make_material(
                  Color("#c3a66b"),
                  1.0
              )

              add_child(shore)

              water.position.y = 0.12

          func create_tree(
              position: Vector3,
              scale_value: float,
              leaf_color: Color
          ):
              var tree := Node3D.new()

              tree.position = position
              tree.scale = Vector3.ONE * scale_value

              add_child(tree)

              var trunk := MeshInstance3D.new()

              var trunk_mesh := CylinderMesh.new()

              trunk_mesh.top_radius = 0.22
              trunk_mesh.bottom_radius = 0.38
              trunk_mesh.height = 3.4
              trunk_mesh.radial_segments = 14

              trunk.mesh = trunk_mesh
              trunk.position.y = 1.7

              trunk.material_override = make_material(
                  Color("#67452b"),
                  1.0
              )

              tree.add_child(trunk)

              var lower := MeshInstance3D.new()

              var lower_mesh := SphereMesh.new()

              lower_mesh.radius = 1.35
              lower_mesh.height = 2.3
              lower_mesh.radial_segments = 18
              lower_mesh.rings = 10

              lower.mesh = lower_mesh
              lower.position = Vector3(0.0, 3.25, 0.0)
              lower.scale = Vector3(1.2, 0.9, 1.2)

              lower.material_override = make_material(
                  leaf_color,
                  0.95
              )

              tree.add_child(lower)

              var upper := MeshInstance3D.new()

              var upper_mesh := SphereMesh.new()

              upper_mesh.radius = 1.05
              upper_mesh.height = 1.9
              upper_mesh.radial_segments = 18
              upper_mesh.rings = 10

              upper.mesh = upper_mesh
              upper.position = Vector3(0.15, 4.25, 0.05)

              upper.material_override = make_material(
                  leaf_color.lightened(0.08),
                  0.95
              )

              tree.add_child(upper)

          func create_pine(
              position: Vector3,
              scale_value: float
          ):
              var tree := Node3D.new()

              tree.position = position
              tree.scale = Vector3.ONE * scale_value

              add_child(tree)

              var trunk := MeshInstance3D.new()

              var trunk_mesh := CylinderMesh.new()

              trunk_mesh.top_radius = 0.16
              trunk_mesh.bottom_radius = 0.28
              trunk_mesh.height = 3.0
              trunk_mesh.radial_segments = 12

              trunk.mesh = trunk_mesh
              trunk.position.y = 1.5
              trunk.material_override = make_material(
                  Color("#60422d")
              )

              tree.add_child(trunk)

              for i in range(3):
                  var leaves := MeshInstance3D.new()

                  var cone := CylinderMesh.new()

                  cone.top_radius = 0.0
                  cone.bottom_radius = 1.25 - float(i) * 0.22
                  cone.height = 2.2

                  cone.radial_segments = 16

                  leaves.mesh = cone
                  leaves.position.y = 2.5 + float(i) * 0.8

                  leaves.material_override = make_material(
                      Color("#2f713b")
                  )

                  tree.add_child(leaves)

          func create_bush(position: Vector3, scale_value: float):
              var bush := MeshInstance3D.new()

              var mesh := SphereMesh.new()

              mesh.radius = 0.7
              mesh.height = 1.0
              mesh.radial_segments = 14
              mesh.rings = 8

              bush.mesh = mesh
              bush.position = position
              bush.scale = Vector3(
                  scale_value,
                  scale_value * 0.7,
                  scale_value
              )

              bush.material_override = make_material(
                  Color("#3f833e")
              )

              add_child(bush)

          func create_rock(
              position: Vector3,
              scale_value: Vector3,
              rock_color: Color
          ):
              var rock := MeshInstance3D.new()

              var mesh := SphereMesh.new()

              mesh.radius = 1.0
              mesh.height = 1.5
              mesh.radial_segments = 12
              mesh.rings = 8

              rock.mesh = mesh
              rock.position = position
              rock.scale = scale_value

              rock.material_override = make_material(
                  rock_color,
                  1.0
              )

              add_child(rock)

          func create_grass(position: Vector3, scale_value: float):
              var grass := MeshInstance3D.new()

              var mesh := CylinderMesh.new()

              mesh.top_radius = 0.02
              mesh.bottom_radius = 0.08
              mesh.height = 0.55
              mesh.radial_segments = 5

              grass.mesh = mesh
              grass.position = position
              grass.scale = Vector3.ONE * scale_value

              grass.material_override = make_material(
                  Color("#6baa45"),
                  1.0
              )

              add_child(grass)

          func create_world_objects():
              var trees = [
                  [Vector3(-19, 0, -15), 0.95, Color("#347b3b")],
                  [Vector3(-13, 0, -25), 1.15, Color("#408a40")],
                  [Vector3(18, 0, -18), 0.90, Color("#31733a")],
                  [Vector3(25, 0, -10), 1.20, Color("#438b43")],
                  [Vector3(-27, 0, 13), 1.05, Color("#367c3c")],
                  [Vector3(-16, 0, 28), 0.90, Color("#4b9146")],
                  [Vector3(23, 0, 27), 1.20, Color("#397d3d")],
                  [Vector3(32, 0, 12), 0.85, Color("#478b43")]
              ]

              for data in trees:
                  create_tree(
                      data[0],
                      data[1],
                      data[2]
                  )

              create_pine(Vector3(5, 0, -27), 1.15)
              create_pine(Vector3(37, 0, -20), 0.95)
              create_pine(Vector3(-36, 0, -4), 1.10)
              create_pine(Vector3(34, 0, 31), 1.0)

              var bushes = [
                  Vector3(-7, 0.3, -5),
                  Vector3(-4, 0.3, -11),
                  Vector3(4, 0.3, -14),
                  Vector3(17, 0.3, -4),
                  Vector3(-17, 0.3, 8),
                  Vector3(14, 0.3, 19),
                  Vector3(-8, 0.3, 23),
                  Vector3(27, 0.3, 17),
                  Vector3(-29, 0.3, 20)
              ]

              for position in bushes:
                  create_bush(
                      position,
                      0.8 + float(
                          int(abs(position.x + position.z))
                          % 4
                      ) * 0.12
                  )

              var grass_positions = [
                  Vector3(-5, 0.25, -2),
                  Vector3(-2, 0.25, -7),
                  Vector3(4, 0.25, -4),
                  Vector3(8, 0.25, -12),
                  Vector3(17, 0.25, -2),
                  Vector3(-15, 0.25, 4),
                  Vector3(-10, 0.25, 12),
                  Vector3(4, 0.25, 17),
                  Vector3(15, 0.25, 23),
                  Vector3(-4, 0.25, 26),
                  Vector3(26, 0.25, 7),
                  Vector3(-26, 0.25, -5)
              ]

              for position in grass_positions:
                  create_grass(position, 0.8)

              create_rock(
                  Vector3(-8, 0.45, -8),
                  Vector3(1.5, 0.8, 1.0),
                  Color("#77766e")
              )

              create_rock(
                  Vector3(14, 0.45, -5),
                  Vector3(1.0, 0.6, 1.3),
                  Color("#858178")
              )

              create_rock(
                  Vector3(-25, 0.5, 5),
                  Vector3(1.8, 0.9, 1.2),
                  Color("#6f706a")
              )

              create_rock(
                  Vector3(28, 0.45, 5),
                  Vector3(1.2, 0.7, 1.0),
                  Color("#817e75")
              )

              create_rock(
                  Vector3(0, 0.35, 20),
                  Vector3(1.4, 0.5, 1.0),
                  Color("#77756c")
              )

              create_rock(
                  Vector3(-20, 0.4, 20),
                  Vector3(0.9, 0.6, 1.4),
                  Color("#89867d")
              )

          func create_player():
              player = CharacterBody3D.new()

              player.name = "Player"
              player.position = Vector3(0.0, 1.2, 6.0)

              add_child(player)

              var body := MeshInstance3D.new()

              var body_mesh := CapsuleMesh.new()

              body_mesh.radius = 0.42
              body_mesh.height = 1.8
              body_mesh.radial_segments = 20
              body_mesh.rings = 8

              body.mesh = body_mesh
              body.position.y = 0.9

              body.material_override = make_material(
                  Color("#d99d3c"),
                  0.7
              )

              player.add_child(body)

              var head := MeshInstance3D.new()

              var head_mesh := SphereMesh.new()

              head_mesh.radius = 0.39
              head_mesh.height = 0.78
              head_mesh.radial_segments = 20
              head_mesh.rings = 12

              head.mesh = head_mesh
              head.position = Vector3(0.0, 2.05, 0.0)

              head.material_override = make_material(
                  Color("#efc39c"),
                  0.7
              )

              player.add_child(head)

              var hair := MeshInstance3D.new()

              var hair_mesh := SphereMesh.new()

              hair_mesh.radius = 0.41
              hair_mesh.height = 0.40
              hair_mesh.radial_segments = 18
              hair_mesh.rings = 8

              hair.mesh = hair_mesh
              hair.position = Vector3(0.0, 2.32, 0.0)

              hair.material_override = make_material(
                  Color("#4b3022")
              )

              player.add_child(hair)

              var collision := CollisionShape3D.new()

              var shape := CapsuleShape3D.new()

              shape.radius = 0.42
              shape.height = 1.8

              collision.shape = shape
              collision.position.y = 0.9

              player.add_child(collision)

          func create_camera():
              camera = Camera3D.new()

              camera.name = "MainCamera"
              camera.current = true

              add_child(camera)

              camera.position = Vector3(
                  0.0,
                  4.5,
                  13.0
              )

              camera.look_at(
                  Vector3(0.0, 1.0, 6.0),
                  Vector3.UP
              )

          func create_ui():
              var canvas := CanvasLayer.new()

              canvas.name = "Interface"

              add_child(canvas)

              var top_panel := ColorRect.new()

              top_panel.position = Vector2(0, 0)
              top_panel.size = Vector2(1280, 105)

              top_panel.color = Color(
                  0.02,
                  0.05,
                  0.08,
                  0.35
              )

              top_panel.mouse_filter = Control.MOUSE_FILTER_IGNORE

              canvas.add_child(top_panel)

              var title := Label.new()

              title.text = "MUNDO V1"

              title.position = Vector2(32, 22)

              title.add_theme_font_size_override(
                  "font_size",
                  36
              )

              title.add_theme_color_override(
                  "font_color",
                  Color.WHITE
              )

              canvas.add_child(title)

              var subtitle := Label.new()

              subtitle.text = "V1.3  •  MUNDO NATURAL"

              subtitle.position = Vector2(35, 66)

              subtitle.add_theme_font_size_override(
                  "font_size",
                  16
              )

              subtitle.add_theme_color_override(
                  "font_color",
                  Color("#d7f0ff")
              )

              canvas.add_child(subtitle)

              var inventory := Label.new()

              inventory.name = "Inventory"

              inventory.text = "🌲 Madeira: 0     🪨 Pedra: 0"

              inventory.position = Vector2(830, 32)

              inventory.size = Vector2(400, 45)

              inventory.horizontal_alignment = HORIZONTAL_ALIGNMENT_RIGHT

              inventory.add_theme_font_size_override(
                  "font_size",
                  18
              )

              inventory.add_theme_color_override(
                  "font_color",
                  Color.WHITE
              )

              canvas.add_child(inventory)

              var joystick := ColorRect.new()

              joystick.name = "Joystick"

              joystick.position = Vector2(42, 505)
              joystick.size = Vector2(155, 155)

              joystick.color = Color(
                  0.02,
                  0.05,
                  0.08,
                  0.42
              )

              joystick.mouse_filter = Control.MOUSE_FILTER_STOP

              canvas.add_child(joystick)

              joystick.gui_input.connect(
                  _joystick_input.bind(joystick)
              )

              var knob := ColorRect.new()

              knob.name = "Knob"

              knob.position = Vector2(54, 54)
              knob.size = Vector2(47, 47)

              knob.color = Color(
                  1.0,
                  1.0,
                  1.0,
                  0.68
              )

              knob.mouse_filter = Control.MOUSE_FILTER_IGNORE

              joystick.add_child(knob)

              var jump := Button.new()

              jump.text = "PULAR"

              jump.position = Vector2(1045, 565)
              jump.size = Vector2(165, 78)

              jump.add_theme_font_size_override(
                  "font_size",
                  20
              )

              jump.pressed.connect(_jump)

              canvas.add_child(jump)

              var action := Button.new()

              action.text = "COLETAR"

              action.position = Vector2(855, 585)
              action.size = Vector2(155, 65)

              action.add_theme_font_size_override(
                  "font_size",
                  17
              )

              action.pressed.connect(_collect)

              canvas.add_child(action)

          func _joystick_input(
              event: InputEvent,
              joystick: Control
          ):
              var knob := joystick.get_node("Knob") as Control

              if event is InputEventScreenTouch:
                  if event.pressed:
                      joystick_active = true
                      joystick_touch = event.index

                      update_joystick(
                          event.position,
                          joystick,
                          knob
                      )

                  elif event.index == joystick_touch:
                      joystick_active = false
                      joystick_touch = -1
                      joystick_value = Vector2.ZERO

                      knob.position = Vector2(
                          54,
                          54
                      )

              elif event is InputEventScreenDrag:
                  if event.index == joystick_touch:
                      update_joystick(
                          event.position,
                          joystick,
                          knob
                      )

          func update_joystick(
              position: Vector2,
              joystick: Control,
              knob: Control
          ):
              var center := Vector2(77.5, 77.5)

              var local_position := (
                  position -
                  joystick.global_position
              )

              var offset := local_position - center

              if offset.length() > 56.0:
                  offset = offset.normalized() * 56.0

              joystick_value = offset / 56.0

              knob.position = (
                  center +
                  offset -
                  Vector2(23.5, 23.5)
              )

          func _jump():
              if player != null and player.is_on_floor():
                  player.velocity.y = JUMP

          func _collect():
              inventory_wood += 1
              inventory_stone += 1

              var inventory := get_node_or_null(
                  "Interface/Inventory"
              )

              if inventory:
                  inventory.text = (
                      "🌲 Madeira: " +
                      str(inventory_wood) +
                      "     🪨 Pedra: " +
                      str(inventory_stone)
                  )

          func _physics_process(delta):
              if player == null:
                  return

              var input_vector := Vector2(
                  Input.get_axis(
                      "move_left",
                      "move_right"
                  ),
                  Input.get_axis(
                      "move_forward",
                      "move_back"
                  )
              )

              if joystick_value.length() > 0.05:
                  input_vector = joystick_value

              var direction := Vector3(
                  input_vector.x,
                  0.0,
                  input_vector.y
              )

              if direction.length() > 1.0:
                  direction = direction.normalized()

              player.velocity.x = direction.x * SPEED
              player.velocity.z = direction.z * SPEED

              if not player.is_on_floor():
                  player.velocity.y -= GRAVITY * delta
              else:
                  if Input.is_action_just_pressed("jump"):
                      player.velocity.y = JUMP

              player.move_and_slide()

              update_camera(delta)

          func update_camera(delta):
              if camera == null or player == null:
                  return

              var target := (
                  player.global_position +
                  Vector3(0.0, 1.25, 0.0)
              )

              var desired := (
                  target +
                  Vector3(
                      sin(deg_to_rad(yaw)) * 9.5,
                      4.7,
                      cos(deg_to_rad(yaw)) * 9.5
                  )
              )

              camera.global_position = (
                  camera.global_position.lerp(
                      desired,
                      5.0 * delta
                  )
              )

              camera.look_at(
                  target,
                  Vector3.UP
              )

          func _unhandled_input(event):
              if event is InputEventMouseMotion:
                  if Input.is_mouse_button_pressed(
                      MOUSE_BUTTON_LEFT
                  ):
                      yaw -= event.relative.x * 0.25

              elif event is InputEventScreenTouch:
                  if event.pressed:
                      camera_dragging = true
                      last_touch = event.position
                  else:
                      camera_dragging = false

              elif event is InputEventScreenDrag:
                  if camera_dragging:
                      var movement := (
                          event.position -
                          last_touch
                      )

                      yaw -= movement.x * 0.12

                      last_touch = event.position
          EOF

          cat > export_presets.cfg <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""

          gradle_build/use_gradle_build=false

          package/unique_name="com.mundov1.game"
          package/name="MUNDO V1"
          package/signed=true
          package/app_category=0
          package/retain_data_on_uninstall=false

          version/code=13
          version/name="1.3"

          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false

          permissions/internet=true
          permissions/access_network_state=true

          screen/immersive_mode=true
          screen/orientation=1

          graphics/driver/driver_name="opengl3"
          graphics/driver/driver_name.mobile="opengl3"

          [preset.0.options.splash]

          image=""
          bg_color=Color(0.08, 0.12, 0.18, 1)
          scale=1
          show_image=true
          fullsize=false
          use_filter=true
          EOF

          cat > icon.svg <<'EOF'
          <svg width="128" height="128" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#173d2b"/>
                <stop offset="1" stop-color="#5fa34d"/>
              </linearGradient>
            </defs>

            <rect
              width="128"
              height="128"
              rx="28"
              fill="url(#g)"
            />

            <circle
              cx="64"
              cy="57"
              r="34"
              fill="#78b85a"
            />

            <path
              d="M27 86 Q64 54 101 86"
              fill="none"
              stroke="#dff3ce"
              stroke-width="8"
            />

            <circle
              cx="51"
              cy="54"
              r="5"
              fill="#ffffff"
            />

            <circle
              cx="77"
              cy="54"
              r="5"
              fill="#ffffff"
            />
          </svg>
          EOF

      - name: Configurar Godot Android
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource format=3]

          [resource]

          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF

          test -f "$HOME/.config/godot/editor_settings-4.tres"

      - name: Criar keystore debug
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/.android"

          keytool \
            -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -noprompt || true

          test -f "$HOME/.android/debug.keystore"

      - name: Validar projeto
        shell: bash
        run: |
          set -euxo pipefail

          test -f project.godot
          test -f Main.tscn
          test -f scripts/main.gd
          test -f export_presets.cfg
          test -f icon.svg

          grep -q "gl_compatibility" project.godot
          grep -q 'name="Android"' export_presets.cfg
          grep -q 'arm64-v8a=true' export_presets.cfg
          grep -q 'player.is_on_floor' scripts/main.gd
          grep -q 'create_hills' scripts/main.gd
          grep -q 'create_water' scripts/main.gd
          grep -q 'create_tree' scripts/main.gd
          grep -q 'create_bush' scripts/main.gd
          grep -q 'create_rock' scripts/main.gd

          echo "MUNDO V1.3 validado."

      - name: Testar carregamento Godot
        shell: bash
        run: |
          set -euxo pipefail

          godot \
            --headless \
            --path "$GITHUB_WORKSPACE" \
            --editor \
            --quit

          echo "Projeto Godot carregado corretamente."

      - name: Exportar APK ARM64
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p build

          godot \
            --headless \
            --path "$GITHUB_WORKSPACE" \
            --export-debug "Android" \
            build/MundoV1.apk

          test -f build/MundoV1.apk

          ls -lh build/MundoV1.apk

      - name: Verificar APK
        shell: bash
        run: |
          set -euxo pipefail

          "$ANDROID_HOME/build-tools/34.0.0/apksigner" \
            verify \
            --verbose \
            build/MundoV1.apk

          echo "APK MUNDO V1.3 validado com sucesso."

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MundoV1-APK-V1.3
          path: build/MundoV1.apk
          if-no-files-found: error
