name: MUNDO V1 - V2.3 AAA MOBILE ESTILIZADO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          mkdir -p "$ANDROID_HOME/cmdline-tools"

          cd /tmp

          rm -f commandlinetools.zip

          curl -L \
            -o commandlinetools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip

          rm -rf "$ANDROID_HOME/cmdline-tools/latest"

          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"

          unzip -q commandlinetools.zip \
            -d "$ANDROID_HOME/cmdline-tools/latest"

          if [ -d "$ANDROID_HOME/cmdline-tools/latest/cmdline-tools" ]; then
            mv "$ANDROID_HOME/cmdline-tools/latest/cmdline-tools/"* \
              "$ANDROID_HOME/cmdline-tools/latest/"
            rm -rf "$ANDROID_HOME/cmdline-tools/latest/cmdline-tools"
          fi

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Baixar Godot 4.3
        shell: bash
        run: |
          set -euxo pipefail

          cd /tmp

          rm -rf godot
          mkdir -p godot

          curl -L \
            -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip

          unzip -q godot.zip -d godot

          GODOT_BIN="$(find /tmp/godot -type f -name 'Godot_v4.3-stable_linux.x86_64' | head -n 1)"

          test -n "$GODOT_BIN"

          chmod +x "$GODOT_BIN"

          sudo cp "$GODOT_BIN" /usr/local/bin/godot

          godot --version

      - name: Instalar templates Android do Godot
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"

          cd /tmp

          rm -f templates.tpz

          curl -L \
            -o templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz

          rm -rf templates
          mkdir -p templates

          unzip -q templates.tpz -d templates

          TEMPLATE_ROOT="$(find templates -type d -name 'templates' | head -n 1)"

          if [ -n "$TEMPLATE_ROOT" ]; then
            cp -r "$TEMPLATE_ROOT"/* \
              "$HOME/.local/share/godot/export_templates/4.3.stable/"
          else
            cp -r templates/* \
              "$HOME/.local/share/godot/export_templates/4.3.stable/"
          fi

          ls -la "$HOME/.local/share/godot/export_templates/4.3.stable"

      - name: Criar projeto MUNDO V1 V2.3
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf build
          mkdir -p build
          mkdir -p scripts

          cat > project.godot <<'EOF'
          ; MUNDO V1 - V2.3 AAA MOBILE ESTILIZADO

          config_version=5

          [application]

          config/name="MUNDO V1"
          config/description="MUNDO V1 - AAA Mobile Estilizado"
          run/main_scene="res://Main.tscn"
          config/features=PackedStringArray("4.3", "GL Compatibility")
          boot_splash/bg_color=Color(0.035, 0.055, 0.075, 1)
          boot_splash/show_image=false

          [display]

          window/size/viewport_width=1280
          window/size/viewport_height=720
          window/size/window_width_override=1280
          window/size/window_height_override=720
          window/stretch/mode="canvas_items"

          [rendering]

          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          textures/default_filters/use_nearest_mipmap_filter=false
          textures/vram_compression/import_etc2_astc=true
          environment/defaults/default_clear_color=Color(0.12, 0.20, 0.27, 1)

          [physics]

          3d/default_gravity=18.0

          [input]

          move_forward={
          "deadzone": 0.5,
          "events": [Object(InputEventKey,"physical_keycode":87)]
          }

          move_back={
          "deadzone": 0.5,
          "events": [Object(InputEventKey,"physical_keycode":83)]
          }

          move_left={
          "deadzone": 0.5,
          "events": [Object(InputEventKey,"physical_keycode":65)]
          }

          move_right={
          "deadzone": 0.5,
          "events": [Object(InputEventKey,"physical_keycode":68)]
          }

          jump={
          "deadzone": 0.5,
          "events": [Object(InputEventKey,"physical_keycode":32)]
          }

          sprint={
          "deadzone": 0.5,
          "events": [Object(InputEventKey,"physical_keycode":4194325)]
          }

          [application/android]

          package/unique_name="com.mundov1.game"
          package/name="MUNDO V1"
          version/code=23
          version/name="2.3"

          [display/window]

          size/viewport_width=1280
          size/viewport_height=720
          size/window_width_override=1280
          size/window_height_override=720
          stretch/mode="canvas_items"

          [audio]

          driver/enable_input=false
          EOF

          cat > Main.tscn <<'EOF'
          [gd_scene load_steps=2 format=3]

          [ext_resource path="res://scripts/main.gd" type="Script" id="1"]

          [node name="MundoV1" type="Node3D"]
          script = ExtResource("1")
          EOF

          cat > icon.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#5DB7E8"/>
                <stop offset="1" stop-color="#1D5C72"/>
              </linearGradient>
              <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#78C95C"/>
                <stop offset="1" stop-color="#28683A"/>
              </linearGradient>
            </defs>
            <rect width="256" height="256" rx="54" fill="url(#bg)"/>
            <circle cx="190" cy="64" r="31" fill="#FFE9A9"/>
            <path d="M0 185 C60 145 95 170 145 150 C190 132 218 145 256 120 L256 256 L0 256 Z" fill="#315F42"/>
            <path d="M0 205 C65 176 111 194 163 172 C205 155 229 164 256 149 L256 256 L0 256 Z" fill="#4D8750"/>
            <rect x="116" y="109" width="18" height="78" rx="8" fill="#714A2F"/>
            <circle cx="125" cy="91" r="43" fill="url(#leaf)"/>
            <circle cx="93" cy="107" r="29" fill="#4D9A47"/>
            <circle cx="157" cy="107" r="30" fill="#4C9444"/>
            <circle cx="125" cy="65" r="32" fill="#74C456"/>
          </svg>
          EOF

          cat > scripts/main.gd <<'EOF'
          extends Node3D

          var player: CharacterBody3D
          var camera: Camera3D
          var joystick_base: Control
          var joystick_knob: Control

          var move_input: Vector2 = Vector2.ZERO
          var joystick_active: bool = false
          var joystick_touch_id: int = -1
          var joystick_center: Vector2 = Vector2.ZERO

          var stamina: float = 100.0
          var health: float = 100.0
          var wood: int = 0
          var stone: int = 0

          var water_time: float = 0.0
          var camera_distance: float = 8.6
          var camera_height: float = 4.8
          var camera_smooth: float = 6.0

          var ui_status: Label
          var ui_inventory: Label
          var ui_stamina: Label

          func _ready() -> void:
              create_world()
              create_player()
              create_ui()

          func make_material(color: Color, roughness: float = 0.75, metallic: float = 0.0) -> StandardMaterial3D:
              var material: StandardMaterial3D = StandardMaterial3D.new()
              material.albedo_color = color
              material.roughness = roughness
              material.metallic = metallic
              return material

          func make_transparent_material(color: Color, roughness: float = 0.15) -> StandardMaterial3D:
              var material: StandardMaterial3D = StandardMaterial3D.new()
              material.albedo_color = color
              material.transparency = BaseMaterial3D.TRANSPARENCY_ALPHA
              material.shading_mode = BaseMaterial3D.SHADING_MODE_PER_PIXEL
              material.cull_mode = BaseMaterial3D.CULL_DISABLED
              material.roughness = roughness
              return material

          func create_world() -> void:
              var world_environment: WorldEnvironment = WorldEnvironment.new()
              world_environment.name = "AAA_Environment"

              var environment: Environment = Environment.new()
              environment.background_mode = Environment.BG_COLOR
              environment.background_color = Color("#83c9eb")
              environment.ambient_light_source = Environment.AMBIENT_SOURCE_COLOR
              environment.ambient_light_color = Color("#eaf7ff")
              environment.ambient_light_energy = 0.92
              environment.tonemap_mode = Environment.TONE_MAPPER_FILMIC
              environment.tonemap_exposure = 1.08
              environment.glow_enabled = true
              environment.glow_intensity = 0.7
              environment.glow_strength = 0.8
              environment.fog_enabled = true
              environment.fog_light_color = Color("#b7dcef")
              environment.fog_density = 0.0045
              environment.fog_sky_affect = 0.45

              world_environment.environment = environment
              add_child(world_environment)

              var sun: DirectionalLight3D = DirectionalLight3D.new()
              sun.name = "Sun"
              sun.rotation_degrees = Vector3(-48.0, -32.0, 0.0)
              sun.light_color = Color("#fff0d2")
              sun.light_energy = 1.28
              sun.shadow_enabled = true
              sun.directional_shadow_max_distance = 95.0
              sun.directional_shadow_split_1 = 0.12
              sun.directional_shadow_split_2 = 0.35
              sun.directional_shadow_split_3 = 0.68
              sun.directional_shadow_max_distance = 95.0
              sun.shadow_bias = 0.035
              add_child(sun)

              var fill: DirectionalLight3D = DirectionalLight3D.new()
              fill.name = "SkyFill"
              fill.rotation_degrees = Vector3(-25.0, 145.0, 0.0)
              fill.light_color = Color("#b8ddff")
              fill.light_energy = 0.22
              fill.shadow_enabled = false
              add_child(fill)

              create_ground()
              create_water()
              create_hills()
              create_vegetation()
              create_resources()

          func create_ground() -> void:
              var ground_body: StaticBody3D = StaticBody3D.new()
              ground_body.name = "Ground"

              var ground: MeshInstance3D = MeshInstance3D.new()
              var mesh: PlaneMesh = PlaneMesh.new()
              mesh.size = Vector2(120.0, 120.0)
              mesh.subdivide_width = 30
              mesh.subdivide_depth = 30
              ground.mesh = mesh
              ground.position.y = -0.12
              ground.material_override = make_material(Color("#568b49"), 0.94)
              ground_body.add_child(ground)

              var collision: CollisionShape3D = CollisionShape3D.new()
              var shape: BoxShape3D = BoxShape3D.new()
              shape.size = Vector3(120.0, 0.5, 120.0)
              collision.shape = shape
              collision.position.y = -0.35
              ground_body.add_child(collision)

              add_child(ground_body)

              for i in range(20):
                  var patch: MeshInstance3D = MeshInstance3D.new()
                  var patch_mesh: CylinderMesh = CylinderMesh.new()
                  patch_mesh.top_radius = randf_range(1.5, 4.0)
                  patch_mesh.bottom_radius = patch_mesh.top_radius * 1.15
                  patch_mesh.height = 0.018
                  patch.mesh = patch_mesh
                  patch.position = Vector3(
                      randf_range(-45.0, 45.0),
                      -0.02,
                      randf_range(-42.0, 42.0)
                  )
                  patch.material_override = make_material(
                      Color("#5f9850"),
                      1.0
                  )
                  add_child(patch)

          func create_water() -> void:
              var water: MeshInstance3D = MeshInstance3D.new()
              water.name = "Water"

              var mesh: PlaneMesh = PlaneMesh.new()
              mesh.size = Vector2(48.0, 29.0)
              mesh.subdivide_width = 18
              mesh.subdivide_depth = 14

              water.mesh = mesh
              water.position = Vector3(12.0, 0.075, -10.0)

              var material: StandardMaterial3D = make_transparent_material(
                  Color(0.035, 0.36, 0.58, 0.78),
                  0.08
              )

              water.material_override = material
              water.set_meta("base_y", 0.075)
              water.add_to_group("water")
              add_child(water)

              for i in range(12):
                  var shine: MeshInstance3D = MeshInstance3D.new()
                  var shine_mesh: BoxMesh = BoxMesh.new()
                  shine_mesh.size = Vector3(
                      randf_range(1.2, 4.0),
                      0.012,
                      randf_range(0.08, 0.18)
                  )
                  shine.mesh = shine_mesh
                  shine.position = Vector3(
                      randf_range(-8.0, 30.0),
                      0.10,
                      randf_range(-22.0, 2.0)
                  )
                  shine.rotation_degrees.y = randf_range(-20.0, 20.0)
                  shine.material_override = make_material(
                      Color(0.65, 0.88, 0.98),
                      0.05
                  )
                  shine.add_to_group("water_shine")
                  add_child(shine)

              for i in range(15):
                  var shore: MeshInstance3D = MeshInstance3D.new()
                  var shore_mesh: CylinderMesh = CylinderMesh.new()
                  shore_mesh.top_radius = randf_range(0.5, 2.2)
                  shore_mesh.bottom_radius = shore_mesh.top_radius * 1.25
                  shore_mesh.height = 0.035
                  shore.mesh = shore_mesh
                  shore.position = Vector3(
                      randf_range(-8.0, 32.0),
                      0.02,
                      randf_range(-25.0, 5.0)
                  )
                  shore.material_override = make_material(Color("#9d9a67"), 0.96)
                  add_child(shore)

          func create_hills() -> void:
              var positions: Array[Vector3] = [
                  Vector3(-28.0, 2.8, -25.0),
                  Vector3(34.0, 3.5, -24.0),
                  Vector3(-38.0, 2.4, 25.0),
                  Vector3(37.0, 2.8, 24.0),
                  Vector3(4.0, 1.8, -35.0)
              ]

              for position in positions:
                  var hill: MeshInstance3D = MeshInstance3D.new()
                  var mesh: SphereMesh = SphereMesh.new()
                  mesh.radius = randf_range(8.0, 12.0)
                  mesh.height = randf_range(5.0, 8.0)
                  mesh.radial_segments = 20
                  mesh.rings = 10
                  hill.mesh = mesh
                  hill.position = position
                  hill.scale = Vector3(1.35, 0.65, 1.1)
                  hill.material_override = make_material(Color("#5a8d4b"), 0.98)
                  add_child(hill)

          func create_vegetation() -> void:
              var tree_positions: Array[Vector3] = [
                  Vector3(-18, 0, -5),
                  Vector3(-25, 0, 8),
                  Vector3(-31, 0, -12),
                  Vector3(-17, 0, 20),
                  Vector3(30, 0, 8),
                  Vector3(35, 0, -3),
                  Vector3(29, 0, -25),
                  Vector3(4, 0, -28),
                  Vector3(-2, 0, 29),
                  Vector3(18, 0, 25),
                  Vector3(-39, 0, -3),
                  Vector3(41, 0, 15),
                  Vector3(9, 0, 32),
                  Vector3(-9, 0, -25)
              ]

              for position in tree_positions:
                  create_tree(position)

              var pine_positions: Array[Vector3] = [
                  Vector3(-34, 0, -26),
                  Vector3(37, 0, -17),
                  Vector3(-34, 0, 18),
                  Vector3(22, 0, -34),
                  Vector3(0, 0, 39),
                  Vector3(44, 0, -28)
              ]

              for position in pine_positions:
                  create_pine(position)

              for i in range(56):
                  create_bush(Vector3(
                      randf_range(-46.0, 46.0),
                      0.0,
                      randf_range(-42.0, 42.0)
                  ))

              for i in range(86):
                  create_grass(Vector3(
                      randf_range(-48.0, 48.0),
                      0.0,
                      randf_range(-43.0, 43.0)
                  ))

              for i in range(34):
                  create_flower(Vector3(
                      randf_range(-43.0, 43.0),
                      0.0,
                      randf_range(-40.0, 40.0)
                  ))

              for i in range(14):
                  create_rock(Vector3(
                      randf_range(-45.0, 45.0),
                      0.0,
                      randf_range(-42.0, 42.0)
                  ))

          func create_tree(position: Vector3) -> void:
              var root: Node3D = Node3D.new()
              root.position = position
              add_child(root)

              var trunk: MeshInstance3D = MeshInstance3D.new()
              var trunk_mesh: CylinderMesh = CylinderMesh.new()
              trunk_mesh.top_radius = 0.20
              trunk_mesh.bottom_radius = 0.34
              trunk_mesh.height = randf_range(2.5, 3.5)
              trunk_mesh.radial_segments = 10
              trunk.mesh = trunk_mesh
              trunk.position.y = trunk_mesh.height * 0.5
              trunk.rotation_degrees.z = randf_range(-3.0, 3.0)
              trunk.material_override = make_material(Color("#65452f"), 0.98)
              root.add_child(trunk)

              var branch: MeshInstance3D = MeshInstance3D.new()
              var branch_mesh: CylinderMesh = CylinderMesh.new()
              branch_mesh.top_radius = 0.08
              branch_mesh.bottom_radius = 0.18
              branch_mesh.height = 1.4
              branch_mesh.radial_segments = 8
              branch.mesh = branch_mesh
              branch.position = Vector3(0.3, 2.15, 0)
              branch.rotation_degrees.z = -48.0
              branch.material_override = make_material(Color("#62442e"), 0.98)
              root.add_child(branch)

              var crown_positions: Array[Vector3] = [
                  Vector3(0, 3.45, 0),
                  Vector3(-0.65, 3.05, 0.05),
                  Vector3(0.65, 3.1, -0.08),
                  Vector3(0, 3.05, 0.65),
                  Vector3(0, 3.95, 0)
              ]

              for crown_position in crown_positions:
                  var crown: MeshInstance3D = MeshInstance3D.new()
                  var crown_mesh: SphereMesh = SphereMesh.new()
                  crown_mesh.radius = randf_range(0.85, 1.25)
                  crown_mesh.height = randf_range(1.35, 1.85)
                  crown.mesh = crown_mesh
                  crown.position = crown_position
                  crown.scale = Vector3(1.05, 0.88, 1.0)
                  crown.material_override = make_material(
                      Color("#3f8b45"),
                      0.88
                  )
                  root.add_child(crown)

          func create_pine(position: Vector3) -> void:
              var root: Node3D = Node3D.new()
              root.position = position
              add_child(root)

              var trunk: MeshInstance3D = MeshInstance3D.new()
              var trunk_mesh: CylinderMesh = CylinderMesh.new()
              trunk_mesh.top_radius = 0.13
              trunk_mesh.bottom_radius = 0.25
              trunk_mesh.height = 3.8
              trunk_mesh.radial_segments = 8
              trunk.mesh = trunk_mesh
              trunk.position.y = 1.9
              trunk.material_override = make_material(Color("#62432d"), 1.0)
              root.add_child(trunk)

              for j in range(4):
                  var layer: MeshInstance3D = MeshInstance3D.new()
                  var layer_mesh: CylinderMesh = CylinderMesh.new()
                  layer_mesh.top_radius = 0.05
                  layer_mesh.bottom_radius = 1.45 - float(j) * 0.20
                  layer_mesh.height = 1.25
                  layer_mesh.radial_segments = 12
                  layer.mesh = layer_mesh
                  layer.position.y = 2.0 + float(j) * 0.62
                  layer.material_override = make_material(
                      Color("#2f713d"),
                      0.9
                  )
                  root.add_child(layer)

          func create_bush(position: Vector3) -> void:
              var bush: MeshInstance3D = MeshInstance3D.new()
              var mesh: SphereMesh = SphereMesh.new()
              mesh.radius = randf_range(0.35, 0.65)
              mesh.height = randf_range(0.55, 0.95)
              bush.mesh = mesh
              bush.position = position + Vector3(0, 0.38, 0)
              bush.scale = Vector3(1.2, 0.8, 1.0)
              bush.material_override = make_material(
                  Color("#4f9849"),
                  0.92
              )
              add_child(bush)

          func create_grass(position: Vector3) -> void:
              var root: Node3D = Node3D.new()
              root.position = position
              add_child(root)

              for j in range(3):
                  var blade: MeshInstance3D = MeshInstance3D.new()
                  var mesh: BoxMesh = BoxMesh.new()
                  mesh.size = Vector3(
                      randf_range(0.035, 0.07),
                      randf_range(0.35, 0.65),
                      0.035
                  )
                  blade.mesh = mesh
                  blade.position = Vector3(
                      randf_range(-0.12, 0.12),
                      mesh.size.y * 0.5,
                      randf_range(-0.12, 0.12)
                  )
                  blade.rotation_degrees.z = randf_range(-18.0, 18.0)
                  blade.material_override = make_material(
                      Color("#72aa52"),
                      0.95
                  )
                  root.add_child(blade)

          func create_flower(position: Vector3) -> void:
              var root: Node3D = Node3D.new()
              root.position = position
              add_child(root)

              var stem: MeshInstance3D = MeshInstance3D.new()
              var stem_mesh: CylinderMesh = CylinderMesh.new()
              stem_mesh.top_radius = 0.012
              stem_mesh.bottom_radius = 0.025
              stem_mesh.height = 0.42
              stem.mesh = stem_mesh
              stem.position.y = 0.21
              stem.material_override = make_material(Color("#4b7f40"), 0.95)
              root.add_child(stem)

              var flower: MeshInstance3D = MeshInstance3D.new()
              var flower_mesh: SphereMesh = SphereMesh.new()
              flower_mesh.radius = 0.10
              flower_mesh.height = 0.16
              flower.mesh = flower_mesh
              flower.position.y = 0.48

              var flower_colors: Array[Color] = [
                  Color("#f2b34e"),
                  Color("#f1d86c"),
                  Color("#e98d98"),
                  Color("#dba9df")
              ]

              flower.material_override = make_material(
                  flower_colors[randi() % flower_colors.size()],
                  0.55
              )
              root.add_child(flower)

          func create_rock(position: Vector3) -> void:
              var rock: MeshInstance3D = MeshInstance3D.new()
              var mesh: SphereMesh = SphereMesh.new()
              mesh.radius = randf_range(0.45, 0.9)
              mesh.height = randf_range(0.45, 0.9)
              rock.mesh = mesh
              rock.position = position + Vector3(0, mesh.height * 0.35, 0)
              rock.scale = Vector3(
                  randf_range(1.1, 1.7),
                  0.65,
                  randf_range(0.8, 1.4)
              )
              rock.rotation_degrees.y = randf_range(0.0, 360.0)
              rock.material_override = make_material(
                  Color("#777b78"),
                  0.94
              )
              add_child(rock)

          func create_resources() -> void:
              var positions: Array[Vector3] = [
                  Vector3(-7, 0, 3),
                  Vector3(8, 0, -1),
                  Vector3(18, 0, 11),
                  Vector3(-19, 0, -18),
                  Vector3(23, 0, -15),
                  Vector3(-27, 0, 14)
              ]

              for i in range(positions.size()):
                  var resource: Area3D = Area3D.new()
                  resource.name = "Resource_%d" % i
                  resource.position = positions[i]
                  resource.set_meta("resource_type", "MADEIRA" if i % 2 == 0 else "PEDRA")
                  resource.set_meta("collected", false)

                  var collision: CollisionShape3D = CollisionShape3D.new()
                  var sphere: SphereShape3D = SphereShape3D.new()
                  sphere.radius = 1.0
                  collision.shape = sphere
                  resource.add_child(collision)

                  if i % 2 == 0:
                      create_wood_resource(resource)
                  else:
                      create_stone_resource(resource)

                  resource.body_entered.connect(_on_resource_body_entered.bind(resource))
                  add_child(resource)

          func create_wood_resource(parent: Node3D) -> void:
              var trunk: MeshInstance3D = MeshInstance3D.new()
              var mesh: CylinderMesh = CylinderMesh.new()
              mesh.top_radius = 0.28
              mesh.bottom_radius = 0.42
              mesh.height = 1.1
              mesh.radial_segments = 8
              trunk.mesh = mesh
              trunk.position.y = 0.55
              trunk.material_override = make_material(Color("#744d30"), 0.96)
              parent.add_child(trunk)

              var leaf: MeshInstance3D = MeshInstance3D.new()
              var leaf_mesh: SphereMesh = SphereMesh.new()
              leaf_mesh.radius = 0.55
              leaf_mesh.height = 0.8
              leaf.mesh = leaf_mesh
              leaf.position = Vector3(0, 1.25, 0)
              leaf.material_override = make_material(Color("#4d8d43"), 0.9)
              parent.add_child(leaf)

          func create_stone_resource(parent: Node3D) -> void:
              var rock: MeshInstance3D = MeshInstance3D.new()
              var mesh: SphereMesh = SphereMesh.new()
              mesh.radius = 0.75
              mesh.height = 0.95
              rock.mesh = mesh
              rock.position.y = 0.5
              rock.scale = Vector3(1.25, 0.75, 1.0)
              rock.material_override = make_material(Color("#7b7f80"), 0.92)
              parent.add_child(rock)

